legend:[{en:"Right side receives used blood and sends it to the lungs",bn:"ডান পাশ ব্যবহৃত রক্ত নিয়ে ফুসফুসে পাঠায়"},{en:"Left side receives oxygen-rich blood and pumps it out",bn:"বাঁ পাশ অক্সিজেনসমৃদ্ধ রক্ত নিয়ে সারা শরীরে পাঠায়"},{en:"Valves stop blood from flowing backwards",bn:"কপাটিকা রক্তকে উল্টো দিকে যেতে দেয় না"}],
body:{en:"The heart is a muscular pump divided into four chambers, and the two sides never mix. Blood returning from the body is low in oxygen and enters the right side, which pushes it a short distance to the lungs. There it picks up oxygen and returns to the left side, whose thicker muscular wall drives it out through the aorta to every tissue. One-way valves between chambers snap shut after each contraction, and it is that closing which produces the familiar double heartbeat sound. An adult heart beats roughly a hundred thousand times a day without rest.",bn:"হৃদপিণ্ড চার প্রকোষ্ঠে বিভক্ত একটি পেশিবহুল পাম্প, আর দুই পাশের রক্ত কখনো মেশে না। শরীর থেকে ফেরা রক্তে অক্সিজেন কম থাকে, তা ডান পাশে ঢোকে, যা তাকে অল্প দূরত্বে ফুসফুসে ঠেলে দেয়। সেখানে অক্সিজেন নিয়ে রক্ত বাঁ পাশে ফেরে, যার পুরু পেশিপ্রাচীর তাকে মহাধমনী দিয়ে প্রতিটি কলায় পাঠায়। প্রকোষ্ঠগুলোর মাঝের একমুখী কপাটিকা প্রতিটি সংকোচনের পর বন্ধ হয়ে যায়, আর সেই বন্ধ হওয়াই চেনা দ্বৈত হৃদস্পন্দনের শব্দ তৈরি করে। প্রাপ্তবয়স্কের হৃদপিণ্ড বিশ্রাম ছাড়াই দিনে প্রায় এক লাখ বার স্পন্দিত হয়।"},
pts:[{en:"Arteries carry blood away from the heart, veins carry it back",bn:"ধমনী হৃদপিণ্ড থেকে রক্ত নিয়ে যায়, শিরা ফিরিয়ে আনে"},{en:"The heart has its own pacemaker cells and sets its own rhythm",bn:"হৃদপিণ্ডের নিজস্ব পেসমেকার কোষ আছে, তা নিজেই ছন্দ ঠিক করে"},{en:"Blood pressure readings give the peak and resting pressures",bn:"রক্তচাপের দুটি সংখ্যা সর্বোচ্চ ও বিশ্রামকালীন চাপ বোঝায়"}]},

{i:43,cat:"bio",k:"dna gene chromosome heredity double helix ডিএনএ",
t:{en:"What is DNA?",bn:"ডিএনএ কী?"},
s:{en:"A long coded molecule inside cells carrying the instructions for building and running a living organism.",bn:"কোষের ভেতরের দীর্ঘ সাংকেতিক অণু, যা জীব গঠন ও পরিচালনার নির্দেশনা বহন করে।"},
svg:S(`<g class="ln"><path d="M120 24 q60 26 0 52 q-60 26 0 52 q60 26 0 52"/><path d="M200 24 q-60 26 0 52 q60 26 0 52 q-60 26 0 52"/>${[0,1,2,3,4,5,6,7].map(n=>`<line x1="${124+Math.abs(Math.sin(n*0.8))*14}" y1="${34+n*18}" x2="${196-Math.abs(Math.sin(n*0.8))*14}" y2="${34+n*18}"/>`).join("")}</g><g class="ln"><path d="M60 96 H96 M88 88 L96 96 L88 104"/><circle cx="40" cy="96" r="18"/><circle cx="40" cy="96" r="7" fill="currentColor"/></g><g class="ln"><path d="M232 96 H268 M260 88 L268 96 L260 104"/><rect x="276" y="80" width="34" height="32" rx="4"/></g>${M(40,140,1)}${M(160,10,2)}${M(292,140,3)}`),
legend:[{en:"DNA is packed inside the nucleus of nearly every cell",bn:"প্রায় প্রতিটি কোষের নিউক্লিয়াসে ডিএনএ গুটিয়ে রাখা থাকে"},{en:"Two strands twist together, joined by paired chemical letters",bn:"জোড়া রাসায়নিক অক্ষরে যুক্ত দুটি সূত্র পেঁচিয়ে থাকে"},{en:"Sections called genes are read as recipes for proteins",bn:"জিন নামের অংশগুলো প্রোটিন তৈরির নির্দেশ হিসেবে পড়া হয়"}],
body:{en:"DNA stores information in a four-letter chemical alphabet, and the letters always pair the same way across the two strands — which is what allows the molecule to be copied exactly before a cell divides. A gene is a stretch of that code specifying one protein, and proteins do nearly all the actual work of a body, from digesting food to building bone. Humans have around twenty thousand genes packed into forty-six chromosomes, and you inherit one set from each parent. Small copying errors are the raw material of variation and, over long timescales, of evolution.",bn:"ডিএনএ তথ্য জমা রাখে চার-অক্ষরের রাসায়নিক বর্ণমালায়, আর দুই সূত্রের অক্ষরগুলো সব সময় একই নিয়মে জোড় বাঁধে — এ কারণেই কোষ বিভাজনের আগে অণুটি হুবহু নকল করা যায়। জিন হলো সেই সংকেতের এমন একটি অংশ যা একটি প্রোটিন নির্দিষ্ট করে, আর খাদ্য হজম থেকে হাড় গঠন পর্যন্ত শরীরের প্রায় সব কাজ প্রোটিনই করে। মানুষের প্রায় বিশ হাজার জিন ছেচল্লিশটি ক্রোমোজোমে গোছানো, আর প্রতিটি পিতামাতা থেকে আপনি এক সেট করে পান। নকলের ছোট ভুলই বৈচিত্র্যের কাঁচামাল, আর দীর্ঘ সময়ে বিবর্তনের।"},
pts:[{en:"Stretched out, the DNA in one cell would be about two metres long",bn:"টেনে সোজা করলে একটি কোষের ডিএনএ প্রায় দুই মিটার লম্বা হবে"},{en:"Humans share the great majority of their DNA with each other",bn:"মানুষে মানুষে ডিএনএর বিশাল অংশই অভিন্ন"},{en:"DNA fingerprinting identifies individuals from tiny biological traces",bn:"ডিএনএ ফিঙ্গারপ্রিন্টিং সামান্য জৈব নমুনা থেকেই ব্যক্তি শনাক্ত করে"}]},

{i:44,cat:"bio",k:"breathing lungs oxygen diaphragm alveoli শ্বাস ফুসফুস",
t:{en:"How do we breathe?",bn:"আমরা শ্বাস নিই কীভাবে?"},
s:{en:"A muscle below the lungs flattens to enlarge the chest, lowering pressure so air rushes in on its own.",bn:"ফুসফুসের নিচের পেশি চ্যাপ্টা হয়ে বুক বড় করে, চাপ কমে যায় আর বাতাস নিজেই ঢুকে পড়ে।"},
svg:S(`<path class="ln" d="M160 20 V50"/><path class="ln" d="M160 50 q-16 4-26 20 q-20 32-16 60 q2 16 18 16 q18 0 22-20 q4-24 2-76 Z"/><path class="ln" d="M160 50 q16 4 26 20 q20 32 16 60 q-2 16-18 16 q-18 0-22-20 q-4-24-2-76 Z"/><path class="fl" d="M160 50 q-16 4-26 20 q-20 32-16 60 q2 16 18 16 q18 0 22-20 q4-24 2-76 Z"/><path class="ln" d="M96 158 q64-24 128 0"/><path class="ln2" d="M96 172 q64-24 128 0"/><g class="ln"><path d="M160 30 V6 M152 14 L160 4 L168 14"/><path d="M124 154 V172 M116 164 L124 174 L132 164"/></g><g class="ln"><circle cx="252" cy="96" r="8"/><circle cx="268" cy="110" r="8"/><circle cx="266" cy="82" r="8"/><path d="M240 96 h-10"/></g>${M(160,10,1)}${M(160,180,2)}${M(292,96,3)}`),
legend:[{en:"Air travels down the windpipe into branching tubes",bn:"বাতাস শ্বাসনালী বেয়ে শাখা-প্রশাখা নলে ঢোকে"},{en:"The diaphragm flattens, expanding the chest cavity",bn:"মধ্যচ্ছদা চ্যাপ্টা হয়ে বুকের গহ্বর বড় করে"},{en:"Oxygen crosses into blood at millions of tiny air sacs",bn:"লক্ষ লক্ষ ক্ষুদ্র বায়ুথলিতে অক্সিজেন রক্তে ঢোকে"}],
body:{en:"Lungs have no muscles of their own; they are inflated by changing the pressure around them. The diaphragm, a sheet of muscle below the ribs, contracts and moves down while the rib muscles lift the ribcage outward, and the enlarged space drops the internal pressure below that of the outside air. Air then flows in simply because pressure equalises. Deep inside, the tubes branch into hundreds of millions of thin-walled sacs called alveoli, giving a huge surface where oxygen diffuses into the blood and carbon dioxide diffuses out. Breathing out is mostly passive — the muscles relax and elastic tissue springs back.",bn:"ফুসফুসের নিজস্ব পেশি নেই; চারপাশের চাপ বদলেই তা ফোলে। পাঁজরের নিচের পেশির পাত মধ্যচ্ছদা সংকুচিত হয়ে নিচে নামে, আর পাঁজরের পেশি বুকের খাঁচা বাইরের দিকে তোলে, বড় হওয়া জায়গায় ভেতরের চাপ বাইরের বাতাসের চেয়ে কমে যায়। তখন কেবল চাপ সমান হওয়ার নিয়মেই বাতাস ঢুকে পড়ে। ভেতরে নলগুলো শাখা হতে হতে কোটি কোটি পাতলা দেয়ালের থলিতে পরিণত হয়, যাদের বলে অ্যালভিওলাই, এতে বিশাল পৃষ্ঠতল তৈরি হয় যেখানে অক্সিজেন রক্তে ছড়িয়ে যায় ও কার্বন ডাই-অক্সাইড বেরিয়ে আসে। শ্বাস ছাড়া বেশিরভাগই নিষ্ক্রিয় — পেশি শিথিল হয় আর স্থিতিস্থাপক কলা ফিরে আসে।"},
pts:[{en:"The alveoli together would cover roughly half a tennis court",bn:"সব অ্যালভিওলাই মিলে প্রায় অর্ধেক টেনিস কোর্ট ঢেকে দেবে"},{en:"Breathing rate is driven by carbon dioxide levels, not oxygen",bn:"শ্বাসের হার নিয়ন্ত্রণ করে কার্বন ডাই-অক্সাইডের মাত্রা, অক্সিজেন নয়"},{en:"Smoke and dust destroy the cilia that sweep the airways clean",bn:"ধোঁয়া ও ধুলা শ্বাসনালী পরিষ্কার রাখা সিলিয়া নষ্ট করে"}]},

{i:45,cat:"bio",k:"brain neuron synapse memory nervous মস্তিষ্ক",
t:{en:"How does the brain work?",bn:"মস্তিষ্ক কীভাবে কাজ করে?"},
s:{en:"Billions of nerve cells pass electrical and chemical signals across junctions, forming networks that store and process information.",bn:"কোটি কোটি স্নায়ুকোষ সংযোগস্থলে বৈদ্যুতিক ও রাসায়নিক সংকেত চালাচালি করে, এমন জাল গড়ে যা তথ্য জমায় ও প্রক্রিয়া করে।"},
svg:S(`<path class="ln" d="M100 60 q-30 6-30 34 q0 30 34 34 q10 24 40 24 q34 0 40-26 q30-8 30-34 q0-30-32-34 q-8-22-38-22 q-32 0-44 24 Z"/><path class="fl" d="M100 60 q-30 6-30 34 q0 30 34 34 q10 24 40 24 q34 0 40-26 q30-8 30-34 q0-30-32-34 q-8-22-38-22 q-32 0-44 24 Z"/><path class="ln2" d="M104 78 q30 10 20 34 q-10 24 16 34 M170 66 q-14 26 10 36 q22 10 8 34"/><g class="ln"><circle cx="256" cy="66" r="9"/><path d="M256 75 V112 M247 60 l-12-8 M265 60 l12-8 M247 74 l-12 8"/><circle cx="256" cy="122" r="5" fill="currentColor"/><path d="M244 132 h24"/></g>${M(140,148,1)}${M(256,44,2)}${M(256,152,3)}`),
legend:[{en:"Different regions specialise in vision, speech, movement and memory",bn:"বিভিন্ন অংশ দৃষ্টি, ভাষা, নড়াচড়া ও স্মৃতিতে বিশেষায়িত"},{en:"A neuron collects signals through branching fibres",bn:"স্নায়ুকোষ শাখাযুক্ত তন্তু দিয়ে সংকেত সংগ্রহ করে"},{en:"At the synapse, chemicals carry the signal to the next cell",bn:"সাইন্যাপসে রাসায়নিক পদার্থ সংকেত পরের কোষে পৌঁছায়"}],
body:{en:"The brain contains on the order of eighty-six billion neurons, each connected to thousands of others. A signal travels along a neuron as a moving electrical pulse, but at the gap between cells it converts into chemical messengers that cross and trigger the next cell. What matters is not any single connection but the pattern across networks — perception, language and memory are all distributed activity rather than items stored in one spot. Connections that fire together repeatedly grow stronger, which is the physical basis of learning, and sleep appears to be when these changes are consolidated.",bn:"মস্তিষ্কে প্রায় ছিয়াশি বিলিয়ন স্নায়ুকোষ থাকে, প্রত্যেকটি আরও হাজার হাজারের সঙ্গে যুক্ত। সংকেত স্নায়ুকোষ বরাবর চলন্ত বৈদ্যুতিক স্পন্দন হয়ে যায়, কিন্তু কোষের মাঝের ফাঁকে তা রাসায়নিক বার্তাবাহকে বদলে গিয়ে পার হয় ও পরের কোষকে উদ্দীপ্ত করে। গুরুত্বপূর্ণ কোনো একক সংযোগ নয়, বরং জালজুড়ে নকশা — উপলব্ধি, ভাষা ও স্মৃতি সবই ছড়ানো কার্যক্রম, এক জায়গায় রাখা জিনিস নয়। যেসব সংযোগ বারবার একসঙ্গে সক্রিয় হয় সেগুলো শক্তিশালী হয়, এটাই শেখার ভৌত ভিত্তি, আর ঘুমের সময়েই এই পরিবর্তনগুলো থিতু হয় বলে মনে হয়।"},
pts:[{en:"The brain uses about a fifth of the body's energy",bn:"শরীরের প্রায় এক-পঞ্চমাংশ শক্তি মস্তিষ্কই খরচ করে"},{en:"Nerve signals travel far slower than electricity in a wire",bn:"তারে বিদ্যুতের চেয়ে স্নায়ুসংকেত অনেক ধীরে চলে"},{en:"The brain keeps reshaping its connections throughout life",bn:"সারা জীবন মস্তিষ্ক তার সংযোগ নতুন করে গড়তে থাকে"}]},

{i:46,cat:"bio",k:"bacteria virus microbe infection germ ব্যাকটেরিয়া ভাইরাস",
t:{en:"What is the difference between bacteria and viruses?",bn:"ব্যাকটেরিয়া ও ভাইরাসের পার্থক্য কী?"},
s:{en:"Bacteria are complete living cells that can multiply alone; viruses are inert packets of code that need a host cell.",bn:"ব্যাকটেরিয়া পূর্ণাঙ্গ জীবিত কোষ, একাই বংশবৃদ্ধি করে; ভাইরাস নিষ্ক্রিয় সাংকেতিক মোড়ক, যার পোষক কোষ লাগে।"},
svg:S(`<g class="ln"><rect x="50" y="76" width="70" height="34" rx="17"/><path class="fl" d="M67 76 h36 a17 17 0 0 1 0 34 h-36 a17 17 0 0 1 0-34 Z"/><path d="M120 84 q20-8 30 4 M120 102 q20 10 30-2"/><circle cx="80" cy="93" r="6"/></g><g class="ln"><path d="M216 62 l26 15 v30 l-26 15 l-26-15 v-30 Z"/><path class="fl2" d="M216 62 l26 15 v30 l-26 15 l-26-15 v-30 Z"/><path d="M216 90 a8 8 0 1 0 0 1 Z"/><path d="M190 77 l-14-8 M242 77 l14-8 M216 122 v16 M190 107 l-14 8 M242 107 l14 8"/></g><path class="ln2" d="M160 40 V152"/>${M(85,140,1)}${M(216,40,2)}${M(290,140,3)}`),
legend:[{en:"A bacterium is a self-contained cell with its own machinery",bn:"ব্যাকটেরিয়া নিজস্ব যন্ত্রপাতিসহ একটি স্বয়ংসম্পূর্ণ কোষ"},{en:"A virus is genetic material wrapped in a protein coat",bn:"ভাইরাস হলো প্রোটিন আবরণে মোড়া বংশগত পদার্থ"},{en:"Antibiotics attack bacterial machinery, so they cannot touch viruses",bn:"অ্যান্টিবায়োটিক ব্যাকটেরিয়ার যন্ত্রপাতিতে আঘাত করে, তাই ভাইরাসে কাজ করে না"}],
body:{en:"A bacterium is a living organism: it eats, produces energy, and divides on its own, and most of the bacteria around and inside us are harmless or actively useful, particularly in the gut. A virus has none of that machinery. It is genetic instructions in a protein shell, unable to do anything until it enters a host cell and hijacks that cell's equipment to make copies of itself. This distinction has a direct practical consequence: antibiotics work by disrupting bacterial processes that viruses do not have, so taking them for a cold or flu gives no benefit while helping resistant bacteria to spread.",bn:"ব্যাকটেরিয়া একটি জীবন্ত জীব: এটি খায়, শক্তি তৈরি করে ও নিজেই বিভাজিত হয়, আর আমাদের চারপাশের ও ভেতরের বেশিরভাগ ব্যাকটেরিয়া ক্ষতিকর নয়, বরং উপকারী, বিশেষত অন্ত্রে। ভাইরাসের এসব যন্ত্রপাতি কিছুই নেই। এটি প্রোটিন খোলসে মোড়া বংশগত নির্দেশনা, পোষক কোষে না ঢোকা পর্যন্ত কিছুই করতে পারে না, ঢুকে সেই কোষের সরঞ্জাম দখল করে নিজের নকল বানায়। এই পার্থক্যের সরাসরি ব্যবহারিক ফল আছে: অ্যান্টিবায়োটিক ব্যাকটেরিয়ার এমন প্রক্রিয়া ব্যাহত করে যা ভাইরাসের নেই, তাই সর্দি বা ফ্লুতে তা খেলে কোনো উপকার হয় না, বরং প্রতিরোধী ব্যাকটেরিয়া ছড়াতে সাহায্য করে।"},
pts:[{en:"Your body carries roughly as many bacterial cells as human ones",bn:"শরীরে মানব কোষের প্রায় সমান সংখ্যক ব্যাকটেরিয়া কোষ আছে"},{en:"Viruses are far smaller — most need an electron microscope",bn:"ভাইরাস অনেক ছোট — বেশিরভাগ দেখতে ইলেকট্রন মাইক্রোস্কোপ লাগে"},{en:"Whether viruses count as 'alive' is genuinely debated",bn:"ভাইরাসকে 'জীবিত' বলা যায় কি না তা নিয়ে সত্যিই বিতর্ক আছে"}]},

{i:47,cat:"bio",k:"digestion stomach intestine enzyme nutrient হজম",
t:{en:"How does digestion work?",bn:"হজম কীভাবে হয়?"},
s:{en:"Food is broken down mechanically and chemically until molecules are small enough to pass into the blood.",bn:"খাদ্য যান্ত্রিক ও রাসায়নিকভাবে ভাঙা হয়, যতক্ষণ না অণু এত ছোট হয় যে রক্তে ঢুকতে পারে।"},
svg:S(`<g class="ln"><ellipse cx="80" cy="36" rx="22" ry="14"/><path d="M80 50 V78"/><path d="M80 78 q-26 4-26 26 q0 26 30 26 q26 0 26-24 q0-24-30-28 Z"/><path class="fl" d="M80 78 q-26 4-26 26 q0 26 30 26 q26 0 26-24 q0-24-30-28 Z"/><path d="M104 128 q22 10 12 30"/></g><g class="ln"><path d="M116 158 q40-30 76-6 q30 20 8 34 q-30 18-56-6 q-24-22 4-34 q30-12 54 8"/></g><g class="ln"><path d="M232 96 H272 M264 88 L272 96 L264 104"/><circle cx="292" cy="96" r="12"/><path d="M292 84 V108 M280 96 H304"/></g>${M(80,20,1)}${M(80,150,2)}${M(170,180,3)}`),
legend:[{en:"Chewing and saliva start breaking food apart",bn:"চিবানো ও লালা খাদ্য ভাঙা শুরু করে"},{en:"Stomach acid and enzymes dissolve proteins",bn:"পাকস্থলীর অম্ল ও উৎসেচক প্রোটিন গলায়"},{en:"The small intestine absorbs nutrients into the bloodstream",bn:"ক্ষুদ্রান্ত্র পুষ্টি শোষণ করে রক্তে পাঠায়"}],
body:{en:"Digestion is a disassembly line. Teeth and saliva start the job, the stomach churns food in strong acid that denatures proteins and kills most microbes, and then the small intestine does the real work with enzymes from the pancreas and bile from the liver. Its inner wall is folded and covered in finger-like villi, giving an absorbing surface many times larger than the intestine's length suggests. Broken-down sugars, amino acids and fats pass into blood vessels there. What remains travels to the large intestine, where water is recovered and gut bacteria ferment the leftover fibre.",bn:"হজম আসলে একটি খুলে ফেলার কারখানা। দাঁত ও লালা কাজ শুরু করে, পাকস্থলী খাদ্যকে শক্তিশালী অম্লে মন্থন করে প্রোটিন বিকৃত করে ও বেশিরভাগ জীবাণু মারে, তারপর অগ্ন্যাশয়ের উৎসেচক ও যকৃতের পিত্ত নিয়ে আসল কাজটি করে ক্ষুদ্রান্ত্র। এর ভেতরের দেয়াল ভাঁজ করা এবং আঙুলের মতো ভিলাইয়ে ঢাকা, ফলে শোষণের পৃষ্ঠতল অন্ত্রের দৈর্ঘ্যের তুলনায় বহু গুণ বড় হয়। ভাঙা শর্করা, অ্যামিনো অ্যাসিড ও চর্বি সেখানেই রক্তনালিতে ঢোকে। যা বাকি থাকে তা বৃহদন্ত্রে যায়, সেখানে পানি ফিরিয়ে নেওয়া হয় আর অন্ত্রের ব্যাকটেরিয়া অবশিষ্ট আঁশ গাঁজন করে।"},
pts:[{en:"The stomach's lining renews constantly to avoid digesting itself",bn:"নিজেকে হজম না করতে পাকস্থলীর আস্তরণ অবিরাম নতুন হয়"},{en:"Fibre is not absorbed but keeps the whole system moving",bn:"আঁশ শোষিত হয় না, তবে পুরো ব্যবস্থাকে সচল রাখে"},{en:"Gut bacteria produce vitamins the body cannot make itself",bn:"অন্ত্রের ব্যাকটেরিয়া এমন ভিটামিন বানায় যা শরীর নিজে পারে না"}]},

{i:48,cat:"bio",k:"evolution natural selection species adaptation darwin বিবর্তন",
t:{en:"What is evolution?",bn:"বিবর্তন কী?"},
s:{en:"Inherited traits that help survival become more common over generations, gradually reshaping populations.",bn:"বেঁচে থাকায় সহায়ক বংশগত বৈশিষ্ট্য প্রজন্মের পর প্রজন্মে বাড়তে থাকে, ধীরে ধীরে জনগোষ্ঠীকে বদলে দেয়।"},
svg:S(`<g class="ln"><circle cx="40" cy="60" r="9"/><circle cx="40" cy="96" r="9" fill="currentColor"/><circle cx="40" cy="132" r="9"/></g><path class="ln2" d="M56 60 H110 M56 96 H110 M56 132 H110"/><g class="ln"><circle cx="130" cy="70" r="9"/><circle cx="130" cy="106" r="9" fill="currentColor"/><circle cx="130" cy="140" r="9" fill="currentColor"/></g><path class="ln2" d="M146 70 H200 M146 106 H200 M146 140 H200"/><g class="ln"><circle cx="220" cy="82" r="9" fill="currentColor"/><circle cx="220" cy="116" r="9" fill="currentColor"/><circle cx="220" cy="150" r="9" fill="currentColor"/></g><g class="ln"><path d="M254 106 H296 M288 98 L296 106 L288 114"/></g>${M(40,168,1)}${M(130,26,2)}${M(220,32,3)}`),
legend:[{en:"Individuals in a population naturally vary",bn:"একটি জনগোষ্ঠীর সদস্যদের মধ্যে স্বাভাবিক ভিন্নতা থাকে"},{en:"Some variants survive and reproduce more successfully",bn:"কিছু ভিন্নতা বেশি টিকে থাকে ও বেশি বংশবৃদ্ধি করে"},{en:"Over generations those traits dominate the population",bn:"প্রজন্মের পর প্রজন্মে সেই বৈশিষ্ট্যই প্রধান হয়ে ওঠে"}],
body:{en:"Evolution rests on three observable facts and one conclusion. Offspring inherit traits from parents; those traits vary; and more offspring are born than can survive. It follows that variants which happen to suit the environment leave more descendants, so their proportion rises each generation — natural selection. No individual evolves; populations do, and the process has no goal or foresight. The evidence comes from fossils, comparative anatomy, geographic distribution and, most decisively, DNA comparisons that independently reproduce the same family tree.",bn:"বিবর্তন দাঁড়িয়ে আছে তিনটি পর্যবেক্ষণযোগ্য সত্য ও একটি সিদ্ধান্তের উপর। সন্তান পিতামাতার বৈশিষ্ট্য পায়; সেই বৈশিষ্ট্যে ভিন্নতা থাকে; আর যত সন্তান জন্মায় তত টিকতে পারে না। তা থেকেই আসে, পরিবেশের সঙ্গে মানানসই ভিন্নতাগুলো বেশি বংশধর রেখে যায়, ফলে প্রতি প্রজন্মে তাদের অনুপাত বাড়ে — একেই বলে প্রাকৃতিক নির্বাচন। কোনো একক জীব বিবর্তিত হয় না; হয় জনগোষ্ঠী, আর প্রক্রিয়াটির কোনো লক্ষ্য বা পূর্বদৃষ্টি নেই। প্রমাণ আসে জীবাশ্ম, তুলনামূলক শারীরস্থান, ভৌগোলিক বিস্তার এবং সবচেয়ে জোরালোভাবে ডিএনএ তুলনা থেকে, যা স্বাধীনভাবে একই বংশবৃক্ষ পুনরুৎপাদন করে।"},
pts:[{en:"Antibiotic resistance is evolution observable within months",bn:"অ্যান্টিবায়োটিক প্রতিরোধ কয়েক মাসেই দেখা যাওয়া বিবর্তন"},{en:"'Fittest' means best suited to conditions, not strongest",bn:"'যোগ্যতম' মানে পরিবেশের সঙ্গে সবচেয়ে মানানসই, সবচেয়ে শক্তিশালী নয়"},{en:"Selective breeding of crops and cattle uses the same mechanism deliberately",bn:"ফসল ও গবাদিপশুর নির্বাচিত প্রজনন ইচ্ছাকৃতভাবে একই কৌশল ব্যবহার করে"}]},

{i:49,cat:"bio",k:"eye vision retina lens pupil optic চোখ দৃষ্টি",
t:{en:"How do our eyes see?",bn:"চোখ কীভাবে দেখে?"},
s:{en:"A lens focuses light onto a light-sensitive layer at the back, which sends nerve signals the brain interprets.",bn:"লেন্স আলোকে পেছনের আলোকসংবেদী স্তরে কেন্দ্রীভূত করে, যা স্নায়ুসংকেত পাঠায় আর মস্তিষ্ক তা ব্যাখ্যা করে।"},
svg:S(`<path class="ln" d="M60 96 a90 60 0 0 1 200 0 a90 60 0 0 1-200 0 Z"/><circle cx="160" cy="96" r="46" class="ln"/><path class="fl" d="M160 50 a46 46 0 1 0 0 92 a46 46 0 1 0 0-92"/><circle cx="160" cy="96" r="18" class="ln" fill="currentColor"/><path class="ln" d="M20 70 L60 90 M20 122 L60 102"/><path class="ln" d="M255 78 q14 18 0 36"/>${M(160,96,1)}${M(56,52,2)}${M(280,60,3)}`),
legend:[{en:"The pupil opens and closes to control how much light enters",bn:"আলো কতটা ঢুকবে তা নিয়ন্ত্রণে পিউপিল ছোট-বড় হয়"},{en:"The lens changes shape to focus near or distant objects",bn:"কাছের বা দূরের বস্তু দেখতে লেন্স আকৃতি বদলায়"},{en:"Cells in the retina convert light into nerve signals",bn:"রেটিনার কোষ আলোকে স্নায়ুসংকেতে বদলে দেয়"}],
body:{en:"Light entering the eye is bent first by the transparent cornea and then fine-tuned by the lens, which muscles squeeze into a fatter or flatter shape depending on distance. The image lands upside down on the retina, a layer containing two kinds of receptor: rods that work in dim light but see no colour, and three types of cone that respond to different wavelengths. Those cells fire signals down the optic nerve, and the brain flips the image, merges the two eyes' views into depth, and fills in the blind spot where the nerve leaves. Much of what we call seeing happens in the brain, not the eye.",bn:"চোখে ঢোকা আলো প্রথমে স্বচ্ছ কর্নিয়ায় বাঁকে, তারপর লেন্স তা সূক্ষ্মভাবে সমন্বয় করে, দূরত্ব অনুযায়ী পেশি লেন্সকে মোটা বা চ্যাপ্টা করে। প্রতিবিম্ব উল্টো হয়ে পড়ে রেটিনায়, যে স্তরে দুই ধরনের গ্রাহক থাকে: রড, যা কম আলোয় কাজ করে কিন্তু রং দেখে না, আর তিন ধরনের কোন, যা ভিন্ন তরঙ্গদৈর্ঘ্যে সাড়া দেয়। সেই কোষগুলো অপটিক স্নায়ু বেয়ে সংকেত পাঠায়, আর মস্তিষ্ক ছবি সোজা করে, দুই চোখের দৃশ্য মিলিয়ে গভীরতা তৈরি করে এবং স্নায়ু বেরোনোর অন্ধবিন্দু পূরণ করে দেয়। যাকে আমরা দেখা বলি তার অনেকটাই ঘটে মস্তিষ্কে, চোখে নয়।"},
pts:[{en:"Short and long sight happen when the focus falls in front of or behind the retina",bn:"ক্ষীণ ও দূরদৃষ্টি হয় যখন ফোকাস রেটিনার আগে বা পরে পড়ে"},{en:"Colour blindness usually means one cone type works differently",bn:"বর্ণান্ধতা সাধারণত এক ধরনের কোনের ভিন্ন আচরণে হয়"},{en:"Optical illusions reveal the shortcuts the brain uses",bn:"দৃষ্টিভ্রম দেখিয়ে দেয় মস্তিষ্ক কোন সংক্ষিপ্ত পথ ব্যবহার করে"}]},

body:{en:"Far from being idle time, sleep runs a schedule of essential processes. The brain cycles roughly every ninety minutes between deep slow-wave sleep, when growth hormone is released and tissue repair peaks, and REM sleep, when most dreaming occurs and emotional and procedural memories are consolidated. Fluid flow through brain tissue increases during sleep, helping clear metabolic waste products. Chronic short sleep is linked with impaired attention and judgement, weakened immunity, and higher risk of metabolic and cardiovascular problems — and the effects accumulate quietly, since tired people are poor judges of their own impairment.",bn:"অলস সময় হওয়া তো দূরের কথা, ঘুম আসলে অপরিহার্য কিছু প্রক্রিয়ার সূচি চালায়। মস্তিষ্ক প্রায় প্রতি নব্বই মিনিটে চক্র বদলায় গভীর ধীর-তরঙ্গ ঘুম, যখন বৃদ্ধি হরমোন নিঃসৃত হয় ও কলা মেরামত সর্বোচ্চ হয়, আর আরইএম ঘুমের মধ্যে, যখন বেশিরভাগ স্বপ্ন দেখা যায় এবং আবেগীয় ও দক্ষতাগত স্মৃতি থিতু হয়। ঘুমের সময় মস্তিষ্ক কলায় তরল প্রবাহ বাড়ে, যা বিপাকীয় বর্জ্য সরাতে সাহায্য করে। দীর্ঘমেয়াদি স্বল্প ঘুমের সঙ্গে মনোযোগ ও বিচারবুদ্ধির ঘাটতি, দুর্বল রোগপ্রতিরোধ এবং বিপাকীয় ও হৃদরোগের ঝুঁকি বাড়ার সম্পর্ক পাওয়া গেছে — আর প্রভাবগুলো নীরবে জমতে থাকে, কারণ ক্লান্ত মানুষ নিজের ঘাটতি ঠিকমতো বুঝতে পারে না।"},
pts:[{en:"An internal body clock is set mainly by exposure to daylight",bn:"শরীরের অভ্যন্তরীণ ঘড়ি মূলত দিনের আলোয় ঠিক হয়"},{en:"Screens late at night delay the release of sleep hormones",bn:"রাতে পর্দার আলো ঘুমের হরমোন নিঃসরণ পিছিয়ে দেয়"},{en:"Lost sleep cannot be fully repaid by one long weekend lie-in",bn:"এক ছুটির দিনে বেশি ঘুমিয়ে হারানো ঘুম পুরো পোষানো যায় না"}]}
];

{i:51,cat:"bio",k:"vaccine immunity antibody antigen immune টিকা",
t:{en:"How do vaccines work?",bn:"টিকা কীভাবে কাজ করে?"},
s:{en:"They show the immune system a harmless preview of a germ, so it can recognise and defeat the real one quickly.",bn:"টিকা রোগ প্রতিরোধ ব্যবস্থাকে জীবাণুর নিরীহ পূর্বাভাস দেখায়, যাতে আসলটি এলে দ্রুত চেনা ও পরাস্ত করা যায়।"},

legend:[{en:"A weakened germ, fragment or genetic instruction is injected",bn:"দুর্বল জীবাণু, তার অংশ বা জিনগত নির্দেশ শরীরে দেওয়া হয়"},{en:"The immune system studies its distinctive surface markers",bn:"রোগ প্রতিরোধ ব্যবস্থা তার স্বতন্ত্র পৃষ্ঠচিহ্ন শিখে নেয়"},{en:"Memory cells stay on guard for years afterwards",bn:"স্মৃতিকোষ বছরের পর বছর পাহারায় থেকে যায়"}],
body:{en:"The immune system learns by encounter: the first time it meets a new germ it takes days to design the right antibody, and during that delay you fall ill. A vaccine removes the risk from that first encounter by presenting only the recognisable outer markers of the germ, or a weakened version that cannot cause disease. The body responds as if attacked, builds antibodies, and — crucially — keeps memory cells that can restart production within hours. When enough of a population is protected, the germ struggles to find new hosts, which shields infants and people who cannot be vaccinated.",bn:"রোগ প্রতিরোধ ব্যবস্থা শেখে মুখোমুখি হয়ে: নতুন জীবাণুর সঙ্গে প্রথম দেখা হলে সঠিক অ্যান্টিবডি বানাতে কয়েক দিন লাগে, আর সেই বিলম্বেই মানুষ অসুস্থ হয়। টিকা সেই প্রথম সাক্ষাতের ঝুঁকি সরিয়ে দেয়, কারণ তা কেবল জীবাণুর চেনা বাইরের চিহ্ন বা রোগ ঘটাতে অক্ষম দুর্বল রূপটি দেখায়। শরীর আক্রান্ত হওয়ার মতো সাড়া দেয়, অ্যান্টিবডি বানায় এবং সবচেয়ে জরুরি, এমন স্মৃতিকোষ রেখে দেয় যা কয়েক ঘণ্টায় উৎপাদন শুরু করতে পারে। জনগোষ্ঠীর যথেষ্ট অংশ সুরক্ষিত হলে জীবাণু নতুন পোষক খুঁজে পায় না, ফলে শিশু ও যাঁরা টিকা নিতে পারেন না তাঁরাও রক্ষা পান।"},
pts:[{en:"Mild fever or a sore arm is the immune response, not the disease",bn:"হালকা জ্বর বা হাত ব্যথা রোগ নয়, প্রতিরোধ প্রতিক্রিয়ার লক্ষণ"},{en:"Some vaccines need boosters because memory fades over time",bn:"স্মৃতি ক্ষীণ হয় বলে কিছু টিকার বুস্টার লাগে"},{en:"Flu vaccines are updated yearly because the virus changes its markers",bn:"ভাইরাস চিহ্ন বদলায় বলে ফ্লু টিকা প্রতি বছর হালনাগাদ হয়"}]},

body:{en:"Every living thing is either one cell or many working together. A cell is bounded by a thin oily membrane that is selectively permeable, letting nutrients in and waste out while keeping the interior chemistry stable. Inside, specialised compartments do particular jobs: the nucleus stores and protects the DNA, ribosomes assemble proteins from that code, and mitochondria release energy from sugar. Plant cells add a rigid cellulose wall and chloroplasts for photosynthesis. Bacteria are simpler still, with no nucleus, their DNA loose in the interior.",bn:"প্রতিটি জীবই হয় একটি কোষ, নয়তো একসঙ্গে কাজ করা বহু কোষ। কোষকে ঘিরে থাকে পাতলা তৈলাক্ত ঝিল্লি, যা বাছাই করে ভেদ্য — পুষ্টি ঢুকতে ও বর্জ্য বেরোতে দেয়, ভেতরের রসায়ন স্থিতিশীল রাখে। ভেতরে বিশেষায়িত প্রকোষ্ঠ আলাদা কাজ করে: নিউক্লিয়াস ডিএনএ জমা ও রক্ষা করে, রাইবোজোম সেই সংকেত থেকে প্রোটিন গড়ে, আর মাইটোকন্ড্রিয়া শর্করা থেকে শক্তি ছাড়ে। উদ্ভিদকোষে বাড়তি থাকে শক্ত সেলুলোজ প্রাচীর ও সালোকসংশ্লেষণের জন্য ক্লোরোপ্লাস্ট। ব্যাকটেরিয়া আরও সরল, নিউক্লিয়াস নেই, ডিএনএ ভেতরে ছড়ানো থাকে।"},
pts:[{en:"An adult human body contains tens of trillions of cells",bn:"প্রাপ্তবয়স্ক মানবদেহে কয়েক লক্ষ কোটি কোষ থাকে"},{en:"Cells specialise into muscle, nerve, blood and other types",bn:"কোষ বিশেষায়িত হয়ে পেশি, স্নায়ু, রক্তসহ নানা ধরনে পরিণত হয়"},{en:"Most cells are replaced regularly throughout life",bn:"সারা জীবন ধরে বেশিরভাগ কোষ নিয়মিত নতুন হয়"}]},

{i:53,cat:"bio",k:"migration birds navigation magnetic season পরিযায়ী পাখি",
t:{en:"How do birds find their way when migrating?",bn:"পরিযায়ী পাখি পথ চেনে কীভাবে?"},
s:{en:"They combine a sense of the earth's magnetic field with sun and star positions, landmarks and inherited direction.",bn:"তারা পৃথিবীর চৌম্বক ক্ষেত্রের অনুভূতির সঙ্গে সূর্য ও নক্ষত্রের অবস্থান, ভূচিহ্ন ও বংশগত দিকনির্দেশ মিলিয়ে চলে।"},

body:{en:"Migration is triggered mainly by changing day length, which alters hormone levels and prompts birds to feed heavily and become restless. Navigation appears to use several overlapping systems. Many species carry light-sensitive proteins in the eye that respond to the earth's magnetic field, effectively giving them a compass. They also read the sun's arc and, at night, the rotation of the star field around the pole. Experienced birds add memorised landmarks — coastlines, rivers, mountain passes. Young birds of some species migrate correctly on their first attempt with no guide at all, which indicates an inherited direction and duration.",bn:"পরিযান মূলত দিনের দৈর্ঘ্য বদলানোয় শুরু হয়, যা হরমোনের মাত্রা বদলে পাখিদের বেশি খেতে ও অস্থির হয়ে উঠতে উদ্বুদ্ধ করে। পথ চেনায় একাধিক ব্যবস্থা একসঙ্গে কাজ করে বলে মনে হয়। বহু প্রজাতির চোখে আলোকসংবেদী প্রোটিন থাকে যা পৃথিবীর চৌম্বক ক্ষেত্রে সাড়া দেয়, কার্যত তাদের কম্পাস জোগায়। তারা সূর্যের চাপ এবং রাতে মেরুকে ঘিরে তারামণ্ডলের ঘূর্ণনও পড়ে। অভিজ্ঞ পাখিরা এর সঙ্গে যোগ করে মনে রাখা ভূচিহ্ন — উপকূলরেখা, নদী, পাহাড়ি গিরিপথ। কিছু প্রজাতির অল্পবয়সী পাখি কোনো পথপ্রদর্শক ছাড়াই প্রথমবারেই ঠিক পথে যায়, যা বংশগত দিক ও সময়কালের ইঙ্গিত দেয়।"},

legend:[{en:"Producers — plants — capture energy from sunlight",bn:"উৎপাদক — গাছপালা — সূর্যালোক থেকে শক্তি ধরে"},{en:"Herbivores eat plants and pass a fraction of it on",bn:"তৃণভোজী গাছ খেয়ে তার অল্প অংশ এগিয়ে দেয়"},{en:"Top predators are few because so little energy reaches them",bn:"শীর্ষ শিকারি কম, কারণ তাদের কাছে খুব সামান্য শক্তি পৌঁছায়"}],
body:{en:"Almost all energy in an ecosystem starts as sunlight captured by plants. Each time one organism eats another, roughly ninety percent of the energy is lost as heat, movement and undigested waste, so only about a tenth is available to the next level. That single fact explains why food chains rarely have more than four or five links and why large predators need enormous territories. In reality organisms eat many different things, so chains interlock into a food web, and removing one species can affect others that never fed on it directly. Decomposers close the loop by returning nutrients to the soil.",bn:"বাস্তুতন্ত্রের প্রায় সব শক্তির শুরু গাছের ধরা সূর্যালোকে। একটি জীব আরেকটিকে খেলে প্রতিবারই প্রায় নব্বই শতাংশ শক্তি তাপ, চলাচল ও অহজম বর্জ্য হিসেবে হারিয়ে যায়, তাই পরের স্তরে মেলে মোটে এক-দশমাংশ। এই একটি তথ্যই ব্যাখ্যা করে কেন খাদ্যশৃঙ্খলে চার-পাঁচটির বেশি ধাপ প্রায় থাকে না এবং কেন বড় শিকারিদের বিশাল এলাকা লাগে। বাস্তবে জীবেরা নানা রকম খাবার খায়, তাই শৃঙ্খলগুলো জড়িয়ে খাদ্যজাল তৈরি করে, আর একটি প্রজাতি সরিয়ে নিলে এমন জীবও ক্ষতিগ্রস্ত হয় যারা তাকে সরাসরি খেত না। পচনকারীরা পুষ্টি মাটিতে ফিরিয়ে দিয়ে চক্রটি পূর্ণ করে।"},
pts:[{en:"Rice, fish and cattle sit at different levels of the same web",bn:"ধান, মাছ ও গবাদিপশু একই জালের ভিন্ন স্তরে থাকে"},{en:"Toxins concentrate as they move up the chain",bn:"শৃঙ্খলের উপরে উঠতে উঠতে বিষাক্ত পদার্থ ঘনীভূত হয়"},{en:"Eating lower on the chain feeds more people per hectare",bn:"শৃঙ্খলের নিচের স্তরে খেলে একই জমিতে বেশি মানুষের খাদ্য হয়"}]},

{i:55,cat:"bio",k:"antibiotic resistance bacteria penicillin অ্যান্টিবায়োটিক",
t:{en:"How do antibiotics work, and why is resistance a problem?",bn:"অ্যান্টিবায়োটিক কীভাবে কাজ করে, আর প্রতিরোধ সমস্যা কেন?"},
s:{en:"They attack structures only bacteria have — but survivors of an incomplete course breed a resistant population.",bn:"এগুলো কেবল ব্যাকটেরিয়ার থাকা গঠনে আঘাত করে — কিন্তু অসম্পূর্ণ কোর্সে বেঁচে যাওয়া জীবাণু প্রতিরোধী বংশ গড়ে।"},
svg:S(`<g class="ln"><rect x="34" y="52" width="52" height="24" rx="12"/><rect x="34" y="88" width="52" height="24" rx="12"/><rect x="34" y="124" width="52" height="24" rx="12"/></g><path class="fl2" d="M34 124 h28 a12 12 0 0 1 0 24 h-28 a12 12 0 0 1 0-24 Z"/><g class="ln"><path d="M104 100 H150 M142 92 L152 100 L142 108"/><ellipse cx="126" cy="76" rx="14" ry="7"/></g><g class="ln"><path d="M170 64 l16 16 m0-16 l-16 16"/><path d="M170 100 l16 16 m0-16 l-16 16"/><rect x="204" y="124" width="52" height="24" rx="12"/></g><path class="fl2" d="M204 124 h28 a12 12 0 0 1 0 24 h-28 a12 12 0 0 1 0-24 Z"/><g class="ln"><rect x="204" y="88" width="52" height="24" rx="12"/><rect x="264" y="106" width="52" height="24" rx="12"/></g>${M(60,168,1)}${M(126,52,2)}${M(240,168,3)}`),
legend:[{en:"A mixed population contains a few naturally resistant bacteria",bn:"মিশ্র জনগোষ্ঠীতে অল্প কিছু স্বাভাবিকভাবেই প্রতিরোধী ব্যাকটেরিয়া থাকে"},{en:"The drug kills the susceptible ones",bn:"ওষুধ সংবেদনশীলগুলোকে মেরে ফেলে"},{en:"Survivors multiply freely with no competition",bn:"বেঁচে যাওয়া জীবাণু প্রতিযোগিতা ছাড়াই বংশবৃদ্ধি করে"}],
body:{en:"Antibiotics exploit differences between bacterial and human cells: penicillin, for example, blocks construction of the bacterial cell wall, a structure our cells simply do not have. Resistance is not something an individual patient develops; it is evolution in the bacterial population. Any large colony contains rare variants that survive the drug, and every incomplete course, unnecessary prescription or agricultural overuse hands those variants an empty field to expand into. The consequence is serious and growing — infections that were routinely curable are becoming difficult to treat, and new antibiotic classes are discovered rarely.",bn:"অ্যান্টিবায়োটিক ব্যাকটেরিয়া ও মানবকোষের পার্থক্যকে কাজে লাগায়: যেমন পেনিসিলিন ব্যাকটেরিয়ার কোষপ্রাচীর গঠন আটকে দেয়, যে গঠন আমাদের কোষে নেই-ই। প্রতিরোধ কোনো রোগীর নিজে গড়ে তোলা বিষয় নয়; এটি ব্যাকটেরিয়া জনগোষ্ঠীর বিবর্তন। যেকোনো বড় উপনিবেশে বিরল কিছু রূপভেদ থাকে যারা ওষুধ সয়ে যায়, আর প্রতিটি অসম্পূর্ণ কোর্স, অপ্রয়োজনীয় প্রেসক্রিপশন বা কৃষিতে অতিব্যবহার সেই রূপভেদগুলোকে ছড়ানোর ফাঁকা মাঠ করে দেয়। ফল গুরুতর ও ক্রমবর্ধমান — যেসব সংক্রমণ সহজেই সারত, সেগুলোর চিকিৎসা কঠিন হয়ে পড়ছে, আর নতুন শ্রেণির অ্যান্টিবায়োটিক খুব কমই আবিষ্কৃত হয়।"},
pts:[{en:"Antibiotics have no effect on viral illnesses like colds and flu",bn:"সর্দি-ফ্লুর মতো ভাইরাসজনিত রোগে অ্যান্টিবায়োটিক কাজ করে না"},{en:"Finishing the prescribed course as directed matters",bn:"নির্দেশমতো পুরো কোর্স শেষ করা জরুরি"},{en:"Livestock use is a major driver of resistance worldwide",bn:"গবাদিপশুতে ব্যবহার বিশ্বজুড়ে প্রতিরোধের বড় কারণ"}]},

{i:56,cat:"space",k:"space technology satellite launch orbit rocket মহাকাশ প্রযুক্তি",
t:{en:"What is space technology?",bn:"মহাকাশ প্রযুক্তি কী?"},
s:{en:"The engineering that puts machines above the atmosphere and keeps them working there — and the daily services that result.",bn:"যে প্রকৌশল যন্ত্রকে বায়ুমণ্ডলের উপরে পাঠায় ও সেখানে সচল রাখে — এবং তা থেকে পাওয়া দৈনন্দিন সেবা।"},
svg:S(`<path class="ln" d="M0 168 q160-40 320 0"/><path class="fl" d="M0 168 q160-40 320 0 V190 H0 Z"/><g class="ln2"><path d="M0 138 q160-44 320 0" stroke-dasharray="4 4"/></g><g class="ln"><path d="M60 130 q6-40 0-54 q-14 20-14 40 Z"/><path d="M60 130 q-6-40 0-54 q14 20 14 40 Z"/><path d="M52 130 l-6 14 h28 l-6-14"/><path d="M60 148 q-4 14 0 24 q4-14 0-24" fill="currentColor"/></g><g class="ln"><rect x="196" y="52" width="30" height="22"/><rect x="164" y="56" width="26" height="14"/><rect x="232" y="56" width="26" height="14"/><path d="M211 74 v14 M200 92 h22"/></g><g class="ln"><path d="M211 92 q-20 20-40 30" stroke-dasharray="3 4"/></g>${M(60,110,1)}${M(211,36,2)}${M(150,140,3)}`),
legend:[{en:"Rockets provide the speed needed to reach orbit",bn:"রকেট কক্ষপথে পৌঁছানোর প্রয়োজনীয় গতি জোগায়"},{en:"Satellites carry sensors, cameras and radio equipment",bn:"স্যাটেলাইট সেন্সর, ক্যামেরা ও বেতার যন্ত্র বহন করে"},{en:"Ground stations send commands and receive the data",bn:"ভূ-কেন্দ্র নির্দেশ পাঠায় ও তথ্য গ্রহণ করে"}],
body:{en:"Space technology covers everything needed to work beyond the atmosphere: launch vehicles, spacecraft that survive vacuum and extreme temperature swings, solar power systems, radio links across vast distances, and the ground infrastructure that controls it all. Most of it serves ordinary life rather than exploration. Weather satellites give the cyclone warnings that save lives in coastal Bangladesh; navigation constellations guide shipping and aviation; earth observation tracks crops, floods, deforestation and river movement; communication satellites reach places no cable does. Falling launch costs have made small national and university satellites realistic.",bn:"মহাকাশ প্রযুক্তি বলতে বায়ুমণ্ডলের বাইরে কাজ করার সব কিছুই বোঝায়: উৎক্ষেপণ যান, শূন্যতা ও চরম তাপমাত্রার ওঠানামা সইতে পারা নভোযান, সৌরবিদ্যুৎ ব্যবস্থা, বিশাল দূরত্বে বেতার সংযোগ, আর এসব নিয়ন্ত্রণকারী ভূ-অবকাঠামো। এর বেশিরভাগই অভিযানের চেয়ে সাধারণ জীবনের কাজে লাগে। আবহাওয়া স্যাটেলাইট উপকূলীয় বাংলাদেশে প্রাণরক্ষাকারী ঘূর্ণিঝড় সতর্কতা দেয়; নেভিগেশন নক্ষত্রপুঞ্জ জাহাজ ও উড়োজাহাজ পথ দেখায়; ভূপর্যবেক্ষণ ফসল, বন্যা, বন উজাড় ও নদীর গতিপথে নজর রাখে; যোগাযোগ স্যাটেলাইট এমন জায়গায় পৌঁছায় যেখানে কেবল যায় না। উৎক্ষেপণ খরচ কমে আসায় ছোট জাতীয় ও বিশ্ববিদ্যালয় স্যাটেলাইট এখন বাস্তবসম্মত।"},
pts:[{en:"Reaching orbit needs about 28,000 km/h sideways speed, not just height",bn:"কক্ষপথে যেতে কেবল উচ্চতা নয়, ঘণ্টায় প্রায় ২৮,০০০ কিমি পাশের গতি লাগে"},{en:"Space debris is now a serious hazard to working satellites",bn:"মহাকাশ আবর্জনা এখন সচল স্যাটেলাইটের জন্য গুরুতর ঝুঁকি"},{en:"Many everyday materials and sensors were refined for space use first",bn:"দৈনন্দিন বহু উপকরণ ও সেন্সর প্রথমে মহাকাশের জন্যই উন্নত হয়েছিল"}]},

{i:57,cat:"space",k:"moon phases lunar cycle crescent new full চাঁদের কলা",
t:{en:"Why does the moon change shape?",bn:"চাঁদের আকৃতি বদলায় কেন?"},
s:{en:"Half the moon is always lit; we simply see that lit half from different angles as it orbits us.",bn:"চাঁদের অর্ধেক সব সময়ই আলোকিত; কক্ষপথে ঘোরার সময় আমরা সেই আলোকিত অর্ধেকটাই ভিন্ন কোণে দেখি।"},
svg:S(`<circle cx="160" cy="96" r="18" class="ln"/><path class="fl" d="M160 78 a18 18 0 1 0 0 36 a18 18 0 1 0 0-36"/><g class="ln2"><circle cx="160" cy="96" r="64" stroke-dasharray="4 4" fill="none"/></g><g class="ln"><path d="M20 96 H80 M72 90 L80 96 L72 102"/><path d="M20 76 H80 M20 116 H80"/></g>${[0,60,120,180,240,300].map((a,n)=>{const r=a*Math.PI/180,x=160+Math.cos(r)*64,y=96+Math.sin(r)*64;return `<circle cx="${x}" cy="${y}" r="11" class="ln" fill="#fff"/><path class="fl" d="M${x} ${y-11} a11 11 0 0 ${Math.cos(r)>0?0:1} 0 22 Z"/><circle cx="${x}" cy="${y}" r="11" class="ln"/>`}).join("")}${M(50,140,1)}${M(224,42,2)}${M(96,152,3)}`),
legend:[{en:"Sunlight always lights exactly one half of the moon",bn:"সূর্যালোক সব সময় চাঁদের ঠিক অর্ধেক আলোকিত করে"},{en:"The moon circles the earth once every 29.5 days",bn:"চাঁদ প্রতি ২৯.৫ দিনে একবার পৃথিবীকে প্রদক্ষিণ করে"},{en:"Our viewing angle changes, so the lit part looks different",bn:"আমাদের দেখার কোণ বদলায়, তাই আলোকিত অংশ ভিন্ন দেখায়"}],
body:{en:"The phases have nothing to do with the earth's shadow — that only happens during an eclipse. The moon produces no light of its own; it reflects sunlight, and the sun can only ever illuminate the hemisphere facing it. What changes through the month is our viewing geometry. When the moon is roughly between us and the sun we see mostly its dark side, giving the new moon; when the earth is in between we see the fully lit face. In between we catch the lit half at an angle, producing crescents and half-moons. The same side always faces us because the moon rotates once per orbit.",bn:"কলার সঙ্গে পৃথিবীর ছায়ার কোনো সম্পর্ক নেই — সেটি কেবল গ্রহণের সময় ঘটে। চাঁদ নিজে আলো দেয় না; সে সূর্যালোক প্রতিফলিত করে, আর সূর্য কেবল তার দিকে মুখ করা গোলার্ধটিই আলোকিত করতে পারে। মাসজুড়ে যা বদলায় তা আমাদের দেখার জ্যামিতি। চাঁদ যখন মোটামুটি আমাদের ও সূর্যের মাঝে থাকে তখন আমরা মূলত তার অন্ধকার দিকটি দেখি, হয় অমাবস্যা; আর পৃথিবী মাঝে পড়লে দেখি পুরো আলোকিত মুখ। মাঝামাঝি অবস্থায় আলোকিত অর্ধেকটি কোণাকুণি দেখা যায়, তৈরি হয় বাঁকা চাঁদ ও অর্ধচন্দ্র। চাঁদ প্রতি প্রদক্ষিণে একবার ঘোরে বলে সব সময় একই পিঠ আমাদের দিকে থাকে।"},
pts:[{en:"A full lunar cycle takes about 29.5 days",bn:"পূর্ণ চান্দ্রচক্র প্রায় ২৯.৫ দিনে সম্পন্ন হয়"},{en:"There is no permanently dark side, only a far side we never see",bn:"স্থায়ীভাবে অন্ধকার দিক নেই, আছে কেবল কখনো না দেখা দূরের পিঠ"},{en:"The moon is visible in daytime too, when it is far from the sun in the sky",bn:"আকাশে সূর্য থেকে দূরে থাকলে দিনের বেলাতেও চাঁদ দেখা যায়"}]},

{i:58,cat:"space",k:"black hole gravity event horizon singularity কৃষ্ণগহ্বর",
t:{en:"What is a black hole?",bn:"কৃষ্ণগহ্বর কী?"},
s:{en:"A region where matter is packed so densely that nothing which crosses its boundary can travel fast enough to escape.",bn:"এমন অঞ্চল যেখানে পদার্থ এত ঘনভাবে জমা যে সীমানা পেরোনো কিছুই পালানোর মতো গতি পায় না।"},
svg:S(`<circle cx="160" cy="96" r="28" fill="currentColor" class="ln"/><circle cx="160" cy="96" r="46" class="ln" stroke-dasharray="5 4"/><ellipse cx="160" cy="96" rx="110" ry="28" class="ln"/><path class="fl2" d="M50 96 a110 28 0 0 0 220 0 Z"/><g class="ln2"><path d="M40 60 q60 20 108 34 M280 60 q-60 20-108 34"/></g><g class="ln"><path d="M20 150 q40-10 80-6" stroke-dasharray="3 4"/></g>${M(160,96,1)}${M(160,42,2)}${M(268,140,3)}`),
legend:[{en:"The singularity — matter crushed to unimaginable density",bn:"সিঙ্গুলারিটি — অকল্পনীয় ঘনত্বে পিষে যাওয়া পদার্থ"},{en:"The event horizon is the point of no return",bn:"ঘটনা দিগন্তই সেই সীমা, যেখান থেকে ফেরা নেই"},{en:"Infalling gas heats up and glows brightly before crossing",bn:"পতনশীল গ্যাস সীমা পেরোনোর আগে উত্তপ্ত হয়ে উজ্জ্বল জ্বলে"}],
body:{en:"Escape velocity is the speed needed to break free of an object's gravity. Compress enough mass into a small enough space and that required speed exceeds the speed of light — and since nothing can go faster, nothing can leave. That boundary is the event horizon, and it is not a solid surface but simply the line beyond which all paths lead inward. Most stellar black holes form when a massive star exhausts its fuel and collapses. They are not cosmic vacuum cleaners: at a distance their gravity behaves exactly like any other mass, and a black hole with the sun's mass would leave the earth's orbit unchanged.",bn:"মুক্তিবেগ হলো কোনো বস্তুর মাধ্যাকর্ষণ ছাড়িয়ে যেতে প্রয়োজনীয় গতি। যথেষ্ট ভরকে যথেষ্ট ছোট জায়গায় চেপে দিলে সেই প্রয়োজনীয় গতি আলোর গতিকেও ছাড়িয়ে যায় — আর যেহেতু কিছুই তার চেয়ে দ্রুত যেতে পারে না, কিছুই বেরোতেও পারে না। সেই সীমাই ঘটনা দিগন্ত, যা কোনো কঠিন পৃষ্ঠ নয়, কেবল সেই রেখা যার ওপারে সব পথই ভেতরের দিকে যায়। বেশিরভাগ নাক্ষত্রিক কৃষ্ণগহ্বর তৈরি হয় বিশাল ভরের নক্ষত্রের জ্বালানি ফুরিয়ে ধসে পড়লে। এরা মহাজাগতিক ভ্যাকুয়াম ক্লিনার নয়: দূর থেকে এদের মাধ্যাকর্ষণ অন্য যেকোনো ভরের মতোই আচরণ করে, আর সূর্যের সমান ভরের কৃষ্ণগহ্বর হলে পৃথিবীর কক্ষপথ একটুও বদলাত না।"},
pts:[{en:"The first direct image of a black hole's shadow was released in 2019",bn:"কৃষ্ণগহ্বরের ছায়ার প্রথম সরাসরি ছবি প্রকাশ পায় ২০১৯ সালে"},{en:"Most large galaxies have a supermassive black hole at their centre",bn:"বেশিরভাগ বড় ছায়াপথের কেন্দ্রে অতিভারী কৃষ্ণগহ্বর থাকে"},{en:"They are detected by their effect on nearby stars and gas",bn:"কাছের নক্ষত্র ও গ্যাসের উপর প্রভাব দেখেই এদের শনাক্ত করা হয়"}]},

{i:59,cat:"space",k:"rocket thrust newton third law propellant রকেট",
t:{en:"How do rockets fly in space?",bn:"রকেট মহাশূন্যে চলে কীভাবে?"},
s:{en:"They throw mass backwards very fast; the equal and opposite reaction pushes the rocket forward — no air needed.",bn:"এরা প্রচণ্ড গতিতে ভর পেছনে ছোড়ে; সমান ও বিপরীত প্রতিক্রিয়া রকেটকে সামনে ঠেলে — বাতাস লাগে না।"},
svg:S(`<path class="ln" d="M160 20 q22 30 22 70 v40 h-44 V90 q0-40 22-70 Z"/><path class="fl" d="M160 20 q22 30 22 70 v40 h-44 V90 q0-40 22-70 Z"/><path class="ln" d="M138 108 l-20 34 h20 M182 108 l20 34 h-20"/><circle cx="160" cy="70" r="9" class="ln" fill="#fff"/><path class="ln" d="M140 130 q20 40 40 0"/><path class="ln" d="M148 140 q12 40 24 0 q-4 30-12 40 q-8-10-12-40" fill="currentColor"/><g class="ln"><path d="M240 60 V30 M232 40 L240 26 L248 40"/><path d="M240 130 V166 M232 154 L240 170 L248 154"/></g>${M(160,44,1)}${M(160,186,2)}${M(272,96,3)}`),
legend:[{en:"Fuel and oxidiser burn inside the combustion chamber",bn:"দহন প্রকোষ্ঠে জ্বালানি ও জারক পোড়ে"},{en:"Hot gas is forced out of the nozzle at huge speed",bn:"উত্তপ্ত গ্যাস নজল দিয়ে প্রচণ্ড গতিতে বেরিয়ে যায়"},{en:"The reaction force drives the rocket the other way",bn:"প্রতিক্রিয়া বল রকেটকে উল্টো দিকে চালায়"}],
body:{en:"A common misconception is that a rocket pushes against the air. It does not — in fact it works better without air, since there is no drag. Newton's third law is the whole principle: every force has an equal and opposite counterpart, so hurling exhaust gas backwards at several kilometres per second pushes the rocket forwards with the same total momentum. Because there is no oxygen in space, rockets must carry an oxidiser as well as fuel, which is why they are mostly tank. Multi-stage designs drop empty tanks as they empty so the engine is not wasting thrust on dead weight.",bn:"একটি প্রচলিত ভুল ধারণা হলো, রকেট বাতাসে ধাক্কা দিয়ে চলে। তা নয় — বরং বাতাস না থাকলেই ভালো চলে, কারণ তখন বাধা নেই। পুরো নীতিটাই নিউটনের তৃতীয় সূত্র: প্রতিটি বলের সমান ও বিপরীত জোড়া থাকে, তাই সেকেন্ডে কয়েক কিলোমিটার বেগে নিষ্কাশন গ্যাস পেছনে ছুড়লে রকেট সমান ভরবেগে সামনে এগোয়। মহাশূন্যে অক্সিজেন নেই বলে রকেটকে জ্বালানির সঙ্গে জারকও বহন করতে হয়, তাই এর বেশিরভাগ অংশই ট্যাংক। বহুস্তর নকশায় ট্যাংক খালি হওয়ামাত্র ফেলে দেওয়া হয়, যাতে ইঞ্জিনকে মৃত ওজন টানতে শক্তি নষ্ট করতে না হয়।"},
pts:[{en:"Most of a rocket's launch weight is propellant",bn:"রকেটের উৎক্ষেপণ ওজনের বেশিরভাগই জ্বালানি"},{en:"Rockets curve sideways early to build orbital speed",bn:"কক্ষীয় গতি পেতে রকেট শুরুতেই পাশে বাঁক নেয়"},{en:"Ion engines give tiny thrust but run for years in deep space",bn:"আয়ন ইঞ্জিন সামান্য ঠেলা দেয়, কিন্তু গভীর মহাশূন্যে বছরের পর বছর চলে"}]},

{i:60,cat:"space",k:"star fusion hydrogen helium sun nuclear নক্ষত্র",
t:{en:"What are stars made of?",bn:"নক্ষত্র কী দিয়ে তৈরি?"},
s:{en:"Mostly hydrogen and helium gas, squeezed so hard at the core that nuclei fuse and release enormous energy.",bn:"প্রধানত হাইড্রোজেন ও হিলিয়াম গ্যাস, কেন্দ্রে এত চাপে থাকে যে নিউক্লিয়াস মিশে বিপুল শক্তি ছাড়ে।"},
svg:S(`<circle cx="150" cy="96" r="66" class="ln"/><path class="fl2" d="M150 30 a66 66 0 1 0 0 132 a66 66 0 1 0 0-132"/><circle cx="150" cy="96" r="26" class="ln" fill="#fff"/><circle cx="150" cy="96" r="26" class="ln"/><g class="ln"><circle cx="142" cy="90" r="4" fill="currentColor"/><circle cx="158" cy="94" r="4" fill="currentColor"/><circle cx="148" cy="104" r="4"/></g><g class="ln2"><path d="M150 70 q30 26 0 52 M150 70 q-30 26 0 52"/></g><g class="ln">${[20,60,100,140,180,220,260,300,340].map(a=>{const r=a*Math.PI/180;return `<line x1="${150+Math.cos(r)*72}" y1="${96+Math.sin(r)*72}" x2="${150+Math.cos(r)*84}" y2="${96+Math.sin(r)*84}"/>`}).join("")}</g>${M(150,96,1)}${M(150,20,2)}${M(272,150,3)}`),
legend:[{en:"The core is where hydrogen fuses into helium",bn:"কেন্দ্রেই হাইড্রোজেন মিশে হিলিয়াম হয়"},{en:"Outward pressure balances gravity pulling inward",bn:"বাইরের দিকের চাপ ভেতরমুখী মাধ্যাকর্ষণকে সামলে রাখে"},{en:"Energy escapes as light and heat after a long journey outward",bn:"দীর্ঘ পথ পেরিয়ে শক্তি আলো ও তাপ হয়ে বেরিয়ে আসে"}],
body:{en:"A star is a self-regulating balance between two opposing forces. Gravity pulls the vast ball of gas inward, compressing the core to millions of degrees, and at those conditions hydrogen nuclei overcome their mutual repulsion and fuse into helium. The fused nucleus weighs slightly less than the parts that formed it, and that missing mass emerges as energy — the source of all starlight. The resulting outward pressure exactly counteracts gravity, keeping the star stable for billions of years. When the core fuel runs out the balance fails, and what happens next depends almost entirely on the star's mass.",bn:"নক্ষত্র হলো দুই বিপরীত বলের মধ্যে স্বনিয়ন্ত্রিত ভারসাম্য। মাধ্যাকর্ষণ বিশাল গ্যাসগোলককে ভেতরে টানে, কেন্দ্রকে লক্ষ লক্ষ ডিগ্রিতে চেপে ধরে, আর সেই অবস্থায় হাইড্রোজেন নিউক্লিয়াস পারস্পরিক বিকর্ষণ কাটিয়ে মিশে হিলিয়াম হয়। মিশে যাওয়া নিউক্লিয়াসের ওজন গঠনকারী অংশগুলোর চেয়ে সামান্য কম, আর সেই হারানো ভরই শক্তি হয়ে বেরোয় — এটাই সব নক্ষত্রালোকের উৎস। ফলে তৈরি বহির্মুখী চাপ ঠিক মাধ্যাকর্ষণকে বাতিল করে, নক্ষত্রকে কোটি কোটি বছর স্থিতিশীল রাখে। কেন্দ্রের জ্বালানি ফুরালে ভারসাম্য ভাঙে, আর তারপর কী হবে তা প্রায় পুরোটাই নির্ভর করে নক্ষত্রের ভরের উপর।"},
pts:[{en:"Star colour indicates temperature — blue is hotter than red",bn:"নক্ষত্রের রং তাপমাত্রা বোঝায় — নীল লালের চেয়ে বেশি গরম"},{en:"Elements heavier than helium were forged inside stars",bn:"হিলিয়ামের চেয়ে ভারী মৌল নক্ষত্রের ভেতরেই তৈরি হয়েছে"},{en:"Light from the sun takes about eight minutes to reach us",bn:"সূর্যের আলো আমাদের কাছে আসতে প্রায় আট মিনিট লাগে"}]},

{i:61,cat:"space",k:"eclipse solar lunar shadow umbra গ্রহণ",
t:{en:"What causes an eclipse?",bn:"গ্রহণ কেন হয়?"},
s:{en:"One body's shadow falls on another — the moon blocking the sun, or the earth blocking sunlight from the moon.",bn:"এক বস্তুর ছায়া আরেকটির উপর পড়ে — চাঁদ সূর্যকে ঢাকে, কিংবা পৃথিবী চাঁদের উপর সূর্যালোক আটকায়।"},
svg:S(`<circle cx="44" cy="70" r="24" class="ln"/><path class="fl2" d="M44 46 a24 24 0 1 0 0 48 a24 24 0 1 0 0-48"/><circle cx="150" cy="86" r="10" class="ln" fill="currentColor"/><circle cx="250" cy="104" r="32" class="ln"/><path class="fl" d="M250 72 a32 32 0 1 0 0 64 a32 32 0 1 0 0-64"/><g class="ln2"><path d="M64 54 L142 80 L226 96"/><path d="M62 90 L142 92 L226 112"/></g><path class="fl" d="M150 76 L226 94 L226 110 L150 96 Z"/>${M(44,110,1)}${M(150,58,2)}${M(250,150,3)}`),
legend:[{en:"The sun lights everything from one direction",bn:"সূর্য এক দিক থেকে সবকিছু আলোকিত করে"},{en:"The moon casts a narrow cone of shadow",bn:"চাঁদ সরু শঙ্কু আকৃতির ছায়া ফেলে"},{en:"Wherever that shadow lands, a solar eclipse is seen",bn:"সেই ছায়া যেখানে পড়ে সেখানেই সূর্যগ্রহণ দেখা যায়"}],
body:{en:"A solar eclipse happens when the moon passes directly between earth and sun, and its shadow sweeps a narrow track across the earth's surface. Only observers inside that track see totality; nearby regions see a partial eclipse. A lunar eclipse is the reverse — the earth comes between sun and moon, and the moon dims and often turns coppery red because the only sunlight reaching it has been bent and filtered through our atmosphere. Eclipses do not happen monthly because the moon's orbit is tilted about five degrees, so usually its shadow passes above or below us.",bn:"সূর্যগ্রহণ হয় যখন চাঁদ ঠিক পৃথিবী ও সূর্যের মাঝে চলে আসে, আর তার ছায়া পৃথিবীপৃষ্ঠে সরু একটি পথ ধরে সরে যায়। কেবল সেই পথের ভেতরের পর্যবেক্ষকরাই পূর্ণগ্রাস দেখেন; আশপাশের অঞ্চলে দেখা যায় আংশিক গ্রহণ। চন্দ্রগ্রহণ ঠিক উল্টো — পৃথিবী সূর্য ও চাঁদের মাঝে আসে, চাঁদ ম্লান হয় এবং প্রায়ই তামাটে লাল দেখায়, কারণ তার কাছে পৌঁছানো একমাত্র সূর্যালোক আমাদের বায়ুমণ্ডলে বেঁকে ও ছেঁকে গেছে। প্রতি মাসে গ্রহণ হয় না, কারণ চাঁদের কক্ষপথ প্রায় পাঁচ ডিগ্রি হেলানো, তাই সাধারণত তার ছায়া আমাদের উপর দিয়ে বা নিচ দিয়ে চলে যায়।"},
pts:[{en:"Never look at a partial solar eclipse without proper filters",bn:"সঠিক ফিল্টার ছাড়া আংশিক সূর্যগ্রহণ কখনো দেখবেন না"},{en:"A lunar eclipse is safe to watch with the naked eye",bn:"চন্দ্রগ্রহণ খালি চোখে দেখা নিরাপদ"},{en:"By coincidence the sun and moon look almost the same size from earth",bn:"কাকতালীয়ভাবে পৃথিবী থেকে সূর্য ও চাঁদকে প্রায় সমান আকারের দেখায়"}]},

{i:62,cat:"space",k:"satellite orbit geostationary communication স্যাটেলাইট উপগ্রহ",
t:{en:"What is a satellite and how does it stay up?",bn:"স্যাটেলাইট কী, আর তা উপরে থাকে কীভাবে?"},
s:{en:"It is falling constantly, but moving sideways so fast that it keeps missing the earth.",bn:"এটি অবিরাম পড়ছে, কিন্তু পাশে এত দ্রুত ছুটছে যে বারবার পৃথিবীকে ফসকে যায়।"},
svg:S(`<circle cx="120" cy="110" r="52" class="ln"/><path class="fl" d="M120 58 a52 52 0 1 0 0 104 a52 52 0 1 0 0-104"/><g class="ln2"><circle cx="120" cy="110" r="86" stroke-dasharray="5 5"/></g><g class="ln"><rect x="196" y="52" width="24" height="18"/><rect x="170" y="55" width="20" height="12"/><rect x="226" y="55" width="20" height="12"/></g><g class="ln"><path d="M120 40 q40-30 84 0" stroke-dasharray="3 3"/><path d="M200 76 q-30 20-60 26" stroke-dasharray="3 3"/></g><g class="ln"><path d="M262 96 H296 M288 88 L298 96 L288 104"/></g>${M(120,110,1)}${M(208,32,2)}${M(60,44,3)}`),
legend:[{en:"Gravity constantly pulls the satellite toward earth",bn:"মাধ্যাকর্ষণ অবিরাম স্যাটেলাইটকে পৃথিবীর দিকে টানে"},{en:"Its sideways speed carries it past the horizon each time",bn:"পাশের গতি তাকে প্রতিবার দিগন্ত ছাড়িয়ে নিয়ে যায"},{en:"The result is a closed loop — an orbit",bn:"ফলাফল একটি বদ্ধ বৃত্ত — কক্ষপথ"}],
body:{en:"Imagine firing a cannonball horizontally from a very high mountain. Fire it gently and it lands nearby; fire it harder and it lands further away. Fire it hard enough and the earth's surface curves away just as fast as the ball falls, so it never lands — it orbits. Satellites are in exactly that state, which is also why astronauts float: they are not beyond gravity, they are falling with their spacecraft. Low orbits circle the earth in about ninety minutes and are used for imaging, while an orbit at 35,786 kilometres takes exactly one day, so the satellite appears fixed above one spot — ideal for television and weather watching.",bn:"কল্পনা করুন, খুব উঁচু পাহাড় থেকে আনুভূমিকভাবে একটি কামানের গোলা ছোড়া হলো। আলতো ছুড়লে তা কাছেই পড়বে; জোরে ছুড়লে আরও দূরে। যথেষ্ট জোরে ছুড়লে পৃথিবীপৃষ্ঠ ঠিক সেই হারেই বেঁকে সরে যায় যে হারে গোলাটি পড়ে, ফলে তা আর মাটিতে পড়েই না — কক্ষপথে ঘুরতে থাকে। স্যাটেলাইট ঠিক সেই অবস্থাতেই থাকে, আর এ কারণেই নভোচারীরা ভাসেন: তাঁরা মাধ্যাকর্ষণের বাইরে নন, নভোযানসহ পড়ছেন। নিম্ন কক্ষপথে প্রায় নব্বই মিনিটে একবার পৃথিবী ঘোরা যায়, যা ছবি তোলায় ব্যবহৃত হয়; আর ৩৫,৭৮৬ কিলোমিটার উচ্চতার কক্ষপথে ঠিক এক দিন লাগে, তাই স্যাটেলাইটটি এক জায়গার উপরে স্থির দেখায় — টেলিভিশন ও আবহাওয়া পর্যবেক্ষণের জন্য আদর্শ।"},
pts:[{en:"Geostationary satellites always sit above the equator",bn:"ভূস্থির স্যাটেলাইট সব সময় বিষুবরেখার উপরে থাকে"},{en:"Low orbits still meet thin air, so satellites slowly lose height",bn:"নিম্ন কক্ষপথে পাতলা বাতাস থাকে, তাই স্যাটেলাইট ধীরে উচ্চতা হারায়"},{en:"Bangladesh's own communication satellite operates in geostationary orbit",bn:"বাংলাদেশের নিজস্ব যোগাযোগ স্যাটেলাইট ভূস্থির কক্ষপথে চলে"}]},

{i:63,cat:"space",k:"distance sun light year astronomical unit scale দূরত্ব সূর্য",
t:{en:"How far away is the sun, really?",bn:"সূর্য আসলে কত দূরে?"},
s:{en:"About 150 million kilometres — so far that its light, the fastest thing there is, takes eight minutes to arrive.",bn:"প্রায় ১৫ কোটি কিলোমিটার — এতই দূর যে সবচেয়ে দ্রুতগামী আলোরও আসতে আট মিনিট লাগে।"},
svg:S(`<circle cx="34" cy="96" r="20" class="ln"/><path class="fl2" d="M34 76 a20 20 0 1 0 0 40 a20 20 0 1 0 0-40"/><circle cx="270" cy="96" r="9" class="ln"/><path class="fl" d="M270 87 a9 9 0 1 0 0 18 a9 9 0 1 0 0-18"/><path class="ln" d="M54 96 H258 M250 90 L260 96 L250 102"/><g class="ln2"><path d="M54 118 V132 M258 118 V132 M54 126 H258"/></g><g class="ln"><path d="M110 60 q10-8 20 0 t20 0" /><path d="M160 46 h40 M192 40 L202 46 L192 52"/></g>${M(34,140,1)}${M(156,140,2)}${M(270,140,3)}`),
legend:[{en:"The sun's diameter is over a hundred times the earth's",bn:"সূর্যের ব্যাস পৃথিবীর একশো গুণেরও বেশি"},{en:"The gap between them is called one astronomical unit",bn:"দুটির মধ্যকার দূরত্বকে বলে এক জ্যোতির্বৈজ্ঞানিক একক"},{en:"Sunlight crosses that distance in about eight minutes",bn:"সূর্যালোক সেই দূরত্ব পেরোয় প্রায় আট মিনিটে"}],
body:{en:"Astronomical distances defeat ordinary intuition, so scale models help. If the sun were shrunk to the size of a football, the earth would be a peppercorn about twenty-six metres away. On that same scale the next nearest star would be another football roughly seven thousand kilometres distant. This is why astronomers measure in light travel time: sunlight takes eight minutes and twenty seconds to reach us, light from the nearest star takes over four years, and light from distant galaxies has been travelling for billions. Looking outward is therefore always looking backward in time.",bn:"জ্যোতির্বৈজ্ঞানিক দূরত্ব সাধারণ ধারণাকে হার মানায়, তাই মাপের মডেল কাজে লাগে। সূর্যকে যদি ফুটবলের আকারে ছোট করা হয়, পৃথিবী হবে প্রায় ছাব্বিশ মিটার দূরে একটি গোলমরিচের দানা। একই মাপে পরের নিকটতম নক্ষত্র হবে আরেকটি ফুটবল, প্রায় সাত হাজার কিলোমিটার দূরে। এ কারণেই জ্যোতির্বিদরা আলোর ভ্রমণ-সময়ে মাপেন: সূর্যালোক আমাদের কাছে আসে আট মিনিট বিশ সেকেন্ডে, নিকটতম নক্ষত্রের আলো আসতে লাগে চার বছরের বেশি, আর দূরের ছায়াপথের আলো চলছে কোটি কোটি বছর ধরে। তাই বাইরে তাকানো মানে সব সময়ই অতীতের দিকে তাকানো।"},
pts:[{en:"A light year is a distance, not a length of time",bn:"আলোকবর্ষ একটি দূরত্ব, সময় নয়"},{en:"The earth's orbit is slightly oval, so the distance varies through the year",bn:"পৃথিবীর কক্ষপথ কিছুটা ডিম্বাকার, তাই বছরজুড়ে দূরত্ব বদলায়"},{en:"If the sun vanished, we would not know for eight minutes",bn:"সূর্য হঠাৎ মিলিয়ে গেলে আমরা আট মিনিট তা জানতেই পারতাম না"}]},

{i:64,cat:"space",k:"galaxy milky way spiral stars universe ছায়াপথ",
t:{en:"What is a galaxy?",bn:"ছায়াপথ কী?"},
s:{en:"An enormous gravitationally bound system of stars, gas and dust — our sun is one star among hundreds of billions in ours.",bn:"মাধ্যাকর্ষণে বাঁধা নক্ষত্র, গ্যাস ও ধূলিকণার বিশাল ব্যবস্থা — আমাদেরটিতে কয়েকশো বিলিয়ন নক্ষত্রের একটি আমাদের সূর্য।"},
svg:S(`<g class="ln"><path d="M160 96 q60-50 110-10 q-40-60-110-20 q-70-40-110 20 q50-40 110 10 Z"/><path d="M160 96 q-60 50-110 10 q40 60 110 20 q70 40 110-20 q-50 40-110-10 Z"/></g><path class="fl" d="M160 96 q60-50 110-10 q-40-60-110-20 q-70-40-110 20 q50-40 110 10 Z"/><path class="fl" d="M160 96 q-60 50-110 10 q40 60 110 20 q70 40 110-20 q-50 40-110-10 Z"/><ellipse cx="160" cy="96" rx="26" ry="18" class="ln" fill="#fff"/><ellipse cx="160" cy="96" rx="26" ry="18" class="ln"/><circle cx="212" cy="74" r="4" fill="currentColor" class="ln"/><path class="ln2" d="M212 74 L268 40"/>${M(160,96,1)}${M(268,30,2)}${M(58,152,3)}`),
legend:[{en:"A dense central bulge, often with a supermassive black hole",bn:"ঘন কেন্দ্রীয় স্ফীতি, প্রায়ই অতিভারী কৃষ্ণগহ্বরসহ"},{en:"Our sun sits far out in one of the spiral arms",bn:"আমাদের সূর্য একটি সর্পিল বাহুর অনেক বাইরে অবস্থিত"},{en:"Arms are regions where new stars are actively forming",bn:"বাহুগুলোতেই সক্রিয়ভাবে নতুন নক্ষত্র জন্মায়"}],
body:{en:"Stars are not scattered evenly through the universe; gravity gathers them into galaxies separated by mostly empty space. Ours, the Milky Way, is a barred spiral roughly a hundred thousand light years across containing a few hundred billion stars, and the faint band visible in a dark rural sky is simply our view along its disc from inside. Galaxies come in spiral, elliptical and irregular forms, often cluster together, and sometimes collide and merge over hundreds of millions of years. Current estimates put the number of galaxies in the observable universe in the hundreds of billions.",bn:"নক্ষত্র মহাবিশ্বে সমানভাবে ছড়ানো নয়; মাধ্যাকর্ষণ তাদের ছায়াপথে জড়ো করে, আর ছায়াপথগুলোর মাঝে বেশিরভাগই ফাঁকা জায়গা। আমাদেরটি, আকাশগঙ্গা, প্রায় এক লক্ষ আলোকবর্ষ ব্যাসের একটি দণ্ডযুক্ত সর্পিল ছায়াপথ, যাতে কয়েকশো বিলিয়ন নক্ষত্র আছে, আর অন্ধকার গ্রামীণ আকাশে দেখা আবছা পটিটি আসলে ভেতর থেকে এর চাকতি বরাবর আমাদের দৃষ্টি। ছায়াপথ সর্পিল, উপবৃত্তাকার ও অনিয়মিত আকারের হয়, প্রায়ই গুচ্ছবদ্ধ থাকে এবং কখনো কোটি কোটি বছর ধরে সংঘর্ষে মিশে যায়। বর্তমান হিসাব বলছে, দৃশ্যমান মহাবিশ্বে ছায়াপথের সংখ্যা কয়েকশো বিলিয়ন।"},
pts:[{en:"The sun takes over 200 million years to circle the galaxy once",bn:"ছায়াপথ একবার প্রদক্ষিণে সূর্যের লাগে ২০ কোটি বছরেরও বেশি"},{en:"Light pollution hides the Milky Way from most city dwellers",bn:"আলোক দূষণে বেশিরভাগ শহরবাসী আকাশগঙ্গা দেখতেই পান না"},{en:"Galaxies are held together partly by unseen matter we cannot yet identify",bn:"ছায়াপথ আংশিকভাবে এমন অদৃশ্য পদার্থে বাঁধা, যা এখনো শনাক্ত হয়নি"}]},

{i:65,cat:"space",k:"big bang expansion universe cosmology redshift মহাবিস্ফোরণ",
t:{en:"What is the Big Bang?",bn:"মহাবিস্ফোরণ কী?"},
s:{en:"The finding that the universe was once hot and dense everywhere and has been expanding ever since.",bn:"এই আবিষ্কার যে মহাবিশ্ব একসময় সর্বত্র উত্তপ্ত ও ঘন ছিল এবং তখন থেকে প্রসারিত হয়ে চলেছে।"},
svg:S(`<g class="ln"><circle cx="40" cy="96" r="8" fill="currentColor"/><circle cx="110" cy="96" r="24"/><circle cx="200" cy="96" r="42"/><circle cx="200" cy="96" r="42" class="fl"/></g><g class="ln"><path d="M262 96 H300 M292 88 L302 96 L292 104"/></g><g class="ln2"><path d="M40 150 H300 M40 144 V156 M300 144 V156"/></g><g class="ln"><circle cx="186" cy="80" r="3" fill="currentColor"/><circle cx="214" cy="106" r="3" fill="currentColor"/><circle cx="196" cy="118" r="3" fill="currentColor"/><circle cx="220" cy="76" r="3" fill="currentColor"/></g>${M(40,60,1)}${M(110,54,2)}${M(200,32,3)}`),
legend:[{en:"Everything began in an extremely hot, dense state",bn:"সবকিছুর শুরু অত্যন্ত উত্তপ্ত ও ঘন অবস্থায়"},{en:"Space itself expanded and cooled, letting atoms form",bn:"স্থান নিজেই প্রসারিত ও ঠান্ডা হয়, পরমাণু গঠিত হতে পারে"},{en:"Matter clumped into stars and galaxies over billions of years",bn:"কোটি কোটি বছরে পদার্থ জমে নক্ষত্র ও ছায়াপথ হয়"}],
body:{en:"The name is misleading, since nothing exploded into pre-existing space — rather, space itself has been stretching, carrying galaxies apart. The evidence is threefold and independent. Light from distant galaxies is shifted toward red in proportion to their distance, exactly as expected if everything is receding. A faint microwave glow fills the entire sky, the cooled remnant of that early hot phase. And the measured proportions of hydrogen and helium in the universe match what the theory predicts should have formed in the first few minutes. The theory describes how the universe developed from a very early hot state, not what caused it.",bn:"নামটি বিভ্রান্তিকর, কারণ আগে থেকে থাকা কোনো স্থানে কিছু বিস্ফোরিত হয়নি — বরং স্থান নিজেই প্রসারিত হয়ে ছায়াপথগুলোকে দূরে সরিয়ে নিচ্ছে। প্রমাণ তিনটি এবং পরস্পর স্বাধীন। দূরের ছায়াপথের আলো তাদের দূরত্বের অনুপাতে লালের দিকে সরে যায়, সবকিছু দূরে সরলে ঠিক যেমন হওয়ার কথা। একটি ক্ষীণ মাইক্রোওয়েভ আভা গোটা আকাশ ভরে আছে, যা সেই আদি উত্তপ্ত পর্বের ঠান্ডা হওয়া অবশেষ। আর মহাবিশ্বে মাপা হাইড্রোজেন ও হিলিয়ামের অনুপাত মিলে যায় তত্ত্বের ভবিষ্যদ্বাণীর সঙ্গে, যা বলে প্রথম কয়েক মিনিটে এগুলো তৈরি হওয়ার কথা। তত্ত্বটি বর্ণনা করে অতি আদি উত্তপ্ত অবস্থা থেকে মহাবিশ্ব কীভাবে বিকশিত হলো, তার কারণ কী তা নয়।"},
pts:[{en:"The universe is currently measured at about 13.8 billion years old",bn:"মহাবিশ্বের বয়স বর্তমানে প্রায় ১৩৮০ কোটি বছর মাপা হয়েছে"},{en:"There is no centre — expansion looks the same from every galaxy",bn:"কোনো কেন্দ্র নেই — প্রতিটি ছায়াপথ থেকেই প্রসারণ একই রকম দেখায়"},{en:"The expansion appears to be speeding up, for reasons not yet understood",bn:"প্রসারণ ত্বরান্বিত হচ্ছে বলে মনে হয়, কারণ এখনো অজানা"}]},

{i:66,cat:"space",k:"mars red planet iron oxide rover মঙ্গল গ্রহ",

legend:[{en:"Fine dust coats almost the entire surface",bn:"প্রায় গোটা পৃষ্ঠই সূক্ষ্ম ধুলায় ঢাকা"},{en:"Iron in that dust has oxidised over billions of years",bn:"সেই ধুলার লোহা কোটি কোটি বছরে জারিত হয়েছে"},{en:"Rovers analyse the soil directly to confirm its composition",bn:"রোভার সরাসরি মাটি পরীক্ষা করে গঠন নিশ্চিত করে"}],
body:{en:"Mars is covered in a fine dust containing a high proportion of iron, and over geological time that iron has reacted with oxygen to form iron oxide — chemically the same process that rusts a gate, though it happened long ago when conditions differed. Global dust storms spread the material evenly, so the whole planet takes on the colour. The thin atmosphere, about one percent of earth's pressure and mostly carbon dioxide, also scatters light differently, giving a butterscotch sky in daylight and, oddly, bluish tints around the setting sun. Rovers have confirmed the surface chemistry directly.",bn:"মঙ্গল ঢাকা আছে সূক্ষ্ম ধুলায়, যাতে লোহার পরিমাণ অনেক বেশি, আর ভূতাত্ত্বিক সময় ধরে সেই লোহা অক্সিজেনের সঙ্গে বিক্রিয়া করে আয়রন অক্সাইড তৈরি করেছে — রাসায়নিকভাবে যা গেটে মরিচা ধরার মতোই প্রক্রিয়া, যদিও তা ঘটেছে বহুকাল আগে ভিন্ন পরিস্থিতিতে। বৈশ্বিক ধূলিঝড় উপাদানটি সমানভাবে ছড়িয়ে দেয়, তাই গোটা গ্রহই সেই রং ধারণ করে। পাতলা বায়ুমণ্ডল, যা পৃথিবীর চাপের প্রায় এক শতাংশ ও মূলত কার্বন ডাই-অক্সাইড, আলোকেও ভিন্নভাবে বিক্ষিপ্ত করে, ফলে দিনের আকাশ হয় বাদামি-হলুদ আর অদ্ভুতভাবে অস্তগামী সূর্যের চারপাশে নীলচে আভা দেখা যায়। রোভারগুলো সরাসরি পৃষ্ঠের রসায়ন নিশ্চিত করেছে।"},
pts:[{en:"Mars has the tallest known volcano in the solar system",bn:"সৌরজগতের সবচেয়ে উঁচু জ্ঞাত আগ্নেয়গিরি মঙ্গলে"},{en:"Dry riverbeds indicate liquid water flowed there long ago",bn:"শুকনো নদীখাত দেখায় বহু আগে সেখানে তরল পানি বইত"},{en:"A Martian day is only about forty minutes longer than ours",bn:"মঙ্গলের একটি দিন আমাদের চেয়ে মাত্র প্রায় চল্লিশ মিনিট বড়"}]},

{i:67,cat:"space",k:"comet tail ice sublimation orbit ধূমকেতু",
t:{en:"What are comets?",bn:"ধূমকেতু কী?"},
s:{en:"Dirty snowballs from the outer solar system that grow glowing tails when sunlight vaporises their ice.",bn:"বহিঃসৌরজগতের ময়লা তুষারগোলক, সূর্যালোকে তাদের বরফ বাষ্প হলে জ্বলজ্বলে লেজ গজায়।"},
svg:S(`<circle cx="60" cy="96" r="18" class="ln"/><path class="fl2" d="M60 78 a18 18 0 1 0 0 36 a18 18 0 1 0 0-36"/><circle cx="212" cy="86" r="12" class="ln" fill="currentColor"/><path class="ln" d="M212 74 q-8-6-16-2 M212 98 q-8 6-16 2"/><g class="ln2"><path d="M224 80 q40-16 84-30"/><path d="M224 88 q42-6 88-6"/><path d="M224 96 q40 10 84 22"/></g><path class="ln2" d="M92 84 L198 82 M92 108 L198 92"/><g class="ln"><path d="M120 150 q60-40 160-50" stroke-dasharray="4 4"/></g>${M(60,140,1)}${M(212,58,2)}${M(292,124,3)}`),
legend:[{en:"Sunlight heats the icy nucleus as it approaches",bn:"কাছে এলে সূর্যালোক বরফের কেন্দ্রকে উত্তপ্ত করে"},{en:"Ice turns straight to gas, releasing trapped dust",bn:"বরফ সরাসরি গ্যাস হয়ে আটকে থাকা ধুলা ছেড়ে দেয়"},{en:"Solar wind pushes the tail away from the sun, not backwards",bn:"সৌরবায়ু লেজকে সূর্যের বিপরীতে ঠেলে, পেছনে নয়"}],
body:{en:"A comet's solid core is typically only a few kilometres across, a loose mixture of water ice, frozen gases and rocky dust left over from the formation of the solar system. For most of its long elliptical orbit it is inert and invisible. As it nears the sun the ice sublimates directly into gas, blowing off dust and forming a glowing cloud and one or two tails that can stretch millions of kilometres. Crucially the tail always points away from the sun, so on the outward journey the comet is actually travelling tail-first. Because they preserve original material, comets are valuable records of the early solar system.",bn:"ধূমকেতুর কঠিন কেন্দ্র সাধারণত মাত্র কয়েক কিলোমিটার চওড়া, যা সৌরজগৎ গঠনের সময়কার অবশিষ্ট পানির বরফ, জমাট গ্যাস ও পাথুরে ধুলার আলগা মিশ্রণ। দীর্ঘ উপবৃত্তাকার কক্ষপথের বেশিরভাগ সময় এটি নিষ্ক্রিয় ও অদৃশ্য থাকে। সূর্যের কাছে এলে বরফ সরাসরি গ্যাসে পরিণত হয়, ধুলা উড়িয়ে দেয় এবং জ্বলজ্বলে মেঘ ও এক-দুটি লেজ তৈরি করে, যা লক্ষ লক্ষ কিলোমিটার লম্বা হতে পারে। গুরুত্বপূর্ণ বিষয়, লেজ সব সময় সূর্যের বিপরীত দিকে থাকে, তাই ফেরার পথে ধূমকেতু আসলে লেজ আগে রেখেই চলে। আদি উপাদান সংরক্ষণ করে বলে ধূমকেতু আদি সৌরজগতের মূল্যবান দলিল।"},
pts:[{en:"Meteor showers occur when earth passes through comet debris",bn:"পৃথিবী ধূমকেতুর ধ্বংসাবশেষ পেরোলে উল্কাবৃষ্টি হয়"},{en:"Some comets return on schedule; others pass only once",bn:"কিছু ধূমকেতু নিয়মিত ফেরে; কিছু আসে কেবল একবারই"},{en:"Comets may have delivered part of earth's water",bn:"পৃথিবীর পানির একাংশ ধূমকেতুই এনে থাকতে পারে"}]},

{i:68,cat:"tech",k:"artificial intelligence machine learning neural network training কৃত্রিম বুদ্ধিমত্তা",
t:{en:"How does artificial intelligence work?",bn:"কৃত্রিম বুদ্ধিমত্তা কীভাবে কাজ করে?"},
s:{en:"Instead of being given rules, the system adjusts millions of internal numbers until it reliably predicts the right answer from examples.",bn:"নিয়ম বলে দেওয়ার বদলে ব্যবস্থাটি লক্ষ লক্ষ অভ্যন্তরীণ সংখ্যা সমন্বয় করে, যতক্ষণ না উদাহরণ থেকে নির্ভরযোগ্যভাবে সঠিক উত্তর অনুমান করতে পারে।"},
