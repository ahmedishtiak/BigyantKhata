legend:[{en:"Input: the image, sentence or numbers being examined",bn:"ইনপুট: যে ছবি, বাক্য বা সংখ্যা পরীক্ষা করা হচ্ছে"},{en:"Hidden layers combine features using weighted connections",bn:"গোপন স্তর ভারযুক্ত সংযোগ দিয়ে বৈশিষ্ট্য মেলায়"},{en:"Output: the prediction, compared to the correct answer during training",bn:"আউটপুট: অনুমান, প্রশিক্ষণে যা সঠিক উত্তরের সঙ্গে মেলানো হয়"}],
body:{en:"Traditional software follows instructions a person wrote. Machine learning inverts this: you supply many examples with known answers, and the program searches for internal settings that reproduce those answers. A neural network is a stack of simple units, each taking numbers in, multiplying them by adjustable weights, and passing a result on. Training means showing an example, measuring how wrong the output was, and nudging every weight slightly in the direction that reduces the error — repeated billions of times. The result is a system with useful statistical patterns but no understanding in the human sense, which is why it can be confidently wrong and why the quality and bias of the training data matter enormously.",bn:"প্রচলিত সফটওয়্যার মানুষের লেখা নির্দেশ মেনে চলে। মেশিন লার্নিং উল্টোটা করে: আপনি জানা উত্তরসহ বহু উদাহরণ দেন, আর প্রোগ্রাম এমন অভ্যন্তরীণ বিন্যাস খোঁজে যা সেই উত্তরগুলো পুনরুৎপাদন করে। নিউরাল নেটওয়ার্ক হলো সরল এককের স্তূপ, প্রতিটি সংখ্যা নেয়, সমন্বয়যোগ্য ভার দিয়ে গুণ করে ও ফল এগিয়ে দেয়। প্রশিক্ষণ মানে একটি উদাহরণ দেখানো, আউটপুট কতটা ভুল তা মাপা, আর প্রতিটি ভারকে সামান্য এমন দিকে সরানো যাতে ভুল কমে — কোটি কোটি বার এর পুনরাবৃত্তি। ফলে তৈরি হয় এমন ব্যবস্থা যাতে কার্যকর পরিসংখ্যানগত নকশা আছে কিন্তু মানবিক অর্থে বোঝাবুঝি নেই, তাই তা আত্মবিশ্বাসের সঙ্গে ভুল বলতে পারে এবং প্রশিক্ষণ তথ্যের মান ও পক্ষপাত বিপুল গুরুত্ব বহন করে।"},
pts:[{en:"Language models predict likely next words, they do not look up facts",bn:"ভাষা মডেল সম্ভাব্য পরবর্তী শব্দ অনুমান করে, তথ্য খুঁজে দেখে না"},{en:"Biased training data produces biased outputs",bn:"পক্ষপাতদুষ্ট প্রশিক্ষণ তথ্য পক্ষপাতদুষ্ট ফল দেয়"},{en:"Always verify AI output on anything that matters",bn:"গুরুত্বপূর্ণ কিছুতে এআইয়ের ফল সব সময় যাচাই করুন"}]},

{i:69,cat:"tech",k:"internet packet router protocol server ইন্টারনেট",
t:{en:"How does the internet work?",bn:"ইন্টারনেট কীভাবে কাজ করে?"},
s:{en:"Messages are chopped into small packets, each finds its own route across many networks, and they are reassembled at the destination.",bn:"বার্তা ছোট ছোট প্যাকেটে ভাগ হয়, প্রতিটি নিজের পথ খুঁজে বহু নেটওয়ার্ক পেরোয়, আর গন্তব্যে আবার জোড়া লাগে।"},
svg:S(`<g class="ln"><rect x="20" y="82" width="40" height="28" rx="3"/><path d="M30 110 v8 h20 v-8"/></g><g class="ln"><rect x="260" y="70" width="36" height="52" rx="3"/><path d="M266 82 h24 M266 94 h24 M266 106 h24"/></g><g class="ln"><circle cx="118" cy="58" r="14"/><circle cx="118" cy="134" r="14"/><circle cx="196" cy="58" r="14"/><circle cx="196" cy="134" r="14"/><circle cx="157" cy="96" r="14"/></g><g class="ln2"><path d="M62 96 L104 62 M62 96 L104 130 M132 58 L182 58 M132 134 L182 134 M132 62 L146 88 M170 88 L184 62 M146 106 L132 130 M170 106 L184 130 M210 58 L258 82 M210 134 L258 112"/></g><g class="ln"><rect x="78" y="86" width="14" height="10"/><rect x="222" y="96" width="14" height="10"/></g>${M(40,140,1)}${M(157,168,2)}${M(278,144,3)}`),
legend:[{en:"Your device splits data into numbered packets",bn:"আপনার যন্ত্র তথ্যকে নম্বরযুক্ত প্যাকেটে ভাগ করে"},{en:"Routers forward each packet along whichever path is free",bn:"রাউটার প্রতিটি প্যাকেট যে পথ খালি সেদিকেই পাঠায়"},{en:"The server reorders them and sends its reply the same way",bn:"সার্ভার সেগুলো সাজিয়ে নেয় ও একইভাবে জবাব পাঠায়"}],
body:{en:"The internet is not one network but millions of independent ones agreeing to use the same rules. When you request a page, your message is divided into packets, each labelled with source, destination and sequence number. Routers along the way read only the destination and forward each packet toward it, choosing whatever route is currently efficient — so packets from one message may travel entirely different paths and arrive out of order. The receiving computer reassembles them by sequence number and requests any that went missing. Domain names are translated into numeric addresses by a distributed directory before any of this begins.",bn:"ইন্টারনেট একটি নেটওয়ার্ক নয়, বরং একই নিয়ম মানতে রাজি হওয়া লক্ষ লক্ষ স্বাধীন নেটওয়ার্ক। আপনি কোনো পাতা চাইলে আপনার বার্তা প্যাকেটে ভাগ হয়, প্রতিটিতে উৎস, গন্তব্য ও ক্রমিক নম্বর লেখা থাকে। পথের রাউটারগুলো কেবল গন্তব্য পড়ে প্রতিটি প্যাকেট সেদিকে পাঠায়, তখন যে পথ কার্যকর সেটিই বেছে নেয় — তাই একই বার্তার প্যাকেট সম্পূর্ণ ভিন্ন পথে গিয়ে এলোমেলো ক্রমে পৌঁছাতে পারে। গ্রহণকারী কম্পিউটার ক্রমিক নম্বর দেখে সেগুলো সাজায় ও হারানো প্যাকেট আবার চায়। এসব শুরুর আগেই একটি বিতরণকৃত তালিকা ডোমেইন নামকে সাংখ্যিক ঠিকানায় অনুবাদ করে।"},
pts:[{en:"Most intercontinental traffic travels through undersea fibre cables",bn:"আন্তমহাদেশীয় বেশিরভাগ ট্র্যাফিক সমুদ্রতলের ফাইবার কেবল দিয়ে যায়"},{en:"The web is one service running on the internet, not the internet itself",bn:"ওয়েব ইন্টারনেটে চলা একটি সেবা, ইন্টারনেট নিজে নয়"},{en:"Packet switching makes the network survive broken links",bn:"প্যাকেট সুইচিংয়ের কারণে সংযোগ ছিঁড়লেও নেটওয়ার্ক টিকে থাকে"}]},

{i:70,cat:"tech",k:"mobile phone cell tower radio signal handover মোবাইল ফোন",
t:{en:"How does a mobile phone work?",bn:"মোবাইল ফোন কীভাবে কাজ করে?"},
s:{en:"It is a two-way radio that talks to the nearest tower, and the network hands you over as you move between coverage cells.",bn:"এটি দ্বিমুখী রেডিও, নিকটতম টাওয়ারের সঙ্গে কথা বলে, আর আপনি সরলে নেটওয়ার্ক আপনাকে এক সেল থেকে আরেকটিতে হস্তান্তর করে।"},
svg:S(`<g class="ln2"><path d="M110 96 a44 44 0 0 1 88 0 a44 44 0 0 1-88 0" fill="none"/><path d="M40 96 a70 40 0 0 1 140 0 a70 40 0 0 1-140 0" fill="none"/></g><g class="ln"><path d="M96 40 L110 130 M138 40 L124 130 M104 76 h26 M100 58 h34"/><path d="M117 40 v-16"/><path d="M108 28 q9-10 18 0"/></g><g class="ln"><rect x="222" y="66" width="34" height="60" rx="5"/><path d="M230 76 h18 M230 88 h18"/><circle cx="239" cy="116" r="4"/></g><g class="ln2"><path d="M160 60 q30-14 58 4" stroke-dasharray="3 3"/><path d="M160 120 q30 14 58-4" stroke-dasharray="3 3"/></g>${M(117,160,1)}${M(239,150,2)}${M(52,52,3)}`),
legend:[{en:"Towers divide the area into overlapping coverage cells",bn:"টাওয়ার এলাকা ভাগ করে পরস্পর মেশানো কভারেজ সেলে"},{en:"The phone sends and receives on assigned radio frequencies",bn:"ফোন নির্ধারিত বেতার কম্পাঙ্কে পাঠায় ও গ্রহণ করে"},{en:"Moving between cells triggers an automatic handover",bn:"এক সেল থেকে অন্যটিতে গেলে স্বয়ংক্রিয় হস্তান্তর হয়"}],
body:{en:"Your voice is converted into a digital stream, compressed, and transmitted as a modulated radio wave to the nearest base station, which passes it into the wired network toward the recipient. The word cellular describes the design: instead of one powerful transmitter, the area is covered by many low-power ones, so the same frequencies can be reused a short distance away without interference. Your handset constantly measures signal strength from surrounding towers and reports back, allowing the network to switch your connection mid-call as you travel. Each generation of the standard has mainly increased data capacity rather than changing this basic architecture.",bn:"আপনার কণ্ঠ ডিজিটাল ধারায় রূপান্তরিত হয়, সংকুচিত হয় এবং মড্যুলেটেড বেতার তরঙ্গ হিসেবে নিকটতম বেস স্টেশনে যায়, যা সেটিকে তারযুক্ত নেটওয়ার্কে পাঠিয়ে প্রাপকের দিকে এগিয়ে দেয়। 'সেলুলার' শব্দটি নকশাটিকেই বোঝায়: একটি শক্তিশালী প্রেরকের বদলে এলাকাটি ঢাকা হয় বহু স্বল্পক্ষমতার প্রেরক দিয়ে, ফলে অল্প দূরত্বেই একই কম্পাঙ্ক আবার ব্যবহার করা যায়, হস্তক্ষেপ ছাড়াই। আপনার হ্যান্ডসেট চারপাশের টাওয়ার থেকে সংকেতের শক্তি অবিরাম মেপে জানায়, যাতে চলার পথে কথা বলার মাঝেই নেটওয়ার্ক সংযোগ বদলে দিতে পারে। স্ট্যান্ডার্ডের প্রতিটি প্রজন্ম মূলত এই মৌলিক কাঠামো না বদলে তথ্য ধারণক্ষমতা বাড়িয়েছে।"},
pts:[{en:"The SIM card identifies your account, not the handset",bn:"সিম কার্ড আপনার অ্যাকাউন্ট শনাক্ত করে, হ্যান্ডসেট নয়"},{en:"Weak signal drains battery because the phone transmits harder",bn:"সংকেত দুর্বল হলে ফোন জোরে পাঠায়, তাই ব্যাটারি দ্রুত ফুরায়"},{en:"Higher frequencies carry more data but travel shorter distances",bn:"উচ্চ কম্পাঙ্ক বেশি তথ্য বহন করে, কিন্তু কম দূরত্ব যায়"}]},

{i:71,cat:"tech",k:"gps navigation satellite trilateration timing জিপিএস",
t:{en:"How does GPS know where you are?",bn:"জিপিএস আপনার অবস্থান জানে কীভাবে?"},
s:{en:"Your device times signals from several satellites and works out the only point consistent with all those distances.",bn:"আপনার যন্ত্র কয়েকটি স্যাটেলাইট থেকে আসা সংকেতের সময় মেপে এমন একটি বিন্দু বের করে যা সব দূরত্বের সঙ্গে মেলে।"},
svg:S(`<g class="ln"><rect x="46" y="30" width="22" height="14"/><rect x="150" y="24" width="22" height="14"/><rect x="252" y="34" width="22" height="14"/></g><g class="ln2"><circle cx="57" cy="37" r="72" fill="none"/><circle cx="161" cy="31" r="86" fill="none"/><circle cx="263" cy="41" r="80" fill="none"/></g><circle cx="146" cy="112" r="6" class="ln" fill="currentColor"/><path class="ln" d="M0 160 H320"/><path class="fl" d="M0 160 H320 V190 H0 Z"/><g class="ln"><rect x="132" y="128" width="28" height="30" rx="3"/></g>${M(57,60,1)}${M(146,112,2)}${M(276,120,3)}`),
legend:[{en:"Each satellite broadcasts its position and a precise timestamp",bn:"প্রতিটি স্যাটেলাইট নিজের অবস্থান ও নির্ভুল সময় সম্প্রচার করে"},{en:"Signal delay reveals your distance from each one",bn:"সংকেতের বিলম্ব থেকে প্রতিটির থেকে আপনার দূরত্ব বোঝা যায়"},{en:"Four or more distances pin down one exact position",bn:"চার বা তার বেশি দূরত্ব মিলে একটিমাত্র অবস্থান নির্দিষ্ট করে"}],
body:{en:"Each navigation satellite carries an atomic clock and continuously broadcasts where it is and exactly when the signal left. Your receiver compares that timestamp with its own clock to find the travel time, and multiplying by the speed of light gives the distance. One distance places you on a sphere, two narrow it to a circle, three to a pair of points, and a fourth satellite both resolves the ambiguity and corrects your device's cheap clock. Accuracy is limited mainly by the atmosphere bending signals and by buildings reflecting them, which is why cities are harder than open fields.",bn:"প্রতিটি নেভিগেশন স্যাটেলাইটে থাকে পারমাণবিক ঘড়ি, আর তা অবিরাম জানায় সে কোথায় আছে এবং সংকেতটি ঠিক কখন ছেড়েছে। আপনার গ্রাহক যন্ত্র সেই সময়ের সঙ্গে নিজের ঘড়ি মিলিয়ে ভ্রমণকাল বের করে, আর আলোর গতি দিয়ে গুণ করলেই পাওয়া যায় দূরত্ব। একটি দূরত্ব আপনাকে একটি গোলকের উপর রাখে, দুটি তা কমিয়ে বৃত্তে আনে, তিনটিতে দুটি বিন্দু থাকে, আর চতুর্থ স্যাটেলাইট সেই দ্বিধা মেটায় এবং আপনার যন্ত্রের সস্তা ঘড়িও শুধরে দেয়। নির্ভুলতা মূলত সীমিত হয় বায়ুমণ্ডলে সংকেত বেঁকে যাওয়ায় ও ভবনে প্রতিফলিত হওয়ায়, তাই খোলা মাঠের চেয়ে শহরে এটি কঠিন।"},
pts:[{en:"Your phone only receives; it never transmits to the satellites",bn:"আপনার ফোন কেবল গ্রহণ করে; স্যাটেলাইটে কিছু পাঠায় না"},{en:"Relativity corrections are essential or positions drift badly each day",bn:"আপেক্ষিকতার সংশোধন না করলে প্রতিদিন অবস্থান বিপুল ভুল হতো"},{en:"Several countries now run their own satellite navigation systems",bn:"এখন একাধিক দেশ নিজস্ব স্যাটেলাইট নেভিগেশন ব্যবস্থা চালায়"}]},

{i:72,cat:"tech",k:"computer memory binary storage transistor bit কম্পিউটার তথ্য",
t:{en:"How does a computer store information?",bn:"কম্পিউটার তথ্য জমা রাখে কীভাবে?"},
s:{en:"Everything is reduced to patterns of two states — on and off — recorded as charge, magnetism or reflectivity.",bn:"সবকিছুই নামিয়ে আনা হয় দুই অবস্থার নকশায় — চালু ও বন্ধ — যা আধান, চুম্বকত্ব বা প্রতিফলন হিসেবে রাখা হয়।"},
svg:S(`<g class="ln">${[0,1,2,3,4,5,6,7].map(n=>`<rect x="${30+n*32}" y="60" width="24" height="24"/>`).join("")}</g><g class="fl">${[1,2,5,7].map(n=>`<rect x="${30+n*32}" y="60" width="24" height="24"/>`).join("")}</g><g class="ln"><text x="42" y="104" class="lbl">0</text><text x="74" y="104" class="lbl">1</text><text x="106" y="104" class="lbl">1</text><text x="138" y="104" class="lbl">0</text><text x="170" y="104" class="lbl">0</text><text x="202" y="104" class="lbl">1</text><text x="234" y="104" class="lbl">0</text><text x="266" y="104" class="lbl">1</text></g><g class="ln"><path d="M160 118 V138 M152 130 L160 140 L168 130"/><rect x="120" y="144" width="80" height="26" rx="3"/></g>${M(42,44,1)}${M(160,44,2)}${M(240,158,3)}`),
legend:[{en:"A bit is one switch: off is 0, on is 1",bn:"বিট মানে একটি সুইচ: বন্ধ হলে ০, চালু হলে ১"},{en:"Eight bits make a byte, enough for one character",bn:"আট বিটে এক বাইট, একটি অক্ষরের জন্য যথেষ্ট"},{en:"Agreed codes turn bit patterns into text, images and sound",bn:"স্বীকৃত সংকেত বিটের নকশাকে লেখা, ছবি ও শব্দে বদলায়"}],
body:{en:"Computers use binary because two clearly distinguishable states are far more reliable to build and detect than ten. A bit is stored physically in different ways depending on the medium: as trapped electric charge in flash memory, as magnetised regions on a hard disk, as pits and flats on an optical disc. Meaning comes entirely from agreed conventions — the same eight bits might be a letter, part of a colour, or a fragment of sound depending on how the file says to interpret them. Layer enough of these conventions and you get documents, photographs, video and software.",bn:"কম্পিউটার বাইনারি ব্যবহার করে, কারণ স্পষ্টভাবে আলাদা করা যায় এমন দুটি অবস্থা তৈরি ও শনাক্ত করা দশটির চেয়ে অনেক নির্ভরযোগ্য। মাধ্যম অনুযায়ী বিট ভিন্নভাবে ভৌতভাবে জমা থাকে: ফ্ল্যাশ মেমোরিতে আটকে রাখা বৈদ্যুতিক আধান হিসেবে, হার্ড ডিস্কে চুম্বকিত অঞ্চল হিসেবে, অপটিক্যাল ডিস্কে গর্ত ও সমতল হিসেবে। অর্থ পুরোটাই আসে স্বীকৃত রীতি থেকে — একই আট বিট হতে পারে একটি অক্ষর, কোনো রঙের অংশ, কিংবা শব্দের টুকরো, নির্ভর করে ফাইলটি কীভাবে ব্যাখ্যা করতে বলে তার উপর। এমন যথেষ্ট রীতি স্তরে স্তরে সাজালেই পাওয়া যায় নথি, আলোকচিত্র, ভিডিও ও সফটওয়্যার।"},
pts:[{en:"RAM is fast but forgets everything when power is cut",bn:"র‍্যাম দ্রুত, কিন্তু বিদ্যুৎ গেলে সব ভুলে যায়"},{en:"Compression removes predictable repetition to save space",bn:"সংকোচন অনুমেয় পুনরাবৃত্তি সরিয়ে জায়গা বাঁচায়"},{en:"Deleting a file usually just marks the space as reusable",bn:"ফাইল মুছলে সাধারণত কেবল জায়গাটিকে পুনর্ব্যবহারযোগ্য চিহ্নিত করা হয়"}]},

{i:73,cat:"tech",k:"battery cell electrode electrolyte charge lithium ব্যাটারি",
t:{en:"What is a battery and how does it store energy?",bn:"ব্যাটারি কী, আর তা শক্তি জমা রাখে কীভাবে?"},
s:{en:"Two different materials want to exchange electrons; the battery forces that exchange to travel through your device.",bn:"দুটি ভিন্ন পদার্থ ইলেকট্রন বিনিময় করতে চায়; ব্যাটারি সেই বিনিময়কে আপনার যন্ত্রের ভেতর দিয়ে যেতে বাধ্য করে।"},
svg:S(`<rect x="80" y="50" width="160" height="96" rx="6" class="ln"/><path class="ln" d="M160 50 V146"/><path class="fl" d="M80 50 H160 V146 H80 Z"/><path class="fl2" d="M160 50 H240 V146 H160 Z"/><g class="ln"><path d="M100 40 V26 h120 v14"/><path d="M110 26 V14 M210 26 V14"/></g><g class="ln"><path d="M110 96 h34 M196 96 h34"/><path d="M120 80 h14 M120 112 h14"/></g><g class="ln2"><path d="M160 70 q14 10 0 20 M160 110 q-14 10 0 20"/></g><g class="ln"><circle cx="264" cy="96" r="16"/><path d="M258 88 l12 16 M270 88 l-12 16"/></g>${M(120,164,1)}${M(160,164,2)}${M(210,164,3)}`),
legend:[{en:"The negative electrode releases electrons",bn:"ঋণাত্মক তড়িৎদ্বার ইলেকট্রন ছাড়ে"},{en:"The electrolyte lets ions cross but blocks electrons",bn:"তড়িৎবিশ্লেষ্য আয়ন পার হতে দেয়, ইলেকট্রন আটকায়"},{en:"Electrons must go the long way — through the circuit",bn:"ইলেকট্রনকে ঘুরপথে যেতে হয় — বর্তনীর ভেতর দিয়ে"}],
body:{en:"A battery stores chemical energy in two electrodes made of materials with different appetites for electrons. Inside, an electrolyte allows charged ions to move between them but deliberately blocks electrons, so the only route available to those electrons is the external circuit — and on the way they power whatever you have connected. When the reactive material is used up the battery is flat. In a rechargeable cell the reaction is reversible: pushing current backwards drives the chemistry the other way and restores the original arrangement, though a little capacity is permanently lost with each cycle.",bn:"ব্যাটারি রাসায়নিক শক্তি জমা রাখে এমন দুটি তড়িৎদ্বারে, যাদের উপাদানের ইলেকট্রনের প্রতি আগ্রহ ভিন্ন। ভেতরে তড়িৎবিশ্লেষ্য আধানযুক্ত আয়নকে এদিক-ওদিক যেতে দেয়, কিন্তু ইচ্ছাকৃতভাবে ইলেকট্রন আটকায়, ফলে সেই ইলেকট্রনের একমাত্র পথ থাকে বাইরের বর্তনী — আর যাওয়ার পথে তারা আপনার সংযুক্ত যন্ত্র চালায়। বিক্রিয়াশীল উপাদান ফুরিয়ে গেলে ব্যাটারি নিঃশেষ। পুনঃচার্জযোগ্য কোষে বিক্রিয়াটি উল্টানো যায়: উল্টো দিকে বিদ্যুৎ পাঠালে রসায়ন বিপরীত দিকে চলে ও আগের বিন্যাস ফিরে আসে, যদিও প্রতিটি চক্রে সামান্য ধারণক্ষমতা স্থায়ীভাবে হারায়।"},
pts:[{en:"Voltage depends on the materials; capacity depends on their quantity",bn:"ভোল্টেজ নির্ভর করে উপাদানে; ধারণক্ষমতা নির্ভর করে তার পরিমাণে"},{en:"Heat is the main enemy of battery lifespan",bn:"তাপই ব্যাটারির আয়ুর প্রধান শত্রু"},{en:"Damaged lithium cells can catch fire and must be disposed of carefully",bn:"ক্ষতিগ্রস্ত লিথিয়াম কোষে আগুন ধরতে পারে, সাবধানে ফেলা জরুরি"}]},

{i:74,cat:"tech",k:"wifi wireless router frequency band signal ওয়াই-ফাই",
t:{en:"How does Wi-Fi work?",bn:"ওয়াই-ফাই কীভাবে কাজ করে?"},
s:{en:"A router converts internet data into radio waves at set frequencies, and nearby devices convert them back.",bn:"রাউটার ইন্টারনেটের তথ্যকে নির্দিষ্ট কম্পাঙ্কের বেতার তরঙ্গে বদলায়, কাছের যন্ত্র তা আবার তথ্যে ফেরায়।"},
svg:S(`<g class="ln"><rect x="30" y="96" width="60" height="26" rx="4"/><path d="M44 96 V70 M76 96 V64"/><circle cx="44" cy="66" r="3" fill="currentColor"/><circle cx="76" cy="60" r="3" fill="currentColor"/></g><g class="ln2"><path d="M100 109 a40 40 0 0 1 0-1" fill="none"/><path d="M96 84 a34 34 0 0 1 0 50"/><path d="M112 70 a54 54 0 0 1 0 78"/><path d="M128 56 a74 74 0 0 1 0 106"/></g><g class="ln"><rect x="196" y="80" width="34" height="56" rx="4"/><rect x="252" y="90" width="52" height="34" rx="3"/><path d="M262 124 v8 h32 v-8"/></g><path class="ln2" d="M14 109 h-6"/>${M(60,150,1)}${M(140,40,2)}${M(214,158,3)}`),
legend:[{en:"The router receives data through a cable or fibre line",bn:"রাউটার কেবল বা ফাইবার লাইনে তথ্য পায়"},{en:"It encodes the data onto radio waves and broadcasts them",bn:"তথ্যকে বেতার তরঙ্গে বসিয়ে সম্প্রচার করে"},{en:"Devices decode the waves and reply on the same channel",bn:"যন্ত্র সেই তরঙ্গ পড়ে একই চ্যানেলে জবাব দেয়"}],
body:{en:"Wi-Fi is simply a short-range radio standard. The router takes the digital data arriving from your internet connection and varies a radio wave to represent the ones and zeros, transmitting typically in the 2.4 or 5 gigahertz bands. Devices within range pick up the wave and reverse the process. Because everyone shares the air, the standard includes rules for taking turns and for retransmitting anything lost to interference. Lower frequencies pass through walls better but carry less data, which is the trade-off behind the two common bands. Encryption matters because the signal reaches anyone in range.",bn:"ওয়াই-ফাই আসলে স্বল্প-পাল্লার একটি বেতার মান। রাউটার আপনার ইন্টারনেট সংযোগ থেকে আসা ডিজিটাল তথ্য নিয়ে বেতার তরঙ্গকে এমনভাবে বদলায় যাতে তা এক ও শূন্য বোঝায়, সাধারণত ২.৪ বা ৫ গিগাহার্টজ ব্যান্ডে সম্প্রচার করে। পাল্লার ভেতরের যন্ত্র সেই তরঙ্গ ধরে উল্টো প্রক্রিয়াটি করে। যেহেতু বাতাস সবাই ভাগাভাগি করে, তাই মানটিতে পালা করে ব্যবহার এবং হস্তক্ষেপে হারানো তথ্য পুনরায় পাঠানোর নিয়ম আছে। কম কম্পাঙ্ক দেয়াল ভেদ করে ভালো, কিন্তু কম তথ্য বহন করে, দুটি প্রচলিত ব্যান্ডের পেছনে এই দরকষাকষিই কাজ করে। সংকেত পাল্লার সবার কাছেই পৌঁছায় বলে এনক্রিপশন জরুরি।"},
pts:[{en:"Wi-Fi connects you to the router; the router connects to the internet",bn:"ওয়াই-ফাই আপনাকে রাউটারে যুক্ত করে; রাউটার যুক্ত হয় ইন্টারনেটে"},{en:"Microwave ovens and thick walls both weaken 2.4 GHz signals",bn:"মাইক্রোওয়েভ ওভেন ও পুরু দেয়াল দুটোই ২.৪ গিগাহার্টজ সংকেত দুর্বল করে"},{en:"Always use a strong password — open networks can be read by others",bn:"সব সময় শক্ত পাসওয়ার্ড দিন — খোলা নেটওয়ার্ক অন্যরা পড়তে পারে"}]},

{i:75,cat:"tech",k:"camera lens sensor aperture exposure pixel ক্যামেরা",
t:{en:"How does a camera work?",bn:"ক্যামেরা কীভাবে কাজ করে?"},
s:{en:"A lens projects a focused image onto a sensor, which measures the brightness and colour falling on each tiny square.",bn:"লেন্স একটি সুস্পষ্ট প্রতিবিম্ব সেন্সরের উপর ফেলে, যা প্রতিটি ক্ষুদ্র বর্গে পড়া উজ্জ্বলতা ও রং মাপে।"},
svg:S(`<rect x="120" y="60" width="120" height="80" rx="6" class="ln"/><path class="fl" d="M120 60 H240 V140 H120 Z"/><path class="ln" d="M120 76 h-24 v48 h24"/><ellipse cx="96" cy="100" rx="12" ry="26" class="ln" fill="#fff"/><path class="ln" d="M228 68 h8 v8 h-8 Z"/><g class="ln">${[0,1,2,3,4].map(a=>[0,1,2].map(b=>`<rect x="${152+a*16}" y="${76+b*16}" width="14" height="14"/>`).join("")).join("")}</g><g class="ln"><path d="M20 74 L84 94 M20 126 L84 106"/><path d="M40 60 q10-10 20 0"/></g>${M(96,150,1)}${M(196,44,2)}${M(276,120,3)}`),
legend:[{en:"Light enters through the lens and is focused",bn:"আলো লেন্স দিয়ে ঢুকে কেন্দ্রীভূত হয়"},{en:"The sensor is a grid of millions of light-measuring cells",bn:"সেন্সর হলো লক্ষ লক্ষ আলোক-মাপক কোষের জাল"},{en:"Each cell's reading becomes one pixel of the final image",bn:"প্রতিটি কোষের পাঠ চূড়ান্ত ছবির একটি পিক্সেল হয়"}],
body:{en:"Three settings control every photograph. The aperture is how wide the lens opening is, governing both how much light enters and how much of the scene appears sharp. The shutter speed is how long the sensor is exposed, deciding whether movement freezes or blurs. Sensitivity determines how strongly the signal is amplified, at the cost of visible noise. The sensor itself only measures brightness, so a coloured filter pattern sits over it and the processor reconstructs full colour by comparing neighbouring cells. Phone cameras compensate for their tiny lenses largely through software.",bn:"প্রতিটি আলোকচিত্র নিয়ন্ত্রণ করে তিনটি সেটিং। অ্যাপারচার হলো লেন্সের খোলা মুখ কতটা চওড়া, যা ঠিক করে কতটা আলো ঢুকবে এবং দৃশ্যের কতখানি স্পষ্ট থাকবে। শাটার স্পিড হলো সেন্সর কতক্ষণ আলোর সামনে থাকবে, যা ঠিক করে গতি থেমে যাবে না ঝাপসা হবে। সংবেদনশীলতা ঠিক করে সংকেত কতটা জোরালোভাবে বাড়ানো হবে, বিনিময়ে দৃশ্যমান দানা আসে। সেন্সর নিজে কেবল উজ্জ্বলতা মাপে, তাই তার উপরে থাকে রঙিন ফিল্টারের নকশা এবং প্রসেসর পাশের কোষগুলো মিলিয়ে পূর্ণ রং পুনর্গঠন করে। ফোন ক্যামেরা তার ক্ষুদ্র লেন্সের ঘাটতি মূলত সফটওয়্যার দিয়েই পুষিয়ে নেয়।"},
pts:[{en:"More megapixels does not automatically mean a better picture",bn:"বেশি মেগাপিক্সেল মানেই আপনাআপনি ভালো ছবি নয়"},{en:"A wide aperture blurs the background by narrowing the focus depth",bn:"চওড়া অ্যাপারচার ফোকাসের গভীরতা কমিয়ে পটভূমি ঝাপসা করে"},{en:"In dim light you must accept blur, noise or a steadier support",bn:"কম আলোয় ঝাপসা, দানা বা শক্ত ভিত্তি — কোনো একটি মানতেই হবে"}]}
];

{i:76,cat:"tech",k:"solar panel photovoltaic silicon renewable সৌর প্যানেল",
t:{en:"How does a solar panel make electricity?",bn:"সৌর প্যানেল বিদ্যুৎ বানায় কীভাবে?"},
s:{en:"Light knocks electrons loose in specially treated silicon, and the panel's structure forces them to flow one way.",bn:"আলো বিশেষভাবে প্রস্তুত সিলিকনে ইলেকট্রন আলগা করে দেয়, আর প্যানেলের গঠন সেগুলোকে একদিকে বইতে বাধ্য করে।"},
svg:S(`<g class="ln"><path d="M60 140 L120 60 H250 L190 140 Z"/>${[0,1,2].map(n=>`<path d="M${75+n*40} 140 L${135+n*40} 60"/>`).join("")}<path d="M92 100 H222"/></g><path class="fl" d="M60 140 L120 60 H250 L190 140 Z"/><g class="ln"><circle cx="42" cy="30" r="12"/><path d="M52 38 L96 66"/><path d="M64 26 L104 52"/></g><g class="ln"><path d="M190 140 h40 v20"/><rect x="212" y="160" width="36" height="22" rx="3"/></g><g class="ln"><circle cx="140" cy="106" r="4" fill="currentColor"/><circle cx="166" cy="112" r="4" fill="currentColor"/><path d="M148 104 h12 M174 110 h12"/></g>${M(42,60,1)}${M(140,86,2)}${M(268,150,3)}`),
legend:[{en:"Sunlight carries packets of energy called photons",bn:"সূর্যালোক ফোটন নামের শক্তি-প্যাকেট বহন করে"},{en:"A photon frees an electron from a silicon atom",bn:"ফোটন সিলিকন পরমাণু থেকে একটি ইলেকট্রন মুক্ত করে"},{en:"A built-in electric field pushes electrons into the circuit",bn:"অন্তর্নির্মিত বৈদ্যুতিক ক্ষেত্র ইলেকট্রনকে বর্তনীতে ঠেলে"}],
body:{en:"A solar cell is a sandwich of two silicon layers, each deliberately contaminated with a trace of a different element so that one has spare electrons and the other has spare gaps. Where they meet, a permanent internal electric field forms. When a photon of sunlight is absorbed it knocks an electron free, and that field immediately sweeps the electron to one side, creating a voltage across the cell. Connect a wire and current flows. Efficiency is limited because photons that are too weak pass straight through while excess energy from strong ones becomes heat.",bn:"সৌরকোষ হলো দুটি সিলিকন স্তরের স্যান্ডউইচ, প্রতিটিতে ইচ্ছাকৃতভাবে ভিন্ন মৌলের সামান্য মিশ্রণ দেওয়া হয় যাতে একটিতে বাড়তি ইলেকট্রন থাকে ও অন্যটিতে বাড়তি ফাঁক। যেখানে তারা মেলে, সেখানে স্থায়ী অভ্যন্তরীণ বৈদ্যুতিক ক্ষেত্র তৈরি হয়। সূর্যালোকের একটি ফোটন শোষিত হলে তা একটি ইলেকট্রন মুক্ত করে, আর সেই ক্ষেত্র তৎক্ষণাৎ ইলেকট্রনটিকে একদিকে ঠেলে দেয়, ফলে কোষের দুই প্রান্তে ভোল্টেজ তৈরি হয়। তার লাগালেই প্রবাহ চলে। দক্ষতা সীমিত থাকে, কারণ খুব দুর্বল ফোটন সোজা বেরিয়ে যায় আর শক্তিশালীগুলোর বাড়তি শক্তি তাপ হয়ে যায়।"},
pts:[{en:"Panels lose efficiency when they get hot, so ventilation helps",bn:"গরম হলে প্যানেলের দক্ষতা কমে, তাই বাতাস চলাচল দরকার"},{en:"Output is direct current, so an inverter is needed for household use",bn:"উৎপাদন হয় সরাসরি প্রবাহ, ঘরে ব্যবহারে ইনভার্টার লাগে"},{en:"Even light shading of one cell can cut a whole panel's output",bn:"একটি কোষে সামান্য ছায়া পড়লেই গোটা প্যানেলের উৎপাদন কমে যায়"}]},

{i:77,cat:"tech",k:"refrigerator cooling compressor evaporation heat pump ফ্রিজ",
t:{en:"How does a refrigerator work?",bn:"ফ্রিজ কীভাবে কাজ করে?"},
s:{en:"It does not make cold — it moves heat from inside to outside using a fluid that evaporates and condenses in a loop.",bn:"এটি ঠান্ডা তৈরি করে না — একটি তরল চক্রে বাষ্পীভূত ও ঘনীভূত হয়ে ভেতরের তাপ বাইরে সরায়।"},
svg:S(`<rect x="40" y="36" width="110" height="120" rx="6" class="ln"/><path class="fl" d="M40 36 H150 V156 H40 Z"/><path class="ln" d="M150 60 h40 v40 h-40" /><g class="ln"><path d="M190 60 q20-14 30 8 q10 22 30 10"/><rect x="236" y="70" width="40" height="34" rx="4"/><path d="M276 88 q20 14 20 30 q0 20-30 20 H150"/></g><g class="ln2"><path d="M64 70 h60 M64 92 h60 M64 114 h60"/></g><g class="ln"><path d="M170 44 q8-16 0-26 M186 44 q8-16 0-26"/></g>${M(94,172,1)}${M(170,120,2)}${M(256,132,3)}`),
legend:[{en:"Inside, the fluid evaporates and absorbs heat from the food",bn:"ভেতরে তরল বাষ্পীভূত হয়ে খাবার থেকে তাপ শুষে নেয়"},{en:"The compressor squeezes the vapour, raising its temperature",bn:"কম্প্রেসর বাষ্প চেপে তার তাপমাত্রা বাড়ায়"},{en:"Coils at the back release that heat into the room",bn:"পেছনের কয়েল সেই তাপ ঘরে ছেড়ে দেয়"}],
body:{en:"Cold is not a substance that can be produced, only heat that can be relocated, and a refrigerator is a pump for doing exactly that. A refrigerant fluid circulates in a sealed loop. Inside the cabinet it is allowed to expand and evaporate, and evaporation always absorbs heat — the same reason sweat cools your skin. The vapour is then drawn to a compressor, which squeezes it so its temperature rises above room temperature, and passes it through coils on the outside where it can shed that heat and condense back to liquid. This is why the back of a fridge is warm and why a fridge with its door open heats a closed room.",bn:"ঠান্ডা এমন কোনো পদার্থ নয় যা তৈরি করা যায়, বরং তাপকে সরানো যায় মাত্র, আর ফ্রিজ ঠিক সেই কাজেরই পাম্প। একটি শীতলকারী তরল বদ্ধ চক্রে ঘোরে। ক্যাবিনেটের ভেতরে তাকে প্রসারিত ও বাষ্পীভূত হতে দেওয়া হয়, আর বাষ্পীভবন সব সময় তাপ শোষণ করে — ঘাম যে কারণে ত্বক ঠান্ডা করে। এরপর বাষ্পটি কম্প্রেসরে টেনে নেওয়া হয়, যা তাকে এমনভাবে চাপে যে তাপমাত্রা ঘরের চেয়ে বেড়ে যায়, তারপর বাইরের কয়েল দিয়ে পাঠানো হয় যেখানে সে তাপ ছেড়ে আবার তরল হয়। এ কারণেই ফ্রিজের পেছনটা গরম থাকে এবং দরজা খুলে রাখলে বদ্ধ ঘর বরং গরম হয়।"},
pts:[{en:"An air conditioner is the same machine with the hot end outdoors",bn:"এয়ার কন্ডিশনার একই যন্ত্র, যার গরম প্রান্ত থাকে বাইরে"},{en:"Frost build-up insulates the coils and wastes electricity",bn:"বরফ জমলে কয়েল ঢাকা পড়ে ও বিদ্যুৎ অপচয় হয়"},{en:"Leaving space behind the fridge lets it shed heat properly",bn:"ফ্রিজের পেছনে ফাঁকা রাখলে তাপ ঠিকমতো বেরোতে পারে"}]},

{i:78,cat:"tech",k:"microwave oven water molecule dielectric heating মাইক্রোওয়েভ",
t:{en:"How does a microwave oven heat food?",bn:"মাইক্রোওয়েভ ওভেন খাবার গরম করে কীভাবে?"},
s:{en:"Radio waves make water molecules flip rapidly back and forth, and that molecular friction is heat.",bn:"বেতার তরঙ্গ পানির অণুকে দ্রুত এদিক-ওদিক ঘোরায়, আর সেই আণবিক ঘর্ষণই তাপ।"},
svg:S(`<rect x="40" y="46" width="180" height="106" rx="6" class="ln"/><path class="ln" d="M56 60 h120 v78 h-120 Z"/><g class="ln"><rect x="228" y="76" width="52" height="44" rx="4"/><path d="M228 98 h-10"/></g><g class="ln2"><path d="M176 76 q14 10 28 0 t28 0" /><path d="M176 98 q14 10 28 0 t28 0"/><path d="M176 120 q14 10 28 0 t28 0"/></g><g class="ln"><ellipse cx="112" cy="120" rx="34" ry="10"/><path d="M92 104 q10-14 20 0 q10-14 20 0"/><circle cx="100" cy="92" r="5"/><circle cx="124" cy="88" r="5"/><path d="M100 92 l6-8 M124 88 l-6-8"/></g>${M(112,168,1)}${M(200,168,2)}${M(254,140,3)}`),
legend:[{en:"Water molecules in food have a positive and negative end",bn:"খাবারের পানির অণুর একটি ধনাত্মক ও একটি ঋণাত্মক প্রান্ত থাকে"},{en:"The microwave field reverses billions of times per second",bn:"মাইক্রোওয়েভ ক্ষেত্র সেকেন্ডে কোটি কোটি বার দিক বদলায়"},{en:"Molecules twist to follow it, and the rubbing produces heat",bn:"অণু তা অনুসরণে মোচড় খায়, সেই ঘষাঘষিই তাপ তৈরি করে"}],
body:{en:"A water molecule is electrically lopsided, with a slightly positive side and a slightly negative side, so it lines up with any electric field like a compass needle. Microwaves are radio waves whose field reverses direction about two and a half billion times a second, and water molecules attempt to flip round each time, colliding with their neighbours. Those collisions are exactly what heat is at the molecular level. This explains the oven's quirks: dry ceramics stay cool, food heats from within rather than by browning, and uneven water content produces hot and cold spots — which is why stirring and standing time matter.",bn:"পানির অণু বৈদ্যুতিকভাবে অসম, এক দিক সামান্য ধনাত্মক ও অন্য দিক সামান্য ঋণাত্মক, তাই কম্পাসের কাঁটার মতো তা যেকোনো বৈদ্যুতিক ক্ষেত্রের সঙ্গে সারিবদ্ধ হয়। মাইক্রোওয়েভ হলো এমন বেতার তরঙ্গ যার ক্ষেত্র সেকেন্ডে প্রায় আড়াইশো কোটি বার দিক বদলায়, আর পানির অণু প্রতিবারই ঘুরে দাঁড়ানোর চেষ্টা করে ও প্রতিবেশীদের সঙ্গে ধাক্কা খায়। আণবিক স্তরে সেই ধাক্কাই তো তাপ। এতেই ওভেনের খেয়ালিপনা বোঝা যায়: শুকনো সিরামিক ঠান্ডা থাকে, খাবার বাদামি না হয়ে ভেতর থেকে গরম হয়, আর পানির পরিমাণ অসমান হলে কোথাও গরম কোথাও ঠান্ডা থেকে যায় — তাই নাড়া ও কিছুক্ষণ রেখে দেওয়া জরুরি।"},
pts:[{en:"The metal mesh in the door reflects microwaves but lets light through",bn:"দরজার ধাতব জাল মাইক্রোওয়েভ আটকায়, আলো যেতে দেয়"},{en:"Metal containers reflect the waves and can cause sparking",bn:"ধাতব পাত্র তরঙ্গ প্রতিফলিত করে ও স্ফুলিঙ্গ ঘটাতে পারে"},{en:"Microwaves do not make food radioactive; they only heat it",bn:"মাইক্রোওয়েভ খাবারকে তেজস্ক্রিয় করে না; কেবল গরম করে"}]},

{i:79,cat:"tech",k:"encryption cipher key security privacy এনক্রিপশন",
t:{en:"What is encryption?",bn:"এনক্রিপশন কী?"},
s:{en:"Scrambling a message with a mathematical key so that only someone holding the right key can read it.",bn:"গাণিতিক চাবি দিয়ে বার্তা এলোমেলো করা, যাতে কেবল সঠিক চাবিওয়ালাই তা পড়তে পারে।"},
svg:S(`<g class="ln"><rect x="24" y="76" width="60" height="40" rx="4"/><path d="M34 88 h40 M34 100 h28"/></g><g class="ln"><path d="M92 96 H124 M116 88 L126 96 L116 104"/><rect x="130" y="66" width="60" height="60" rx="5"/><circle cx="160" cy="90" r="12"/><path d="M160 102 v14 M154 112 h12"/></g><g class="ln"><path d="M198 96 H228 M220 88 L230 96 L220 104"/><rect x="236" y="76" width="60" height="40" rx="4"/><path d="M244 86 l10 8 l-10 8 M262 86 l8 10 l-8 6 M278 88 l6 6 l-6 10"/></g><path class="ln2" d="M160 140 v18 M120 158 h80"/>${M(54,140,1)}${M(160,44,2)}${M(266,140,3)}`),
legend:[{en:"The original readable message is called plaintext",bn:"মূল পাঠযোগ্য বার্তাকে বলে প্লেইনটেক্সট"},{en:"A key and an algorithm transform it systematically",bn:"চাবি ও অ্যালগরিদম তাকে নিয়মমাফিক রূপান্তরিত করে"},{en:"The result is unreadable without the matching key",bn:"মিলে যাওয়া চাবি ছাড়া ফলাফল পড়ার অযোগ্য"}],
body:{en:"Encryption turns readable data into apparent nonsense using a reversible mathematical procedure controlled by a key. Modern systems assume the method itself is public knowledge; all the security rests on the key being secret and long enough that guessing every possibility is impractical. Public-key cryptography solved the hardest practical problem — how to agree on a secret with someone you have never met — by using two mathematically linked keys, one published freely for encrypting and one kept private for decrypting. This is what makes online banking and private messaging possible over a network anyone can listen to.",bn:"এনক্রিপশন পাঠযোগ্য তথ্যকে আপাত অর্থহীন করে তোলে একটি উল্টানো-যোগ্য গাণিতিক পদ্ধতিতে, যা নিয়ন্ত্রণ করে একটি চাবি। আধুনিক ব্যবস্থায় ধরে নেওয়া হয় পদ্ধতিটি সবার জানা; পুরো নিরাপত্তা নির্ভর করে চাবিটি গোপন থাকা ও এত লম্বা হওয়ার উপর যে সব সম্ভাবনা অনুমান করা অবাস্তব। পাবলিক-কি ক্রিপ্টোগ্রাফি সবচেয়ে কঠিন ব্যবহারিক সমস্যার সমাধান করেছে — কখনো দেখা হয়নি এমন কারও সঙ্গে গোপন বিষয়ে একমত হওয়া কীভাবে সম্ভব — দুটি গাণিতিকভাবে যুক্ত চাবি ব্যবহার করে, একটি এনক্রিপ্ট করার জন্য অবাধে প্রকাশিত, অন্যটি ডিক্রিপ্ট করার জন্য গোপন। এ কারণেই যে নেটওয়ার্কে যে কেউ আড়ি পাততে পারে, সেখানেও অনলাইন ব্যাংকিং ও গোপন বার্তা সম্ভব।"},
pts:[{en:"End-to-end encryption means even the service provider cannot read it",bn:"এন্ড-টু-এন্ড এনক্রিপশনে সেবাদাতাও বার্তা পড়তে পারে না"},{en:"The padlock icon shows the connection is encrypted, not that a site is honest",bn:"তালা চিহ্ন দেখায় সংযোগ এনক্রিপ্টেড, সাইটটি সৎ তা নয়"},{en:"A weak password undermines even the strongest encryption",bn:"দুর্বল পাসওয়ার্ড সবচেয়ে শক্ত এনক্রিপশনকেও অকেজো করে"}]},

{i:80,cat:"tech",k:"touchscreen capacitive sensor display grid টাচস্ক্রিন",
t:{en:"How does a touchscreen know where you touched?",bn:"টাচস্ক্রিন জানে কীভাবে আপনি কোথায় ছুঁয়েছেন?"},
s:{en:"A transparent grid holds a tiny electrical charge, and your finger changes it at exactly one crossing point.",bn:"স্বচ্ছ একটি জাল সামান্য বৈদ্যুতিক আধান ধরে রাখে, আর আপনার আঙুল ঠিক একটি ছেদবিন্দুতে তা বদলে দেয়।"},
svg:S(`<rect x="60" y="30" width="200" height="130" rx="8" class="ln"/><g class="ln2">${[0,1,2,3,4,5].map(n=>`<line x1="${76+n*32}" y1="42" x2="${76+n*32}" y2="148"/>`).join("")}${[0,1,2,3].map(n=>`<line x1="72" y1="${56+n*30}" x2="248" y2="${56+n*30}"/>`).join("")}</g><circle cx="172" cy="86" r="14" class="ln"/><path class="fl2" d="M172 72 a14 14 0 1 0 0 28 a14 14 0 1 0 0-28"/><g class="ln"><path d="M186 74 q26-26 44-14 q-16 4-30 24"/><path d="M216 60 q14-6 20 2"/></g>${M(76,170,1)}${M(172,86,2)}${M(280,60,3)}`),
legend:[{en:"Fine transparent conductors form a grid over the display",bn:"পর্দার উপরে সূক্ষ্ম স্বচ্ছ পরিবাহী জাল তৈরি করে"},{en:"Your finger draws away a little charge at one crossing",bn:"আপনার আঙুল একটি ছেদবিন্দু থেকে সামান্য আধান টেনে নেয়"},{en:"Electronics read which row and column changed",bn:"ইলেকট্রনিক্স পড়ে নেয় কোন সারি ও স্তম্ভ বদলেছে"}],
body:{en:"Most modern screens are capacitive. A mesh of almost invisible conducting lines is laid over the display, holding a small stored charge at every intersection. The human body conducts electricity, so bringing a fingertip close changes the charge at nearby crossings. The controller scans the whole grid many times a second, finds where the reading shifted, and reports the coordinates. Because it senses conductivity rather than pressure, an ordinary glove or a pencil tip does nothing, and multiple fingers can be tracked independently — which is what makes pinching and zooming possible.",bn:"আধুনিক বেশিরভাগ পর্দা ক্যাপাসিটিভ। পর্দার উপরে প্রায় অদৃশ্য পরিবাহী রেখার জাল বিছানো থাকে, প্রতিটি ছেদবিন্দুতে সামান্য আধান জমা থাকে। মানবদেহ বিদ্যুৎ পরিবহন করে, তাই আঙুলের ডগা কাছে আনলে আশপাশের ছেদবিন্দুর আধান বদলে যায়। নিয়ন্ত্রক সেকেন্ডে বহুবার পুরো জাল স্ক্যান করে, কোথায় পাঠ বদলেছে তা খুঁজে বের করে ও স্থানাঙ্ক জানায়। চাপ নয়, পরিবাহিতা বোঝে বলেই সাধারণ দস্তানা বা পেন্সিলের ডগায় কিছু হয় না, আর একাধিক আঙুল আলাদাভাবে অনুসরণ করা যায় — এ কারণেই চিমটি কেটে ছোট-বড় করা সম্ভব।"},
pts:[{en:"Water drops confuse the sensor because water also conducts",bn:"পানির ফোঁটা সেন্সরকে বিভ্রান্ত করে, কারণ পানিও পরিবাহী"},{en:"Touchscreen gloves have conductive thread in the fingertips",bn:"টাচস্ক্রিন দস্তানার আঙুলে পরিবাহী সুতা থাকে"},{en:"Older resistive screens worked by physical pressure instead",bn:"পুরনো রেজিস্টিভ পর্দা বরং সরাসরি চাপে কাজ করত"}]},

{i:81,cat:"tech",k:"cloud storage server data centre backup ক্লাউড স্টোরেজ",
t:{en:"What is cloud storage?",bn:"ক্লাউড স্টোরেজ কী?"},
s:{en:"Your files are kept on someone else's computers in a data centre and delivered to you over the internet on request.",bn:"আপনার ফাইল রাখা হয় ডেটা সেন্টারে অন্য কারও কম্পিউটারে, আর চাইলেই ইন্টারনেটে আপনার কাছে পাঠানো হয়।"},
svg:S(`<g class="ln"><path d="M96 76 a24 24 0 0 1 26-22 a32 32 0 0 1 60 8 a22 22 0 0 1 2 40 H114 a22 22 0 0 1-18-26 Z"/></g><path class="fl" d="M96 76 a24 24 0 0 1 26-22 a32 32 0 0 1 60 8 a22 22 0 0 1 2 40 H114 a22 22 0 0 1-18-26 Z"/><g class="ln"><rect x="228" y="46" width="30" height="60" rx="3"/><rect x="266" y="46" width="30" height="60" rx="3"/><path d="M234 58 h18 M234 70 h18 M272 58 h18 M272 70 h18"/></g><g class="ln"><rect x="30" y="130" width="46" height="32" rx="3"/><rect x="110" y="134" width="24" height="34" rx="3"/><rect x="168" y="132" width="40" height="30" rx="3"/></g><g class="ln2"><path d="M53 130 q20-30 50-38 M122 134 q10-24 20-30 M188 132 q10-24 4-30 M204 76 q20-14 24-14"/></g>${M(140,60,1)}${M(262,126,2)}${M(53,180,3)}`),
legend:[{en:"Files are uploaded over your internet connection",bn:"আপনার ইন্টারনেট সংযোগ দিয়ে ফাইল আপলোড হয়"},{en:"They are stored on servers in large data centres",bn:"বড় ডেটা সেন্টারের সার্ভারে সেগুলো জমা থাকে"},{en:"Any of your devices can fetch the same copy",bn:"আপনার যেকোনো যন্ত্র একই কপি নামিয়ে নিতে পারে"}],
body:{en:"There is nothing cloudlike about it — the phrase just means that you no longer know or care which physical machine holds your data. Providers run warehouses of servers with redundant power, cooling and network links, and your file is typically written to several separate machines, often in different buildings, so that a failure loses nothing. The benefits are access from anywhere, automatic backup and easy sharing. The trade-offs are real too: you need connectivity, you are trusting someone else's security and business continuity, and terms of service govern what happens to your data.",bn:"এতে মেঘের মতো কিছুই নেই — কথাটির অর্থ কেবল এই যে আপনার তথ্য কোন ভৌত যন্ত্রে আছে তা আপনি আর জানেন না বা জানার দরকার নেই। সেবাদাতারা সার্ভারের বিশাল গুদাম চালায়, যেখানে বিদ্যুৎ, শীতলীকরণ ও নেটওয়ার্ক সংযোগের বিকল্প ব্যবস্থা থাকে, আর আপনার ফাইল সাধারণত একাধিক আলাদা যন্ত্রে, প্রায়ই ভিন্ন ভবনে লেখা হয়, যাতে একটি বিকল হলেও কিছু হারায় না। সুবিধা হলো যেকোনো জায়গা থেকে ব্যবহার, স্বয়ংক্রিয় ব্যাকআপ ও সহজে ভাগ করা। আপসগুলোও বাস্তব: সংযোগ লাগবে, অন্যের নিরাপত্তা ও ব্যবসায়িক ধারাবাহিকতায় ভরসা করতে হবে, আর আপনার তথ্যের কী হবে তা ঠিক করে সেবার শর্তাবলি।"},
pts:[{en:"Syncing is not the same as backup — a deletion can sync everywhere",bn:"সিঙ্ক আর ব্যাকআপ এক নয় — মুছে ফেলাও সব জায়গায় সিঙ্ক হতে পারে"},{en:"Keep one important copy offline as well",bn:"গুরুত্বপূর্ণ একটি কপি অফলাইনেও রাখুন"},{en:"Data centres consume large amounts of electricity and water",bn:"ডেটা সেন্টার বিপুল বিদ্যুৎ ও পানি খরচ করে"}]},

{i:82,cat:"tech",k:"search engine index crawler ranking algorithm সার্চ ইঞ্জিন",
t:{en:"How does a search engine work?",bn:"সার্চ ইঞ্জিন কীভাবে কাজ করে?"},
s:{en:"It reads the web in advance, builds an index of which words appear where, and ranks matching pages when you ask.",bn:"এটি আগেভাগে ওয়েব পড়ে রাখে, কোন শব্দ কোথায় আছে তার সূচি বানায়, আর আপনি চাইলে মিলে যাওয়া পাতাগুলো ক্রম অনুযায়ী সাজায়।"},
svg:S(`<g class="ln"><circle cx="60" cy="60" r="18"/><path d="M60 78 v14 M46 96 h28"/><path d="M78 60 h30 M100 54 L110 60 L100 66"/></g><g class="ln"><rect x="118" y="36" width="80" height="52" rx="4"/>${[0,1,2,3].map(n=>`<line x1="128" y1="${48+n*10}" x2="188" y2="${48+n*10}"/>`).join("")}</g><g class="ln"><path d="M206 62 h26 M224 56 L234 62 L224 68"/><rect x="240" y="40" width="60" height="44" rx="4"/><path d="M250 52 h40 M250 62 h30 M250 72 h36"/></g><g class="ln"><rect x="90" y="120" width="140" height="18" rx="9"/><path d="M104 129 h60"/><circle cx="212" cy="129" r="6"/><path d="M216 133 l6 6"/></g><g class="ln"><rect x="90" y="150" width="140" height="8"/><rect x="90" y="166" width="110" height="8"/></g>${M(60,110,1)}${M(158,110,2)}${M(270,110,3)}`),
legend:[{en:"Crawler programs follow links and fetch pages continuously",bn:"ক্রলার প্রোগ্রাম লিংক ধরে অবিরাম পাতা সংগ্রহ করে"},{en:"An index records which pages contain which words",bn:"সূচি লিখে রাখে কোন পাতায় কোন শব্দ আছে"},{en:"Ranking decides the order of the results you see",bn:"র‍্যাংকিং ঠিক করে আপনি ফলাফল কোন ক্রমে দেখবেন"}],
body:{en:"Searching does not happen across the live web — that would be far too slow. Automated crawlers visit pages continuously, following links, and store what they find in a giant reverse index that maps every word to the pages containing it. When you type a query the engine consults this index, which is why results appear instantly. The genuinely difficult part is ranking: deciding which of millions of matching pages to show first, using signals such as how many other sites link to a page, how well the content matches the intent behind your words, freshness, and your language and location.",bn:"অনুসন্ধান আসলে সরাসরি চলমান ওয়েবে হয় না — তা হলে ভীষণ ধীর হতো। স্বয়ংক্রিয় ক্রলার লিংক ধরে অবিরাম পাতা ঘুরে দেখে এবং যা পায় তা বিশাল একটি উল্টো সূচিতে জমা করে, যা প্রতিটি শব্দকে তার ধারণকারী পাতাগুলোর সঙ্গে মেলায়। আপনি প্রশ্ন লিখলে ইঞ্জিন এই সূচি দেখে, তাই ফল সঙ্গে সঙ্গে আসে। সত্যিকারের কঠিন অংশ হলো র‍্যাংকিং: লক্ষ লক্ষ মিলে যাওয়া পাতার কোনটি আগে দেখানো হবে তা ঠিক করা, এতে কাজে লাগে কতগুলো সাইট সেই পাতায় লিংক দিয়েছে, আপনার শব্দের পেছনের উদ্দেশ্যের সঙ্গে বিষয়বস্তু কতটা মেলে, কতটা নতুন, এবং আপনার ভাষা ও অবস্থান।"},
pts:[{en:"Quotation marks force an exact phrase match",bn:"উদ্ধৃতি চিহ্ন দিলে হুবহু বাক্যাংশ খোঁজা হয়"},{en:"Adding site: restricts results to one website",bn:"site: যোগ করলে ফল একটি ওয়েবসাইটেই সীমিত হয়"},{en:"High ranking indicates popularity signals, not verified truth",bn:"উপরে থাকা মানে জনপ্রিয়তার ইঙ্গিত, যাচাই করা সত্য নয়"}]},

{i:83,cat:"eng",k:"engine combustion piston cylinder four stroke ইঞ্জিন",
t:{en:"How does an engine work?",bn:"ইঞ্জিন কীভাবে কাজ করে?"},
s:{en:"Fuel burns inside a sealed cylinder, the expanding gas shoves a piston down, and a crankshaft turns that push into rotation.",bn:"বদ্ধ সিলিন্ডারে জ্বালানি পোড়ে, প্রসারিত গ্যাস পিস্টনকে নিচে ঠেলে, আর ক্র্যাংকশ্যাফট সেই ঠেলাকে ঘূর্ণনে বদলায়।"},
svg:S(`<g class="ln">${[0,1,2,3].map(n=>`<rect x="${20+n*76}" y="30" width="56" height="80"/>`).join("")}</g><g class="ln">${[0,1,2,3].map(n=>{const y=[46,86,60,74][n];return `<rect x="${26+n*76}" y="${y}" width="44" height="18"/><path d="M${48+n*76} ${y+18} V128"/>`}).join("")}</g><g class="fl2"><rect x="26" y="34" width="44" height="12"/><rect x="178" y="34" width="44" height="26"/></g><path class="ln" d="M20 140 q38 20 76 0 q38-20 76 0 q38 20 76 0 q20-10 30-4"/><g class="ln"><circle cx="292" cy="150" r="16"/><path d="M292 134 v32 M276 150 h32"/></g>${M(48,20,1)}${M(200,20,2)}${M(292,180,3)}`),
legend:[{en:"Intake and compression: fuel-air mixture is drawn in and squeezed",bn:"গ্রহণ ও সংনমন: জ্বালানি-বাতাসের মিশ্রণ টেনে নিয়ে চাপা হয়"},{en:"Power: ignition drives the piston down hard",bn:"শক্তি: জ্বলন পিস্টনকে জোরে নিচে ঠেলে"},{en:"The crankshaft converts up-and-down motion into turning",bn:"ক্র্যাংকশ্যাফট ওঠানামাকে ঘূর্ণনে রূপ দেয়"}],
body:{en:"A four-stroke petrol engine repeats the same cycle in every cylinder. First the piston drops and draws in air mixed with fuel; then it rises and compresses that mixture into a small hot space; a spark ignites it and the sudden expansion forces the piston down with great force; finally the piston rises again and pushes the exhaust out. The connecting rod and crankshaft convert this straight-line hammering into smooth rotation, and multiple cylinders fire in sequence so that some are always producing power. A diesel engine skips the spark plug, compressing air so hard that injected fuel ignites on contact.",bn:"চার-স্ট্রোক পেট্রোল ইঞ্জিন প্রতিটি সিলিন্ডারে একই চক্রের পুনরাবৃত্তি করে। প্রথমে পিস্টন নামে ও জ্বালানিমিশ্রিত বাতাস টেনে নেয়; তারপর উঠে সেই মিশ্রণকে ছোট উত্তপ্ত জায়গায় চেপে ধরে; স্ফুলিঙ্গ তাতে আগুন ধরায় আর আকস্মিক প্রসারণ প্রচণ্ড বলে পিস্টনকে নিচে ঠেলে; শেষে পিস্টন আবার উঠে নিষ্কাশন গ্যাস বের করে দেয়। কানেক্টিং রড ও ক্র্যাংকশ্যাফট এই সরলরৈখিক আঘাতকে মসৃণ ঘূর্ণনে বদলায়, আর একাধিক সিলিন্ডার পালা করে জ্বলে যাতে কোনো না কোনোটি সব সময় শক্তি দেয়। ডিজেল ইঞ্জিনে স্পার্ক প্লাগ লাগে না, বাতাসকে এত জোরে চাপা হয় যে ঢালা জ্বালানি ছোঁয়ামাত্র জ্বলে ওঠে।"},
pts:[{en:"Most of the fuel's energy leaves as heat, not useful work",bn:"জ্বালানির বেশিরভাগ শক্তি কাজে না লেগে তাপ হয়ে বেরিয়ে যায়"},{en:"Gears let one engine speed suit many road speeds",bn:"গিয়ার একই ইঞ্জিন গতিকে নানা রাস্তার গতির উপযোগী করে"},{en:"Electric motors turn directly, so they need no such cycle",bn:"বৈদ্যুতিক মোটর সরাসরি ঘোরে, তাই এমন চক্র লাগে না"}]},

{i:84,cat:"eng",k:"airplane flight lift wing aerofoil thrust উড়োজাহাজ",
t:{en:"How do airplanes fly?",bn:"উড়োজাহাজ ওড়ে কীভাবে?"},
s:{en:"Wings deflect air downward as they move forward, and the reaction pushes the aircraft up.",bn:"ডানা সামনে এগোনোর সময় বাতাসকে নিচে ঠেলে দেয়, আর প্রতিক্রিয়ায় উড়োজাহাজ উপরে ওঠে।"},

legend:[{en:"Lift acts upward, balancing the aircraft's weight",bn:"উত্তোলন বল উপরে কাজ করে, ওজনকে সামলায়"},{en:"Air leaves the wing angled downward",bn:"ডানা ছেড়ে বাতাস নিচের দিকে বেঁকে বেরোয়"},{en:"Engines supply thrust to keep air flowing over the wing",bn:"ইঞ্জিন ঠেলা দেয় যাতে ডানার উপর দিয়ে বাতাস বইতে থাকে"}],
body:{en:"The clearest way to understand lift is Newton's third law. A wing is shaped and angled so that the air flowing over and under it is turned downward as it leaves the trailing edge. Pushing that mass of air down means the air pushes the wing up with equal force. The curved upper surface also produces lower pressure above the wing, and both descriptions are valid ways of accounting for the same physics. Lift therefore depends on speed, wing area and angle — which is why aircraft need a long runway to build speed and extend flaps to increase area and curvature when landing slowly.",bn:"উত্তোলন বোঝার সবচেয়ে স্পষ্ট উপায় নিউটনের তৃতীয় সূত্র। ডানার আকৃতি ও কোণ এমন যে তার উপর ও নিচ দিয়ে বওয়া বাতাস পেছনের প্রান্ত ছাড়ার সময় নিচের দিকে বেঁকে যায়। সেই বাতাসের ভরকে নিচে ঠেলা মানে বাতাসও সমান বলে ডানাকে উপরে ঠেলে। বাঁকানো উপরের তলে চাপ কমও হয়, আর একই পদার্থবিদ্যার হিসাব দিতে দুই বর্ণনাই বৈধ। তাই উত্তোলন নির্ভর করে গতি, ডানার ক্ষেত্রফল ও কোণের উপর — এ কারণেই গতি তুলতে উড়োজাহাজের লম্বা রানওয়ে লাগে এবং ধীরে অবতরণের সময় ক্ষেত্রফল ও বক্রতা বাড়াতে ফ্ল্যাপ নামানো হয়।"},
pts:[{en:"If the angle gets too steep the airflow separates and lift collapses",bn:"কোণ খুব খাড়া হলে বায়ুপ্রবাহ আলাদা হয়ে যায় ও উত্তোলন ভেঙে পড়ে"},{en:"Thinner air at altitude is why cruising is efficient there",bn:"উঁচুতে বাতাস পাতলা বলেই সেখানে ওড়া সাশ্রয়ী"},{en:"Helicopters use the same principle with rotating wings",bn:"হেলিকপ্টার ঘূর্ণায়মান ডানায় একই নীতি ব্যবহার করে"}]},

{i:85,cat:"eng",k:"pyramid ramp lever quarry ancient construction পিরামিড",
t:{en:"How were the pyramids built?",bn:"পিরামিড কীভাবে নির্মিত হয়েছিল?"},
s:{en:"By an enormous organised workforce using ramps, sledges, levers and water-lubricated sand — no lost technology required.",bn:"বিপুল সুসংগঠিত শ্রমশক্তি ঢাল, স্লেজ, লিভার ও পানি দেওয়া বালু ব্যবহার করে — কোনো হারানো প্রযুক্তির দরকার হয়নি।"},
svg:S(`<path class="ln" d="M60 150 L160 46 L260 150 Z"/><path class="fl" d="M60 150 L160 46 L260 150 Z"/><g class="ln2">${[0,1,2,3,4].map(n=>`<line x1="${60+n*20}" y1="${150-n*21}" x2="${260-n*20}" y2="${150-n*21}"/>`).join("")}</g><path class="ln" d="M260 150 L300 150 L200 60 L186 74"/><g class="ln"><rect x="206" y="76" width="22" height="14" transform="rotate(-42 217 83)"/><path d="M224 96 q14 8 20 2"/></g><g class="ln"><path d="M20 160 h34 M46 154 L56 160 L46 166"/><rect x="24" y="140" width="20" height="14"/></g>${M(160,170,1)}${M(276,110,2)}${M(36,124,3)}`),
legend:[{en:"Stone was quarried nearby and floated in by river",bn:"পাথর কাছেই কাটা হতো ও নদীপথে ভাসিয়ে আনা হতো"},{en:"Ramps let sledges be hauled steadily upward",bn:"ঢাল বেয়ে স্লেজ ধীরে ধীরে উপরে টানা হতো"},{en:"Wetting the sand ahead of a sledge halves the pulling force",bn:"স্লেজের সামনের বালু ভেজালে টানার বল প্রায় অর্ধেক হয়"}],
body:{en:"There is no mystery requiring exotic explanations. Quarry marks, abandoned blocks, workers' villages, bakeries, medical facilities and administrative records have all been excavated, showing a large, well-fed, organised labour force rather than the popular image of slaves. Limestone was cut nearby with copper tools and stone hammers, floated on the Nile during flood season, and dragged on wooden sledges up ramps. A tomb painting shows a worker pouring water in front of a sledge, and experiments confirm that damp sand roughly halves the friction. Precision came from careful surveying with plumb lines, water levels and sightings on stars.",bn:"এখানে এমন কোনো রহস্য নেই যার জন্য অদ্ভুত ব্যাখ্যা লাগে। খনির চিহ্ন, ফেলে রাখা পাথরখণ্ড, শ্রমিকদের গ্রাম, রুটির কারখানা, চিকিৎসাকেন্দ্র ও প্রশাসনিক নথি সবই খনন করে পাওয়া গেছে, যা দেখায় প্রচলিত দাসদের ছবির বদলে ছিল বড়, সুপুষ্ট ও সুসংগঠিত শ্রমশক্তি। চুনাপাথর কাছেই তামার যন্ত্র ও পাথরের হাতুড়ি দিয়ে কাটা হতো, বন্যার মৌসুমে নীল নদে ভাসিয়ে আনা হতো, আর কাঠের স্লেজে করে ঢাল বেয়ে টানা হতো। একটি সমাধিচিত্রে দেখা যায় এক শ্রমিক স্লেজের সামনে পানি ঢালছেন, আর পরীক্ষায় নিশ্চিত হয়েছে ভেজা বালু ঘর্ষণ প্রায় অর্ধেক কমায়। নিখুঁততা এসেছে ওলন সুতা, পানির সমতল ও নক্ষত্র দেখে যত্নসহকারে জরিপ করা থেকে।"},
pts:[{en:"The Great Pyramid contains over two million stone blocks",bn:"গ্রেট পিরামিডে বিশ লক্ষেরও বেশি পাথরখণ্ড আছে"},{en:"Its sides align with true north to a fraction of a degree",bn:"এর বাহুগুলো প্রকৃত উত্তরের সঙ্গে ডিগ্রির ভগ্নাংশ নির্ভুলতায় মেলে"},{en:"Construction likely spanned about two decades per pyramid",bn:"প্রতিটি পিরামিড বানাতে সম্ভবত প্রায় দুই দশক লেগেছিল"}]},
