s:{en:"The rulebook for the very small, where energy comes in fixed lumps and outcomes are probabilities rather than certainties.",bn:"অতি ক্ষুদ্রের নিয়মপুস্তক, যেখানে শক্তি নির্দিষ্ট গুচ্ছে আসে আর ফলাফল নিশ্চয়তা নয়, সম্ভাবনা।"},
svg:S(`<g class="ln"><path d="M40 130 V60 M40 130 H150"/><g stroke-dasharray="4 4"><path d="M40 112 H150 M40 94 H150 M40 76 H150"/></g><circle cx="70" cy="112" r="5" fill="currentColor"/><circle cx="104" cy="94" r="5" fill="currentColor"/><circle cx="132" cy="76" r="5" fill="currentColor"/></g><g class="ln"><path d="M186 130 q22-70 44 0" /><path d="M186 130 q44-96 88 0"/><path d="M186 130 H290"/></g><path class="fl2" d="M186 130 q44-96 88 0 Z"/><g class="ln"><path d="M232 44 q-10 8-4 16 M232 44 q10 8 4 16"/></g>${M(28,52,1)}${M(232,34,2)}${M(300,130,3)}`),
legend:[{en:"Energy only exists in fixed steps, never in between",bn:"শক্তি কেবল নির্দিষ্ট ধাপে থাকে, মাঝামাঝি কখনো নয়"},{en:"A particle has no single position until it is measured",bn:"মাপার আগে কণার কোনো একক অবস্থান থাকে না"},{en:"We can only predict the probability of each result",bn:"আমরা কেবল প্রতিটি ফলাফলের সম্ভাবনা বলতে পারি"}],
body:{en:"At everyday scale, things have definite positions and energies can take any value. At the scale of atoms neither is true. Energy comes in indivisible packets called quanta, which is why an electron can occupy one orbit or the next but nothing in between, and why a hot object glows at particular colours. Stranger still, before measurement a particle behaves as a spread of possibilities described by a wave — send electrons one at a time through two slits and they still build an interference pattern, as if each passed through both. Quantum theory does not tell you what a single electron will do; it tells you the odds, and those odds have been confirmed to extraordinary precision.",bn:"দৈনন্দিন মাপে বস্তুর নির্দিষ্ট অবস্থান থাকে আর শক্তি যেকোনো মান নিতে পারে। পরমাণুর মাপে দুটোর কোনোটিই সত্য নয়। শক্তি আসে অবিভাজ্য প্যাকেটে, যাকে বলে কোয়ান্টাম; তাই ইলেকট্রন এক কক্ষপথে বা পরেরটিতে থাকতে পারে, মাঝামাঝি কোথাও নয়, আর তাই উত্তপ্ত বস্তু নির্দিষ্ট রঙে জ্বলে। আরও অদ্ভুত, মাপার আগে কণা একটি তরঙ্গে বর্ণিত সম্ভাবনার বিস্তার হিসেবে আচরণ করে — একটি একটি করে ইলেকট্রন দুই চিরের ভেতর দিয়ে পাঠালেও তারা ব্যতিচার নকশা গড়ে, যেন প্রত্যেকেই দুই পথেই গেছে। কোয়ান্টাম তত্ত্ব একটি ইলেকট্রন কী করবে তা বলে না; বলে সম্ভাবনা, আর সেই সম্ভাবনা অসাধারণ নির্ভুলতায় যাচাই হয়েছে।"},
pts:[{en:"Transistors, lasers and MRI scanners all rely on quantum behaviour",bn:"ট্রানজিস্টর, লেজার ও এমআরআই—সবই কোয়ান্টাম আচরণের উপর দাঁড়িয়ে"},{en:"Uncertainty is a property of nature, not a limit of our instruments",bn:"অনিশ্চয়তা প্রকৃতিরই ধর্ম, যন্ত্রের সীমাবদ্ধতা নয়"},{en:"Quantum effects vanish at large scale, which is why daily life looks normal",bn:"বড় মাপে কোয়ান্টাম প্রভাব মিলিয়ে যায়, তাই দৈনন্দিন জীবন স্বাভাবিক দেখায়"}]},

{i:18,cat:"physics",k:"gravity mass weight newton einstein orbit মাধ্যাকর্ষণ",
t:{en:"What is gravity?",bn:"মাধ্যাকর্ষণ কী?"},
s:{en:"Every object with mass attracts every other; the more mass and the less distance, the stronger the pull.",bn:"ভরযুক্ত প্রতিটি বস্তু অন্য বস্তুকে টানে; ভর যত বেশি ও দূরত্ব যত কম, টান তত জোরালো।"},
svg:S(`<circle cx="96" cy="112" r="40" class="ln"/><path class="fl" d="M96 72 a40 40 0 1 0 0 80 a40 40 0 1 0 0-80"/><g class="ln"><path d="M96 40 V64 M88 56 L96 64 L104 56"/><path d="M44 112 H68 M60 104 L68 112 L60 120"/><path d="M148 112 H124 M132 104 L124 112 L132 120"/><path d="M96 184 V160 M88 168 L96 160 L104 168"/></g><g class="ln" stroke-dasharray="4 4"><ellipse cx="220" cy="106" rx="66" ry="30"/></g><circle cx="220" cy="106" r="16" class="ln"/><circle cx="286" cy="106" r="6" class="ln" fill="currentColor"/><path class="ln" d="M286 96 q10-14 0-24"/>${M(96,112,1)}${M(160,58,2)}${M(240,150,3)}`),
legend:[{en:"Mass pulls in every direction toward its centre",bn:"ভর সব দিক থেকে নিজের কেন্দ্রের দিকে টানে"},{en:"Doubling the distance makes the pull four times weaker",bn:"দূরত্ব দ্বিগুণ হলে টান চার গুণ দুর্বল হয়"},{en:"An orbit is falling forward fast enough to keep missing",bn:"কক্ষপথ মানে এত দ্রুত সামনে পড়া যে বারবার ফসকে যাওয়া"}],
body:{en:"Newton's insight was that the force pulling an apple down and the force holding the moon in its path are the same thing. His law says the attraction grows with the product of the two masses and falls with the square of the distance between them. Einstein later offered a deeper picture: mass bends the fabric of space and time, and what we call gravitational pull is objects following the straightest available path through that curved geometry. Both descriptions predict almost identical results in ordinary conditions; Einstein's is needed for extreme cases, and satellite navigation must correct for it to stay accurate.",bn:"নিউটনের অন্তর্দৃষ্টি ছিল, আপেলকে নিচে টানা বল আর চাঁদকে কক্ষপথে ধরে রাখা বল একই জিনিস। তাঁর সূত্র বলে, আকর্ষণ দুই ভরের গুণফলের সঙ্গে বাড়ে আর দূরত্বের বর্গের সঙ্গে কমে। পরে আইনস্টাইন আরও গভীর ছবি দিলেন: ভর স্থান ও কালের বুননকে বাঁকিয়ে দেয়, আর যাকে আমরা মাধ্যাকর্ষণ টান বলি তা আসলে সেই বাঁকা জ্যামিতিতে বস্তুর সবচেয়ে সরল পথ ধরে চলা। সাধারণ অবস্থায় দুই বর্ণনাই প্রায় একই ফল দেয়; চরম ক্ষেত্রে আইনস্টাইনেরটি লাগে, আর স্যাটেলাইট নেভিগেশনকে নির্ভুল থাকতে সেই সংশোধন করতেই হয়।"},
pts:[{en:"Mass is how much matter you contain; weight is gravity's pull on it",bn:"ভর হলো বস্তুর পরিমাণ; ওজন হলো তার উপর মাধ্যাকর্ষণের টান"},{en:"Astronauts float because they are falling around the earth, not because gravity is absent",bn:"নভোচারীরা ভাসেন কারণ তাঁরা পৃথিবীকে ঘিরে পড়ছেন, মাধ্যাকর্ষণ নেই বলে নয়"},{en:"Gravity is by far the weakest of the four fundamental forces",bn:"চারটি মৌলিক বলের মধ্যে মাধ্যাকর্ষণই সবচেয়ে দুর্বল"}]},

{i:19,cat:"physics",k:"electricity current voltage circuit electron বিদ্যুৎ",
t:{en:"What is electricity?",bn:"বিদ্যুৎ কী?"},
s:{en:"The organised flow of electrons through a conductor, pushed along by a difference in electrical pressure.",bn:"পরিবাহীর ভেতর দিয়ে ইলেকট্রনের সুশৃঙ্খল প্রবাহ, যাকে ঠেলে দেয় বৈদ্যুতিক চাপের পার্থক্য।"},
svg:S(`<rect x="30" y="80" width="34" height="48" class="ln"/><path class="ln" d="M38 80 V70 M56 80 V64"/><path class="ln" d="M56 64 H200 M38 70 V150 H200"/><g class="ln"><circle cx="212" cy="106" r="20"/><path d="M204 98 L220 114 M220 98 L204 114"/></g><path class="ln" d="M224 64 H232 V150 H224"/><path class="ln" d="M200 64 H224 M200 150 H224"/><g class="ln"><circle cx="100" cy="64" r="4" fill="currentColor"/><circle cx="140" cy="64" r="4" fill="currentColor"/><circle cx="180" cy="64" r="4" fill="currentColor"/><path d="M112 56 H128 M124 52 L128 56 L124 60"/></g><g class="ln"><path d="M266 92 L276 82 M270 106 L284 106 M266 120 L276 130"/></g>${M(46,152,1)}${M(140,42,2)}${M(212,144,3)}`),
legend:[{en:"A battery or generator creates a voltage difference",bn:"ব্যাটারি বা জেনারেটর ভোল্টেজের পার্থক্য তৈরি করে"},{en:"Electrons drift through the wire, making a current",bn:"ইলেকট্রন তারের ভেতর দিয়ে সরে গিয়ে তড়িৎপ্রবাহ তৈরি করে"},{en:"The device converts that flow into light, heat or motion",bn:"যন্ত্র সেই প্রবাহকে আলো, তাপ বা গতিতে রূপ দেয়"}],
body:{en:"Metals contain electrons that are only loosely attached to their atoms, free to wander. Normally that wandering is random and nothing useful happens. Connect a battery and you create an electrical pressure difference — voltage — that nudges all those loose electrons to drift in the same direction, and that organised drift is current. A helpful comparison is a water pipe: voltage is the pressure, current is the flow rate, and resistance is the narrowness of the pipe. The three are tied together by Ohm's law, and the energy delivered per second is simply voltage multiplied by current.",bn:"ধাতুতে এমন ইলেকট্রন থাকে যারা পরমাণুর সঙ্গে আলগাভাবে যুক্ত, ঘুরে বেড়াতে স্বাধীন। সাধারণত সেই ঘোরাফেরা এলোমেলো, কাজের কিছু হয় না। ব্যাটারি লাগালে তৈরি হয় বৈদ্যুতিক চাপের পার্থক্য — ভোল্টেজ — যা সব আলগা ইলেকট্রনকে একই দিকে সরায়, আর সেই সুশৃঙ্খল সরণই তড়িৎপ্রবাহ। সহজ তুলনা পানির পাইপ: ভোল্টেজ হলো চাপ, প্রবাহমাত্রা হলো কারেন্ট, আর রোধ হলো পাইপের সরুতা। ওহমের সূত্র তিনটিকে বেঁধে রাখে, আর প্রতি সেকেন্ডে সরবরাহ করা শক্তি কেবল ভোল্টেজ গুণ কারেন্ট।"},
pts:[{en:"Electrons themselves drift slowly; the electrical signal moves near light speed",bn:"ইলেকট্রন ধীরে সরে; বৈদ্যুতিক সংকেত ছোটে প্রায় আলোর গতিতে"},{en:"It is current, not voltage, that injures the body",bn:"শরীরের ক্ষতি করে কারেন্ট, ভোল্টেজ নয়"},{en:"Alternating current is used for transmission because it is easy to change voltage",bn:"সঞ্চালনে পরিবর্তী প্রবাহ ব্যবহৃত হয়, কারণ এর ভোল্টেজ সহজে বদলানো যায়"}]},

{i:20,cat:"physics",k:"magnet magnetic field pole compass electromagnet চুম্বক",
t:{en:"How do magnets work?",bn:"চুম্বক কীভাবে কাজ করে?"},
s:{en:"Spinning electrons act as tiny magnets, and when enough of them line up the whole object becomes magnetic.",bn:"ঘূর্ণায়মান ইলেকট্রন ক্ষুদ্র চুম্বকের মতো আচরণ করে, আর যথেষ্ট সংখ্যক একমুখী হলে গোটা বস্তুটাই চুম্বক হয়।"},
svg:S(`<rect x="106" y="86" width="108" height="30" class="ln"/><path class="ln" d="M160 86 V116"/><text x="132" y="106" class="lbl">N</text><text x="186" y="106" class="lbl">S</text><g class="ln2"><path d="M106 86 q-40-46 54-46 q94 0 54 46"/><path d="M106 116 q-40 46 54 46 q94 0 54-46"/><path d="M106 92 q-24-30 54-30 q78 0 54 30"/><path d="M106 110 q-24 30 54 30 q78 0 54-30"/></g><g class="ln"><rect x="40" y="140" width="14" height="14"/><rect x="58" y="146" width="12" height="12"/><rect x="264" y="142" width="14" height="14"/></g>${M(160,66,1)}${M(60,120,2)}${M(272,110,3)}`),
legend:[{en:"Field lines run out of the north pole and into the south",bn:"বলরেখা উত্তর মেরু থেকে বেরিয়ে দক্ষিণ মেরুতে ঢোকে"},{en:"Iron objects inside the field become magnetised and are pulled in",bn:"ক্ষেত্রের ভেতরের লোহা চুম্বকিত হয়ে টান খায়"},{en:"The field is strongest at the poles and weakens with distance",bn:"মেরুতে ক্ষেত্র সবচেয়ে শক্তিশালী, দূরত্বে দুর্বল হয়"}],
body:{en:"Every electron behaves like an unimaginably small magnet because of a property called spin. In most materials these tiny magnets point in random directions and cancel out. In iron, nickel and cobalt, groups of atoms naturally align into regions called domains, and if the domains themselves are lined up — by stroking with another magnet, or by a strong field — the material becomes a permanent magnet. Electricity and magnetism are two faces of one force: a current flowing through a coil creates a magnetic field, and moving a magnet through a coil creates a current. That single relationship powers every motor and every generator.",bn:"স্পিন নামের একটি ধর্মের কারণে প্রতিটি ইলেকট্রনই অকল্পনীয় ক্ষুদ্র চুম্বকের মতো আচরণ করে। বেশিরভাগ পদার্থে এই ক্ষুদ্র চুম্বকগুলো এলোমেলো দিকে থাকে এবং একে অপরকে বাতিল করে। লোহা, নিকেল ও কোবাল্টে একদল পরমাণু স্বাভাবিকভাবেই সারিবদ্ধ হয়ে ডোমেইন নামের অঞ্চল গড়ে, আর সেই ডোমেইনগুলোও একমুখী হলে — অন্য চুম্বক দিয়ে ঘষে বা শক্তিশালী ক্ষেত্র দিয়ে — পদার্থটি স্থায়ী চুম্বক হয়ে যায়। বিদ্যুৎ ও চুম্বকত্ব একই বলের দুই রূপ: কুণ্ডলীতে প্রবাহ চললে চৌম্বক ক্ষেত্র তৈরি হয়, আর কুণ্ডলীর ভেতর চুম্বক নাড়ালে প্রবাহ তৈরি হয়। এই একটি সম্পর্কই প্রতিটি মোটর ও জেনারেটর চালায়।"},
pts:[{en:"Cutting a magnet in half gives two complete magnets, never one lone pole",bn:"চুম্বক কেটে দুভাগ করলে দুটি পূর্ণ চুম্বক হয়, একক মেরু কখনো নয়"},{en:"Heating or hammering a magnet scrambles the domains and weakens it",bn:"গরম করলে বা পেটালে ডোমেইন এলোমেলো হয়ে চুম্বক দুর্বল হয়"},{en:"Earth's core generates the field that makes a compass point north",bn:"পৃথিবীর কেন্দ্র সেই ক্ষেত্র তৈরি করে যা কম্পাসকে উত্তরমুখী রাখে"}]},

{i:21,cat:"physics",k:"sound wave vibration frequency pitch echo শব্দ",
t:{en:"What is sound?",bn:"শব্দ কী?"},
s:{en:"A vibration that travels as a pattern of squeezes and stretches through air, water or solid material.",bn:"কম্পন, যা বাতাস, পানি বা কঠিন পদার্থের ভেতর দিয়ে চাপ ও প্রসারণের ধারা হয়ে ছোটে।"},
svg:S(`<g class="ln"><path d="M40 70 q10 26 0 52"/><path d="M52 60 q16 36 0 72"/><path d="M30 96 h-16"/><rect x="40" y="76" width="10" height="40"/></g><g class="ln">${[0,1,2,3,4,5].map(n=>`<line x1="${86+n*26}" y1="${62+ (n%2)*6}" x2="${86+n*26}" y2="${130-(n%2)*6}"/>`).join("")}</g><g class="ln2">${[0,1,2,3,4,5].map(n=>`<line x1="${96+n*26}" y1="70" x2="${96+n*26}" y2="122"/>`).join("")}</g><g class="ln"><path d="M262 78 q-16 18 0 36"/><path d="M262 78 a18 18 0 0 0 0 36 Z"/><path d="M262 96 h18 v-20 l-10 20 l10 20 v-20"/></g>${M(48,146,1)}${M(148,44,2)}${M(272,146,3)}`),
legend:[{en:"Something vibrates and pushes on the air beside it",bn:"কোনো কিছু কাঁপে ও পাশের বাতাসে ধাক্কা দেয়"},{en:"The push travels outward as alternating dense and thin bands",bn:"সেই ধাক্কা ঘন ও পাতলা স্তরের ধারা হয়ে ছড়ায়"},{en:"Your eardrum vibrates in step and the brain reads it as sound",bn:"কানের পর্দা একই তালে কাঁপে, মস্তিষ্ক তা শব্দ হিসেবে পড়ে"}],
body:{en:"Sound is not a substance that flies through the air; it is a disturbance passed from molecule to molecule. A vibrating drum skin pushes the air next to it into a slightly compressed band, that band pushes the next, and the pattern moves outward while the air itself barely travels at all. How often the vibration repeats sets the pitch — fast vibration is a high note — and how forcefully it pushes sets the loudness. Because sound needs matter to pass through, it moves faster in water than air and faster still in steel, and it cannot cross the vacuum of space at all.",bn:"শব্দ বাতাসে উড়ে যাওয়া কোনো পদার্থ নয়; এটি অণু থেকে অণুতে চালান হওয়া একটি আলোড়ন। কাঁপতে থাকা ঢোলের চামড়া পাশের বাতাসকে সামান্য চাপা স্তরে ঠেলে দেয়, সেই স্তর পরেরটিকে ঠেলে, আর নকশাটি বাইরে ছড়িয়ে পড়ে যখন বাতাস নিজে প্রায় নড়েই না। কম্পন কত ঘন ঘন ঘটে তা ঠিক করে স্বরগ্রাম — দ্রুত কম্পন মানে চড়া সুর — আর কত জোরে ঠেলে তা ঠিক করে জোর। শব্দের চলতে পদার্থ লাগে বলেই তা বাতাসের চেয়ে পানিতে দ্রুত, ইস্পাতে আরও দ্রুত চলে, আর মহাশূন্যের শূন্যতা পেরোতে পারে না।"},
pts:[{en:"Human hearing spans roughly 20 to 20,000 vibrations per second",bn:"মানুষ প্রায় ২০ থেকে ২০,০০০ কম্পন প্রতি সেকেন্ড শুনতে পায়"},{en:"An echo is sound reflecting off a hard surface and returning",bn:"প্রতিধ্বনি হলো শক্ত পৃষ্ঠে শব্দ প্রতিফলিত হয়ে ফিরে আসা"},{en:"Soft, porous materials absorb sound instead of reflecting it",bn:"নরম ছিদ্রযুক্ত পদার্থ শব্দ প্রতিফলিত না করে শুষে নেয়"}]},

{i:22,cat:"physics",k:"light refraction reflection lens spectrum আলো",
t:{en:"How does light travel and bend?",bn:"আলো কীভাবে চলে ও বাঁকে?"},
s:{en:"Light moves in straight lines until it meets a new material, where it slows down and changes direction.",bn:"আলো সরলরেখায় চলে, যতক্ষণ না নতুন মাধ্যমে পড়ে ধীর হয়ে দিক বদলায়।"},
svg:S(`<path class="ln" d="M0 96 H130"/><path class="fl" d="M130 40 H320 V152 H130 Z"/><path class="ln" d="M130 40 V152"/><path class="ln" d="M130 96 L240 140"/><path class="ln2" d="M130 96 L250 96 M130 40 V152"/><path class="ln2" d="M130 96 L232 54"/><g class="ln"><path d="M96 88 L110 96 L96 104"/></g><path class="ln" d="M158 96 a34 34 0 0 0 6-14" stroke-dasharray="3 3"/><g class="ln"><ellipse cx="272" cy="96" rx="12" ry="30"/><path d="M250 84 H262 M250 108 H262"/><path d="M284 96 H300"/></g>${M(64,72,1)}${M(130,168,2)}${M(200,132,3)}`),
legend:[{en:"In one uniform material light travels perfectly straight",bn:"একই ধরনের মাধ্যমে আলো একদম সোজা চলে"},{en:"At a boundary it slows down and bends — refraction",bn:"সীমানায় এসে ধীর হয়ে বেঁকে যায় — প্রতিসরণ"},{en:"A curved lens uses that bending to focus light to a point",bn:"বাঁকানো লেন্স সেই বাঁক কাজে লাগিয়ে আলোকে একবিন্দুতে জড়ো করে"}],
body:{en:"Light is an electromagnetic wave that needs no medium, which is why sunlight crosses empty space. In vacuum it moves at very nearly 300,000 kilometres per second, the fastest anything can go, but inside glass or water it slows measurably. When a beam meets such a boundary at an angle, one edge slows before the other and the whole beam pivots — the reason a stick looks broken at the water's surface and why spectacles work. Different colours slow by slightly different amounts, so a prism spreads white light into a spectrum. Reflection is simpler: the wave bounces off, leaving at the same angle it arrived.",bn:"আলো একটি তড়িৎচুম্বকীয় তরঙ্গ, যার কোনো মাধ্যম লাগে না, তাই সূর্যালোক শূন্য মহাকাশ পেরিয়ে আসে। শূন্যে তা সেকেন্ডে প্রায় ৩ লক্ষ কিলোমিটার চলে, যা সর্বোচ্চ সম্ভব গতি, কিন্তু কাচ বা পানির ভেতরে লক্ষণীয়ভাবে ধীর হয়। রশ্মি এমন সীমানায় কোণাকুণি পড়লে এক প্রান্ত আগে ধীর হয় ও পুরো রশ্মি ঘুরে যায় — এ কারণেই পানিতে লাঠি ভাঙা দেখায় আর চশমা কাজ করে। ভিন্ন রং সামান্য ভিন্ন মাত্রায় ধীর হয়, তাই প্রিজম সাদা আলোকে বর্ণালিতে ছড়িয়ে দেয়। প্রতিফলন সরল: তরঙ্গ যে কোণে আসে সেই কোণেই ফিরে যায়।"},
pts:[{en:"A rainbow is refraction and reflection inside millions of raindrops",bn:"রংধনু হলো লক্ষ লক্ষ বৃষ্টিফোঁটার ভেতরে প্রতিসরণ ও প্রতিফলন"},{en:"Total internal reflection traps light inside optical fibres",bn:"পূর্ণ অভ্যন্তরীণ প্রতিফলন অপটিক্যাল ফাইবারে আলো আটকে রাখে"},{en:"Visible light is a thin slice of a much wider spectrum",bn:"দৃশ্যমান আলো এক বিশাল বর্ণালির সরু একটি অংশ মাত্র"}]},

{i:23,cat:"physics",k:"heat temperature conduction convection radiation তাপ",
t:{en:"What is heat, and how does it move?",bn:"তাপ কী, আর তা কীভাবে ছড়ায়?"},
s:{en:"Heat is the jiggling energy of molecules, and it always flows from hotter to cooler by three routes.",bn:"তাপ হলো অণুর কাঁপুনির শক্তি, আর তা তিনটি পথে সব সময় গরম থেকে ঠান্ডার দিকে যায়।"},
svg:S(`<path class="ln" d="M20 150 H120"/><path class="ln" d="M30 150 V110 H110 V150"/><g class="ln"><path d="M46 110 q6-16 0-26 M62 110 q6-16 0-26 M78 110 q6-16 0-26"/></g><path class="ln" d="M40 84 L100 84 L100 76 L40 76 Z"/><g class="ln"><path d="M162 150 V80 M154 88 L162 78 L170 88"/><path d="M186 150 V80 M178 88 L186 78 L194 88"/><path d="M150 150 H200"/></g><g class="ln"><circle cx="266" cy="60" r="14"/><path d="M266 78 L266 96 M252 92 L266 100 L280 92"/><rect x="244" y="104" width="44" height="12"/></g>${M(112,96,1)}${M(174,60,2)}${M(266,136,3)}`),
legend:[{en:"Conduction: heat passes atom to atom through solid contact",bn:"পরিবহন: কঠিন পদার্থের ছোঁয়ায় পরমাণু থেকে পরমাণুতে তাপ যায়"},{en:"Convection: warm fluid rises and carries heat with it",bn:"পরিচলন: গরম তরল উপরে উঠে তাপ সঙ্গে নিয়ে যায়"},{en:"Radiation: heat crosses empty space as infrared waves",bn:"বিকিরণ: ইনফ্রারেড তরঙ্গ হয়ে তাপ শূন্যস্থান পেরিয়ে যায়"}],
body:{en:"Temperature measures how vigorously the particles in a substance are moving; heat is the energy transferred when a hotter body meets a cooler one. In a solid, fast-moving atoms jostle their neighbours and pass energy along the chain — conduction, which metals do well because their loose electrons carry energy quickly. In liquids and gases, warmed material expands, becomes less dense and rises while cool material sinks to replace it, setting up a circulating current called convection. The third route needs no material at all: every warm object emits infrared waves, which is how the sun's heat crosses ninety-three million miles of vacuum to reach us.",bn:"তাপমাত্রা মাপে কোনো পদার্থের কণাগুলো কত জোরে নড়ছে; আর তাপ হলো গরম বস্তু ঠান্ডা বস্তুর সংস্পর্শে এলে যে শক্তি স্থানান্তরিত হয়। কঠিন পদার্থে দ্রুত নড়া পরমাণু প্রতিবেশীকে ধাক্কা দিয়ে শৃঙ্খল বেয়ে শক্তি পাঠায় — একে পরিবহন বলে, ধাতু এতে দক্ষ কারণ তার আলগা ইলেকট্রন দ্রুত শক্তি বহন করে। তরল ও গ্যাসে উত্তপ্ত অংশ প্রসারিত হয়ে হালকা হয়ে উপরে ওঠে, আর ঠান্ডা অংশ নিচে নেমে জায়গা নেয়, তৈরি হয় ঘূর্ণায়মান স্রোত—পরিচলন। তৃতীয় পথে কোনো মাধ্যমই লাগে না: প্রতিটি উষ্ণ বস্তু ইনফ্রারেড তরঙ্গ ছাড়ে, এভাবেই সূর্যের তাপ কোটি কোটি কিলোমিটার শূন্যতা পেরিয়ে আমাদের কাছে আসে।"},
pts:[{en:"Cold is not a substance; it is simply less heat energy present",bn:"ঠান্ডা কোনো পদার্থ নয়; এটি কেবল কম তাপশক্তি থাকা"},{en:"A vacuum flask blocks all three routes at once",bn:"ভ্যাকুয়াম ফ্লাস্ক একসঙ্গে তিনটি পথই বন্ধ করে"},{en:"Light colours reflect radiant heat, which is why they feel cooler",bn:"হালকা রং বিকিরিত তাপ ফিরিয়ে দেয়, তাই ঠান্ডা লাগে"}]},

{i:24,cat:"physics",k:"free fall gravity acceleration galileo air resistance পতন",
t:{en:"Do heavy things fall faster?",bn:"ভারী জিনিস কি দ্রুত পড়ে?"},
s:{en:"No — in the absence of air resistance, a feather and a stone accelerate downward at exactly the same rate.",bn:"না — বাতাসের বাধা না থাকলে পালক আর পাথর ঠিক একই হারে নিচে পড়ে।"},
svg:S(`<path class="ln" d="M60 24 V166 M220 24 V166"/><g class="ln"><circle cx="60" cy="44" r="9" fill="currentColor"/><circle cx="60" cy="82" r="9" fill="currentColor"/><circle cx="60" cy="144" r="9" fill="currentColor"/></g><g class="ln"><path d="M220 40 q10 8 0 16 q-10-8 0-16" fill="currentColor"/><path d="M220 78 q10 8 0 16 q-10-8 0-16" fill="currentColor"/><path d="M220 140 q10 8 0 16 q-10-8 0-16" fill="currentColor"/></g><path class="ln" d="M20 176 H280"/><path class="ln2" d="M60 44 H220 M60 82 H220 M60 144 H220"/><g class="ln"><rect x="272" y="34" width="34" height="140" rx="4"/><path d="M289 60 V148 M283 142 L289 150 L295 142"/></g>${M(38,60,1)}${M(140,110,2)}${M(289,26,3)}`),
legend:[{en:"Both objects speed up by the same amount every second",bn:"দুটি বস্তুই প্রতি সেকেন্ডে সমান হারে গতি বাড়ায়"},{en:"They stay level all the way down",bn:"পুরো পথ জুড়েই তারা পাশাপাশি থাকে"},{en:"Remove the air and even a feather keeps pace",bn:"বাতাস সরিয়ে নিলে পালকও সমান তালে নামে"}],
body:{en:"Heavier objects are pulled harder by gravity, but they are also harder to accelerate in exact proportion, and the two effects cancel perfectly. The result is that every object near the earth's surface gains about 9.8 metres per second of downward speed each second, regardless of mass. Everyday experience seems to contradict this only because air resistance is doing the work: a feather has a huge surface area for its tiny weight, so air slows it dramatically, while a stone barely notices. Astronauts demonstrated the point on the moon by dropping a hammer and a feather together — they landed at the same instant.",bn:"ভারী বস্তুকে মাধ্যাকর্ষণ জোরে টানে, কিন্তু ঠিক সেই অনুপাতেই তার গতি বাড়ানো কঠিন, আর দুই প্রভাব নিখুঁতভাবে একে অপরকে বাতিল করে। ফলে পৃথিবীপৃষ্ঠের কাছে প্রতিটি বস্তু ভর নির্বিশেষে প্রতি সেকেন্ডে প্রায় ৯.৮ মিটার/সেকেন্ড হারে নিচের দিকে গতি বাড়ায়। দৈনন্দিন অভিজ্ঞতা এর বিপরীত মনে হয় কেবল বাতাসের বাধার কারণে: পালকের ওজনের তুলনায় পৃষ্ঠতল বিশাল, তাই বাতাস তাকে খুব ধীর করে দেয়, আর পাথর তা প্রায় টেরই পায় না। নভোচারীরা চাঁদে হাতুড়ি ও পালক একসঙ্গে ফেলে বিষয়টি দেখিয়েছিলেন — দুটিই একই মুহূর্তে মাটিতে পড়ে।"},
pts:[{en:"Falling objects reach a terminal velocity when air drag balances weight",bn:"বাতাসের বাধা ওজনের সমান হলে পড়ন্ত বস্তু প্রান্তীয় বেগে পৌঁছায়"},{en:"A parachute works purely by increasing air resistance",bn:"প্যারাশুট কেবল বাতাসের বাধা বাড়িয়েই কাজ করে"},{en:"Galileo argued this by logic long before it could be tested properly",bn:"ঠিকমতো পরীক্ষা করার বহু আগেই গ্যালিলিও যুক্তি দিয়ে এটি দেখান"}]},

legend:[{en:"Push the block and it resists moving",bn:"খণ্ডটি ঠেললে তা নড়তে বাধা দেয়"},{en:"Surface bumps interlock and must be forced apart",bn:"তলের খাঁজ একে অপরে আটকে যায়, জোর করে ছাড়াতে হয়"},{en:"Rollers or oil separate the surfaces and cut friction",bn:"চাকা বা তেল তল দুটি আলাদা করে ঘর্ষণ কমায়"}],
body:{en:"No surface is truly smooth. Magnified enough, even polished steel is a landscape of peaks and valleys, and when two such landscapes press together the peaks catch on one another and even bond slightly at contact points. Force is needed to break those contacts, and that force is friction. It always opposes motion, converting useful movement into heat, which is why brakes get hot and why rubbing your palms warms them. Friction is not simply a nuisance to be eliminated: without it, walking, gripping, driving and knots would all be impossible.",bn:"কোনো তলই আসলে পুরোপুরি মসৃণ নয়। যথেষ্ট বড় করে দেখলে পালিশ করা ইস্পাতও চূড়া ও খাদের এক ভূদৃশ্য, আর এমন দুটি ভূদৃশ্য চাপাচাপি করলে চূড়াগুলো একে অপরে আটকে যায়, স্পর্শবিন্দুতে সামান্য জুড়েও যায়। সেই সংযোগ ভাঙতে বল লাগে, আর সেই বলই ঘর্ষণ। এটি সব সময় গতির বিরোধিতা করে, কাজের গতিকে তাপে বদলে দেয়; তাই ব্রেক গরম হয় আর হাতের তালু ঘষলে উষ্ণ লাগে। ঘর্ষণ কেবল দূর করার মতো ঝামেলা নয়: এটি না থাকলে হাঁটা, ধরা, গাড়ি চালানো বা গিঁট বাঁধা কোনোটিই সম্ভব হতো না।"},
pts:[{en:"Starting a stationary object takes more force than keeping it moving",bn:"স্থির বস্তু নড়াতে যত বল লাগে, চলতে থাকা বস্তুর চেয়ে বেশি"},{en:"Lubricants work by inserting a thin fluid layer between surfaces",bn:"পিচ্ছিলকারক তল দুটির মাঝে পাতলা তরল স্তর ঢুকিয়ে কাজ করে"},{en:"Tyre tread channels water away so rubber can still grip the road",bn:"টায়ারের খাঁজ পানি সরিয়ে দেয় যাতে রাবার রাস্তা আঁকড়ে ধরতে পারে"}]}
];

{i:26,cat:"physics",k:"energy conservation kinetic potential joule শক্তি",
t:{en:"What is energy?",bn:"শক্তি কী?"},
s:{en:"The capacity to do work. It changes form endlessly but the total amount never increases or disappears.",bn:"কাজ করার সামর্থ্য। এটি অবিরাম রূপ বদলায়, কিন্তু মোট পরিমাণ কখনো বাড়েও না, হারিয়েও যায় না।"},
svg:S(`<g class="ln"><path d="M20 150 q40-90 80 0"/><circle cx="24" cy="140" r="8" fill="currentColor"/><circle cx="60" cy="112" r="8" fill="currentColor"/><circle cx="96" cy="140" r="8" fill="currentColor"/></g><path class="ln" d="M0 158 H320"/><g class="ln"><rect x="150" y="96" width="40" height="46"/><path d="M158 96 V84 M182 96 V80"/><path d="M170 74 q-8-16 0-26 q8 16 0 26" fill="currentColor"/></g><g class="ln"><path d="M212 118 H244 M236 110 L244 118 L236 126"/><circle cx="276" cy="112" r="18"/><path d="M270 100 q10 12 0 24" /></g>${M(60,86,1)}${M(170,158,2)}${M(276,146,3)}`),
legend:[{en:"Height stores energy; motion releases it",bn:"উচ্চতা শক্তি জমা রাখে; গতি তা ছেড়ে দেয়"},{en:"Fuel holds chemical energy that burning converts to heat",bn:"জ্বালানিতে রাসায়নিক শক্তি থাকে, পোড়ালে তা তাপ হয়"},{en:"Each conversion loses some energy as waste heat",bn:"প্রতিটি রূপান্তরে কিছু শক্তি অপচয়ী তাপ হয়ে যায়"}],
body:{en:"Energy is not a substance but a bookkeeping quantity: whatever form it takes, the total in a closed system stays constant. A stone lifted onto a shelf holds gravitational potential energy; let it fall and that becomes kinetic energy of motion; let it land and the energy scatters as sound and heat. Food, petrol and batteries all store chemical energy in the arrangement of their atoms. The catch is quality, not quantity — every conversion turns some energy into low-grade heat that cannot easily be used again.",bn:"শক্তি কোনো পদার্থ নয়, বরং হিসাবের একটি রাশি: যে রূপই নিক, বদ্ধ ব্যবস্থায় তার মোট পরিমাণ অপরিবর্তিত থাকে। তাকে তোলা পাথরে থাকে মহাকর্ষীয় স্থিতিশক্তি; পড়তে দিলে তা গতিশক্তি হয়; মাটিতে পড়লে শক্তি শব্দ ও তাপ হয়ে ছড়িয়ে যায়। খাদ্য, পেট্রোল ও ব্যাটারি সবই পরমাণুর বিন্যাসে রাসায়নিক শক্তি জমা রাখে। সমস্যা পরিমাণে নয়, মানে — প্রতিটি রূপান্তরে কিছু শক্তি নিম্নমানের তাপ হয়ে যায়, যা আর সহজে কাজে লাগে না।"},
pts:[{en:"Energy is measured in joules; power is joules delivered per second",bn:"শক্তির একক জুল; ক্ষমতা হলো প্রতি সেকেন্ডে দেওয়া জুল"},{en:"Mass itself is a form of energy, as E=mc² states",bn:"ভর নিজেই শক্তির এক রূপ, E=mc² তাই বলে"},{en:"'Saving energy' really means avoiding wasteful conversions",bn:"'শক্তি সাশ্রয়' আসলে অপচয়ী রূপান্তর এড়ানো"}]},

{i:27,cat:"physics",k:"lever machine fulcrum torque pulley লিভার",
t:{en:"How does a lever multiply force?",bn:"লিভার কীভাবে বল বাড়ায়?"},
s:{en:"By trading distance for force — a longer arm lets a small push move a heavy load a shorter way.",bn:"দূরত্বের বিনিময়ে বল পেয়ে — লম্বা বাহু থাকলে অল্প চাপে ভারী বোঝা কম দূরত্বে সরে।"},
svg:S(`<path class="ln" d="M20 108 H280"/><path class="ln" d="M210 108 L226 140 L194 140 Z"/><path class="fl" d="M210 108 L226 140 L194 140 Z"/><rect x="248" y="76" width="34" height="30" class="ln"/><path class="fl" d="M248 76 H282 V106 H248 Z"/><g class="ln"><path d="M40 84 V116 M32 108 L40 118 L48 108"/></g><path class="ln2" d="M20 108 V150 M210 108 V150 M20 150 H210"/><path class="ln2" d="M248 108 V150 M210 150 H248"/><g class="ln"><path d="M40 60 q0-14 12-14"/></g>${M(40,60,1)}${M(210,166,2)}${M(265,54,3)}`),
legend:[{en:"Effort is applied far from the pivot",bn:"পিভট থেকে দূরে বল প্রয়োগ করা হয়"},{en:"The pivot, or fulcrum, is the turning point",bn:"পিভট বা আলম্ব হলো ঘোরার বিন্দু"},{en:"The load sits close in and moves only a little",bn:"বোঝা কাছে থাকে এবং সামান্যই সরে"}],
body:{en:"A lever cannot create energy; it redistributes it. What stays fixed is the turning effect, or torque, which is force multiplied by distance from the pivot. Push down gently at ten times the distance and you produce the same torque as a force ten times greater applied right beside the load. The price is travel: your end of the bar sweeps through ten times the distance. Every simple machine — pulley, ramp, gear, screw — makes the same bargain.",bn:"লিভার শক্তি তৈরি করতে পারে না; কেবল ভাগ করে দেয়। অপরিবর্তিত থাকে ঘূর্ণন প্রভাব বা টর্ক, যা বল গুণ পিভট থেকে দূরত্ব। দশ গুণ দূরত্বে আলতো চাপ দিলে বোঝার পাশে দশ গুণ বড় বল প্রয়োগের সমান টর্ক পাওয়া যায়। মূল্য দিতে হয় পথে: আপনার প্রান্ত দশ গুণ বেশি দূরত্ব ঘোরে। প্রতিটি সরল যন্ত্র — কপিকল, ঢাল, গিয়ার, স্ক্রু — একই দরকষাকষি করে।"},
pts:[{en:"Scissors, wheelbarrows and tongs are levers of three different classes",bn:"কাঁচি, ঠেলাগাড়ি ও চিমটা তিন শ্রেণির লিভার"},{en:"Your forearm is a lever with the elbow as pivot",bn:"কনুইকে পিভট ধরে আপনার হাতও একটি লিভার"},{en:"Gears change speed and force by the ratio of their teeth",bn:"গিয়ার দাঁতের অনুপাতে গতি ও বল বদলায়"}]},

{i:28,cat:"physics",k:"pressure force area atmosphere pascal চাপ",
t:{en:"What is pressure?",bn:"চাপ কী?"},
s:{en:"Force spread over an area — the same push feels sharp through a needle and gentle through a plank.",bn:"কোনো ক্ষেত্রফলে ছড়ানো বল — একই চাপ সূঁচে তীক্ষ্ণ, তক্তায় মৃদু লাগে।"},
svg:S(`<path class="ln" d="M0 140 H320"/><path class="fl" d="M0 140 H320 V190 H0 Z"/><g class="ln"><rect x="40" y="80" width="52" height="24"/><path d="M66 104 L66 140"/><path d="M60 140 L72 140"/><path d="M66 74 V60 M58 68 L66 58 L74 68"/></g><path class="ln" d="M62 140 q4 12 8 0" /><g class="ln"><rect x="180" y="80" width="52" height="24"/><path d="M180 104 H232 V140 H180 Z"/><path d="M206 74 V60 M198 68 L206 58 L214 68"/></g><path class="ln2" d="M66 152 V166 M180 152 H232"/>${M(66,166,1)}${M(206,166,2)}${M(288,100,3)}`),
legend:[{en:"A narrow tip concentrates the force — high pressure",bn:"সরু ডগা বলকে ঘন করে — উচ্চ চাপ"},{en:"A wide base spreads the same force — low pressure",bn:"চওড়া তলা একই বল ছড়িয়ে দেয় — নিম্ন চাপ"},{en:"Air itself presses on everything at about 10 tonnes per square metre",bn:"বাতাসও সব কিছুতে প্রতি বর্গমিটারে প্রায় ১০ টন চাপ দেয়"}],
body:{en:"Pressure is force divided by the area it acts on, so shrinking the area raises the pressure without any extra effort. That is why a knife is sharpened, why nails have points, and why wide tyres let a tractor cross soft mud that would swallow a narrow wheel. Fluids press in all directions at once and transmit any added pressure equally throughout, a principle that hydraulic brakes and jacks depend on. We do not feel the atmosphere crushing us because the fluid inside our bodies pushes back with equal force.",bn:"চাপ হলো বলকে তার প্রয়োগ-ক্ষেত্রফল দিয়ে ভাগ, তাই ক্ষেত্রফল ছোট করলে বাড়তি পরিশ্রম ছাড়াই চাপ বাড়ে। এ কারণেই ছুরিতে ধার দেওয়া হয়, পেরেকের ডগা সরু থাকে, আর চওড়া টায়ারে ট্রাক্টর এমন নরম কাদা পেরোয় যা সরু চাকাকে গিলে নিত। তরল একসঙ্গে সব দিকে চাপ দেয় এবং যোগ করা চাপ সর্বত্র সমানভাবে ছড়িয়ে দেয়, হাইড্রোলিক ব্রেক ও জ্যাক এই নীতির উপরই দাঁড়ানো। বায়ুমণ্ডল আমাদের পিষে ফেলছে বলে টের পাই না, কারণ শরীরের ভেতরের তরল সমান বলে পাল্টা চাপ দেয়।"},
pts:[{en:"Pressure in a liquid rises with depth, which is why deep diving is dangerous",bn:"গভীরতার সঙ্গে তরলের চাপ বাড়ে, তাই গভীরে ডোবা বিপজ্জনক"},{en:"A pressure cooker raises boiling point so food cooks faster",bn:"প্রেশার কুকার স্ফুটনাঙ্ক বাড়ায়, তাই রান্না দ্রুত হয়"},{en:"Low atmospheric pressure at altitude is why water boils cooler on mountains",bn:"উঁচুতে বায়ুচাপ কম বলে পাহাড়ে পানি কম তাপেই ফোটে"}]},

{i:29,cat:"physics",k:"radioactivity radiation isotope halflife nuclear তেজস্ক্রিয়তা",
t:{en:"What is radioactivity?",bn:"তেজস্ক্রিয়তা কী?"},
s:{en:"Unstable atomic nuclei shedding particles or energy at random, gradually turning into other elements.",bn:"অস্থির পারমাণবিক নিউক্লিয়াস এলোমেলোভাবে কণা বা শক্তি ছেড়ে ধীরে ধীরে অন্য মৌলে পরিণত হওয়া।"},
svg:S(`<circle cx="90" cy="96" r="26" class="ln"/><path class="fl2" d="M90 70 a26 26 0 1 0 0 52 a26 26 0 1 0 0-52"/><g class="ln"><circle cx="84" cy="90" r="5" fill="currentColor"/><circle cx="96" cy="94" r="5" fill="currentColor"/><circle cx="88" cy="104" r="5" fill="currentColor"/></g><g class="ln"><path d="M118 84 H180"/><path d="M118 96 q30-14 62 0"/><path d="M118 110 q30 20 62 4"/><path d="M172 78 L182 84 L172 90"/></g><g class="ln"><rect x="196" y="60" width="12" height="72"/><rect x="222" y="60" width="12" height="72"/><rect x="248" y="60" width="20" height="72"/></g><path class="ln2" d="M196 96 H206 M222 96 H240"/>${M(90,140,1)}${M(150,50,2)}${M(232,150,3)}`),
legend:[{en:"A nucleus with too many neutrons is unstable",bn:"অতিরিক্ত নিউট্রনযুক্ত নিউক্লিয়াস অস্থির"},{en:"It emits alpha, beta or gamma radiation",bn:"তা আলফা, বিটা বা গামা বিকিরণ ছাড়ে"},{en:"Paper stops alpha, metal stops beta, thick lead slows gamma",bn:"কাগজ আলফা, ধাতু বিটা, পুরু সিসা গামা আটকায়"}],
body:{en:"Most atoms are stable, but some combinations of protons and neutrons simply cannot hold together, and such a nucleus will eventually break down. There is no way to predict when any single atom will decay; what is predictable is the half-life, the time in which half of a large sample will have decayed. The emitted radiation comes in three main types of increasing penetrating power, and the danger it poses depends on the type, the dose and whether the source is outside or inside the body. Controlled radioactivity is used to date ancient objects, sterilise equipment, image organs and treat tumours.",bn:"বেশিরভাগ পরমাণু স্থিতিশীল, কিন্তু প্রোটন ও নিউট্রনের কিছু সমন্বয় একসঙ্গে টিকতেই পারে না, আর এমন নিউক্লিয়াস এক সময় ভেঙে পড়ে। কোনো একক পরমাণু কখন ভাঙবে তা বলা অসম্ভব; যা অনুমেয় তা হলো অর্ধায়ু, অর্থাৎ যে সময়ে বড় নমুনার অর্ধেক ভেঙে যায়। নির্গত বিকিরণ প্রধানত তিন ধরনের, ভেদনক্ষমতা ক্রমশ বেশি, আর এর বিপদ নির্ভর করে ধরন, মাত্রা এবং উৎস শরীরের বাইরে না ভেতরে তার উপর। নিয়ন্ত্রিত তেজস্ক্রিয়তা প্রাচীন বস্তুর বয়স নির্ণয়, যন্ত্র জীবাণুমুক্তকরণ, অঙ্গের ছবি তোলা ও টিউমার চিকিৎসায় ব্যবহৃত হয়।"},
pts:[{en:"Carbon dating uses a half-life of about 5,700 years",bn:"কার্বন ডেটিং প্রায় ৫,৭০০ বছরের অর্ধায়ু ব্যবহার করে"},{en:"Background radiation from rock, food and space is always present",bn:"পাথর, খাদ্য ও মহাকাশ থেকে পটভূমি বিকিরণ সব সময় থাকে"},{en:"Radioactivity cannot be switched off — only shielded and waited out",bn:"তেজস্ক্রিয়তা বন্ধ করা যায় না — কেবল আড়াল করা ও অপেক্ষা করা যায়"}]},

{i:30,cat:"physics",k:"laser coherent light amplification beam লেজার",
t:{en:"What is a laser?",bn:"লেজার কী?"},
s:{en:"A beam in which every light wave has the same colour and marches perfectly in step, so it stays narrow and intense.",bn:"এমন রশ্মি যেখানে প্রতিটি আলোকতরঙ্গ একই রঙের ও নিখুঁত তালে চলে, তাই তা সরু ও তীব্র থাকে।"},
svg:S(`<rect x="60" y="76" width="170" height="40" class="ln"/><path class="fl" d="M60 76 H230 V116 H60 Z"/><path class="ln" d="M60 70 V122 M230 70 V122"/><g class="ln"><path d="M78 96 q10-10 20 0 t20 0 t20 0 t20 0 t20 0 t20 0"/></g><path class="ln" d="M230 96 H310"/><path class="ln" d="M238 90 q8-6 16 0 t16 0 t16 0 t16 0"/><g class="ln"><path d="M100 130 V146 M140 130 V146 M180 130 V146"/><path d="M92 140 L100 148 L108 140 M132 140 L140 148 L148 140 M172 140 L180 148 L188 140"/></g>${M(40,96,1)}${M(140,58,2)}${M(288,70,3)}`),
legend:[{en:"A fully reflecting mirror sits at one end",bn:"এক প্রান্তে থাকে পূর্ণ প্রতিফলক আয়না"},{en:"Energy pumped in makes atoms release identical light waves",bn:"যোগানো শক্তি পরমাণুকে একই রকম আলোকতরঙ্গ ছাড়তে বাধ্য করে"},{en:"A partly transparent mirror lets the beam out",bn:"আংশিক স্বচ্ছ আয়না দিয়ে রশ্মি বেরিয়ে আসে"}],
body:{en:"Ordinary light from a bulb is a jumble: many colours, waves starting at random moments, spreading in all directions. In a laser, atoms in a gas or crystal are pumped full of energy, and when one releases a light wave it triggers neighbours to release waves of exactly the same wavelength and timing. Mirrors at both ends bounce the light back and forth, amplifying it, until a narrow coherent beam escapes through the partly transparent end. Because the waves stay in step, the beam barely spreads and its energy can be focused onto a spot smaller than a hair.",bn:"বাল্বের সাধারণ আলো এলোমেলো: নানা রং, এলোমেলো সময়ে শুরু হওয়া তরঙ্গ, সব দিকে ছড়ানো। লেজারে গ্যাস বা কেলাসের পরমাণুতে শক্তি ভরে দেওয়া হয়, আর একটি পরমাণু আলোকতরঙ্গ ছাড়লে সেটি প্রতিবেশীদেরও ঠিক একই তরঙ্গদৈর্ঘ্য ও সময়ে তরঙ্গ ছাড়তে উদ্দীপ্ত করে। দুই প্রান্তের আয়না আলোকে বারবার প্রতিফলিত করে বাড়িয়ে তোলে, শেষে আংশিক স্বচ্ছ প্রান্ত দিয়ে সরু সুসংহত রশ্মি বেরোয়। তরঙ্গগুলো একই তালে থাকে বলে রশ্মি প্রায় ছড়ায় না এবং এর শক্তি চুলের চেয়েও ছোট বিন্দুতে কেন্দ্রীভূত করা যায়।"},
pts:[{en:"The word is an acronym for light amplification by stimulated emission",bn:"শব্দটি উদ্দীপিত নিঃসরণে আলোক বিবর্ধনের সংক্ষিপ্ত রূপ"},{en:"Lasers read discs, cut steel, carry internet traffic and correct eyesight",bn:"লেজার ডিস্ক পড়ে, ইস্পাত কাটে, ইন্টারনেট বহন করে ও দৃষ্টি সংশোধন করে"},{en:"Never point any laser at eyes — focus makes even weak beams dangerous",bn:"কখনো চোখে লেজার তাক করবেন না — কেন্দ্রীভূত হওয়ায় দুর্বল রশ্মিও বিপজ্জনক"}]},

{i:31,cat:"chem",k:"atom proton neutron electron nucleus পরমাণু",
t:{en:"What is an atom?",bn:"পরমাণু কী?"},
s:{en:"The smallest unit of an element: a dense nucleus of protons and neutrons surrounded by a cloud of electrons.",bn:"কোনো মৌলের ক্ষুদ্রতম একক: প্রোটন ও নিউট্রনের ঘন নিউক্লিয়াস, ঘিরে থাকে ইলেকট্রনের মেঘ।"},
svg:S(`<circle cx="160" cy="96" r="14" class="ln"/><path class="fl2" d="M160 82 a14 14 0 1 0 0 28 a14 14 0 1 0 0-28"/><g class="ln"><circle cx="155" cy="92" r="4.5" fill="currentColor"/><circle cx="166" cy="94" r="4.5"/><circle cx="159" cy="103" r="4.5" fill="currentColor"/></g><g class="ln2"><ellipse cx="160" cy="96" rx="80" ry="34"/><ellipse cx="160" cy="96" rx="80" ry="34" transform="rotate(60 160 96)"/><ellipse cx="160" cy="96" rx="80" ry="34" transform="rotate(-60 160 96)"/></g><g class="ln"><circle cx="240" cy="96" r="5" fill="currentColor"/><circle cx="122" cy="30" r="5" fill="currentColor"/><circle cx="112" cy="158" r="5" fill="currentColor"/></g>${M(160,146,1)}${M(272,50,2)}${M(48,72,3)}`),
legend:[{en:"Protons and neutrons form the tiny, heavy nucleus",bn:"প্রোটন ও নিউট্রন মিলে ক্ষুদ্র ভারী নিউক্লিয়াস গড়ে"},{en:"Electrons occupy shells at fixed energy levels",bn:"ইলেকট্রন নির্দিষ্ট শক্তিস্তরের কক্ষে থাকে"},{en:"Almost the whole atom is empty space",bn:"পরমাণুর প্রায় পুরোটাই ফাঁকা জায়গা"}],
body:{en:"The number of protons defines which element an atom is — one proton is hydrogen, six is carbon, seventy-nine is gold. Neutrons add mass without changing identity, and atoms of the same element with different neutron counts are called isotopes. Electrons are far lighter and occupy shells around the nucleus; only the outermost ones take part in chemistry, so an element's behaviour is largely set by how many it has there. The scale is hard to picture: if a nucleus were a rice grain in the middle of a football field, the electrons would be at the stands.",bn:"প্রোটনের সংখ্যাই ঠিক করে পরমাণুটি কোন মৌল — এক প্রোটন হাইড্রোজেন, ছয় কার্বন, ঊনআশি সোনা। নিউট্রন পরিচয় না বদলে ভর যোগ করে, আর একই মৌলের ভিন্ন নিউট্রনসংখ্যার পরমাণুকে আইসোটোপ বলে। ইলেকট্রন অনেক হালকা এবং নিউক্লিয়াসকে ঘিরে কক্ষে থাকে; রসায়নে অংশ নেয় কেবল বাইরের স্তরের ইলেকট্রন, তাই মৌলের আচরণ মূলত সেখানে কতগুলো আছে তার উপর নির্ভর করে। মাপটা কল্পনা করা কঠিন: নিউক্লিয়াস যদি ফুটবল মাঠের মাঝে একটি চালের দানা হয়, ইলেকট্রন থাকবে গ্যালারিতে।"},
pts:[{en:"Atoms are around a tenth of a nanometre across",bn:"পরমাণুর ব্যাস প্রায় এক ন্যানোমিটারের দশ ভাগের এক ভাগ"},{en:"An ion is an atom that has gained or lost electrons",bn:"আয়ন হলো ইলেকট্রন পাওয়া বা হারানো পরমাণু"},{en:"Solid objects feel solid because electron shells repel each other",bn:"বস্তু কঠিন লাগে কারণ ইলেকট্রন স্তর একে অপরকে বিকর্ষণ করে"}]},

{i:32,cat:"chem",k:"chemical reaction bond reactant product রাসায়নিক বিক্রিয়া",
t:{en:"What happens in a chemical reaction?",bn:"রাসায়নিক বিক্রিয়ায় কী ঘটে?"},
s:{en:"Existing bonds between atoms break and new ones form, rearranging the same atoms into different substances.",bn:"পরমাণুর পুরনো বন্ধন ভেঙে নতুন বন্ধন তৈরি হয়, একই পরমাণু সাজিয়ে ভিন্ন পদার্থ বানায়।"},
svg:S(`<g class="ln"><circle cx="46" cy="80" r="13"/><circle cx="72" cy="80" r="13"/><circle cx="46" cy="126" r="13"/><circle cx="72" cy="126" r="13"/><path d="M59 80 h0 M59 126 h0"/></g><g class="ln"><path d="M108 102 H160 M152 94 L160 102 L152 110"/></g><g class="ln"><circle cx="206" cy="80" r="13"/><circle cx="232" cy="92" r="13"/><circle cx="206" cy="124" r="13"/><circle cx="232" cy="136" r="13"/></g><path class="fl2" d="M193 80 a13 13 0 1 0 0 1 Z"/><g class="ln"><path d="M270 76 q10-16 0-26 M286 82 q10-16 0-26"/></g>${M(59,44,1)}${M(134,74,2)}${M(232,168,3)}`),
legend:[{en:"Reactants start with atoms bonded one way",bn:"বিক্রিয়কে পরমাণু এক ভাবে বন্ধনযুক্ত থাকে"},{en:"Energy breaks the bonds and atoms rearrange",bn:"শক্তি বন্ধন ভাঙে ও পরমাণু নতুন করে সাজে"},{en:"Products have new properties but the same atoms",bn:"উৎপাদের ধর্ম নতুন, কিন্তু পরমাণু সেই একই"}],
body:{en:"Chemistry is rearrangement, never creation or destruction of atoms — count them before and after and the totals must match. Reactions need an initial push of energy to break existing bonds, which is why a match must be struck; if the new bonds release more energy than was spent, the reaction gives out heat and can sustain itself. Reactions speed up with higher temperature, greater concentration, more surface area, or a catalyst that offers an easier path without being used up itself. Cooking, rusting, digestion and burning are all the same process at different speeds.",bn:"রসায়ন মানে পুনর্বিন্যাস, পরমাণু সৃষ্টি বা ধ্বংস নয় — আগে ও পরে গুনলে সংখ্যা মিলতেই হবে। পুরনো বন্ধন ভাঙতে শুরুতে শক্তির ধাক্কা লাগে, তাই দেশলাই ঘষতে হয়; নতুন বন্ধন যদি খরচের চেয়ে বেশি শক্তি ছাড়ে, বিক্রিয়া তাপ দেয় ও নিজেই চলতে থাকে। তাপমাত্রা, ঘনত্ব বা পৃষ্ঠতল বাড়ালে বিক্রিয়া দ্রুত হয়, আর প্রভাবক নিজে খরচ না হয়েই সহজ পথ দেখায়। রান্না, মরিচা ধরা, হজম ও দহন — সবই ভিন্ন গতিতে একই প্রক্রিয়া।"},
pts:[{en:"Reactions that release heat are exothermic; those that absorb it are endothermic",bn:"তাপ ছাড়লে তাপোৎপাদী, তাপ শোষণ করলে তাপহারী বিক্রিয়া"},{en:"Enzymes are biological catalysts working at body temperature",bn:"উৎসেচক হলো জৈব প্রভাবক, শরীরের তাপমাত্রায় কাজ করে"},{en:"Powdered material reacts much faster than a solid lump",bn:"গুঁড়ো পদার্থ নিরেট খণ্ডের চেয়ে অনেক দ্রুত বিক্রিয়া করে"}]},

{i:33,cat:"chem",k:"rust oxidation iron corrosion galvanise মরিচা",
t:{en:"Why does iron rust?",bn:"লোহায় মরিচা ধরে কেন?"},
s:{en:"Iron reacts with oxygen in the presence of water, forming a flaky oxide that offers no protection underneath.",bn:"পানির উপস্থিতিতে লোহা অক্সিজেনের সঙ্গে বিক্রিয়া করে ঝুরঝুরে অক্সাইড তৈরি করে, যা নিচের স্তরকে রক্ষা করে না।"},
svg:S(`<rect x="40" y="70" width="90" height="56" class="ln"/><path class="fl" d="M40 70 H130 V126 H40 Z"/><g class="ln"><path d="M52 62 q6-12 0-20 M76 62 q6-12 0-20"/><circle cx="100" cy="52" r="7"/><path d="M108 52 h8"/></g><g class="ln"><path d="M150 96 H198 M190 88 L198 96 L190 104"/></g><rect x="214" y="70" width="90" height="56" class="ln"/><path class="fl2" d="M214 70 H304 V126 H214 Z"/><g class="ln"><path d="M222 78 l10 8 l-8 10 M254 88 l12 6 l-6 12 M282 74 l8 12 l-12 6"/><path d="M228 132 l8 8 M262 134 l6 10"/></g>${M(85,150,1)}${M(174,64,2)}${M(259,150,3)}`),
legend:[{en:"Clean iron sits exposed to air and moisture",bn:"পরিষ্কার লোহা বাতাস ও আর্দ্রতার সংস্পর্শে থাকে"},{en:"Water lets iron give up electrons to oxygen",bn:"পানি লোহাকে অক্সিজেনের কাছে ইলেকট্রন ছাড়তে সাহায্য করে"},{en:"Hydrated iron oxide flakes off, exposing fresh metal",bn:"জলযুক্ত আয়রন অক্সাইড খসে পড়ে নতুন ধাতু উন্মুক্ত করে"}],
body:{en:"Rusting is oxidation: iron atoms lose electrons to oxygen, and water acts as the medium that lets those electrons travel, which is why iron stays bright in dry air and rusts fast in humid or salty conditions. Salt makes water conduct better, so coastal and monsoon climates are especially hard on ironwork. The damaging part is that rust is bulkier and weaker than the metal it came from, so it flakes away rather than sealing the surface — unlike aluminium, whose oxide forms an invisible protective skin. Protection therefore means keeping oxygen and water out with paint, oil, or a zinc coating.",bn:"মরিচা ধরা হলো জারণ: লোহার পরমাণু অক্সিজেনের কাছে ইলেকট্রন হারায়, আর পানি সেই ইলেকট্রন চলাচলের মাধ্যম হিসেবে কাজ করে; তাই শুকনো বাতাসে লোহা উজ্জ্বল থাকে, আর্দ্র বা লবণাক্ত পরিবেশে দ্রুত মরিচা ধরে। লবণ পানির পরিবাহিতা বাড়ায়, তাই উপকূলীয় ও বর্ষার আবহাওয়া লোহার জন্য বিশেষ ক্ষতিকর। ক্ষতিকর দিকটি হলো, মরিচা মূল ধাতুর চেয়ে ফাঁপা ও দুর্বল, তাই তা পৃষ্ঠ ঢেকে না রেখে খসে পড়ে — অ্যালুমিনিয়ামের বিপরীতে, যার অক্সাইড অদৃশ্য সুরক্ষা-চামড়া তৈরি করে। তাই রক্ষা মানে রং, তেল বা দস্তার প্রলেপ দিয়ে অক্সিজেন ও পানি ঠেকানো।"},
pts:[{en:"Galvanising coats steel with zinc, which corrodes instead of the iron",bn:"গ্যালভানাইজিং ইস্পাতে দস্তার প্রলেপ দেয়, যা লোহার বদলে নিজে ক্ষয় হয়"},{en:"Stainless steel contains chromium, which forms a sealing oxide layer",bn:"স্টেইনলেস স্টিলে ক্রোমিয়াম থাকে, যা রক্ষাকারী অক্সাইড স্তর গড়ে"},{en:"Rust needs both water and oxygen — remove either and it stops",bn:"মরিচা ধরতে পানি ও অক্সিজেন দুটোই লাগে — একটি সরালেই তা থামে"}]},

{i:34,cat:"chem",k:"acid alkali base pH neutralise indicator অম্ল ক্ষার",

s:{en:"Acids release hydrogen ions into water, alkalis absorb them, and mixing the two cancels both out.",bn:"অম্ল পানিতে হাইড্রোজেন আয়ন ছাড়ে, ক্ষার তা শুষে নেয়, আর দুটি মেশালে দুই-ই নিষ্ক্রিয় হয়।"},

legend:[{en:"Low pH: acidic, like lemon juice or vinegar",bn:"কম পিএইচ: অম্লীয়, যেমন লেবুর রস বা ভিনেগার"},{en:"pH 7 is neutral — pure water",bn:"পিএইচ ৭ নিরপেক্ষ — বিশুদ্ধ পানি"},{en:"High pH: alkaline, like soap or lime",bn:"বেশি পিএইচ: ক্ষারীয়, যেমন সাবান বা চুন"}],
body:{en:"An acid is a substance that releases hydrogen ions when dissolved in water; an alkali releases hydroxide ions that mop them up. The pH scale runs from 0 to 14 and is logarithmic, so pH 3 is ten times more acidic than pH 4 and a hundred times more than pH 5. When acid and alkali meet, the two ions combine into plain water and the leftover parts form a salt — which is exactly what an antacid tablet does to excess stomach acid. Indicators such as litmus or turmeric change colour depending on which ion dominates.",bn:"অম্ল হলো এমন পদার্থ যা পানিতে দ্রবীভূত হলে হাইড্রোজেন আয়ন ছাড়ে; ক্ষার ছাড়ে হাইড্রক্সাইড আয়ন, যা সেগুলো শুষে নেয়। পিএইচ স্কেল ০ থেকে ১৪ পর্যন্ত এবং লগারিদমিক, তাই পিএইচ ৩ পিএইচ ৪-এর চেয়ে দশ গুণ ও পিএইচ ৫-এর চেয়ে একশো গুণ বেশি অম্লীয়। অম্ল ও ক্ষার মিললে দুই আয়ন মিশে সাধারণ পানি হয় আর বাকি অংশ লবণ গড়ে — অ্যান্টাসিড ট্যাবলেট পাকস্থলীর বাড়তি অম্লে ঠিক এই কাজটিই করে। লিটমাস বা হলুদের মতো নির্দেশক কোন আয়ন প্রধান তার উপর রং বদলায়।"},
pts:[{en:"Stomach acid is around pH 2, strong enough to dissolve metal",bn:"পাকস্থলীর অম্ল প্রায় পিএইচ ২, ধাতু গলানোর মতো শক্তিশালী"},{en:"Farmers add lime to reduce acidity in soil",bn:"কৃষক মাটির অম্লতা কমাতে চুন দেন"},{en:"Turmeric turns red in alkali — a traditional kitchen indicator",bn:"ক্ষারে হলুদ লাল হয়ে যায় — রান্নাঘরের চিরচেনা নির্দেশক"}]},

{i:35,cat:"chem",k:"soap surfactant micelle grease detergent সাবান",
t:{en:"Why does soap clean?",bn:"সাবান পরিষ্কার করে কীভাবে?"},
s:{en:"Soap molecules have a water-loving end and an oil-loving end, so they surround grease and let water carry it away.",bn:"সাবানের অণুর এক প্রান্ত পানিপ্রিয়, অন্য প্রান্ত তেলপ্রিয়; তাই তা তেল ঘিরে ধরে আর পানি সেটিকে বয়ে নিয়ে যায়।"},
svg:S(`<g class="ln"><path d="M40 46 q26-10 0 20" /></g><g class="ln"><circle cx="44" cy="60" r="9"/><path d="M44 69 q6 16 0 30"/><circle cx="80" cy="60" r="9"/><path d="M80 69 q-6 16 0 30"/></g><circle cx="200" cy="100" r="34" class="ln"/><path class="fl2" d="M200 66 a34 34 0 1 0 0 68 a34 34 0 1 0 0-68"/><g class="ln">${[0,45,90,135,180,225,270,315].map(a=>{const r=a*Math.PI/180;return `<circle cx="${200+Math.cos(r)*46}" cy="${100+Math.sin(r)*46}" r="6"/><path d="M${200+Math.cos(r)*40} ${100+Math.sin(r)*40} L${200+Math.cos(r)*36} ${100+Math.sin(r)*36}"/>`}).join("")}</g>${M(62,140,1)}${M(200,100,2)}${M(288,52,3)}`),
legend:[{en:"One end of the molecule is attracted to water",bn:"অণুর এক প্রান্ত পানির প্রতি আকৃষ্ট"},{en:"The other end buries itself in oil and dirt",bn:"অন্য প্রান্ত তেল ও ময়লার ভেতরে গেঁথে যায়"},{en:"The grease ends up trapped in a ball that water rinses off",bn:"তেল একটি গোলকে আটকে যায়, পানি তা ধুয়ে নেয়"}],
body:{en:"Water alone cannot lift grease because water molecules cling to each other and refuse to mix with oil. A soap molecule solves this by being two-faced: a long hydrocarbon tail that dissolves happily in fat, and a charged head that dissolves happily in water. Thousands of them swarm a droplet of oil, tails inward and heads outward, forming a tiny sphere called a micelle whose outside is water-friendly. The grease is now effectively wrapped in a water-soluble parcel and simply rinses away. The same double-ended structure is why soap and running water tear apart the fatty envelope of many viruses.",bn:"শুধু পানি তেল তুলতে পারে না, কারণ পানির অণু একে অপরকে আঁকড়ে থাকে ও তেলের সঙ্গে মিশতে চায় না। সাবানের অণু দুই মুখো হয়ে এর সমাধান করে: একটি লম্বা হাইড্রোকার্বন লেজ যা চর্বিতে দিব্যি মেশে, আর একটি আধানযুক্ত মাথা যা পানিতে দিব্যি মেশে। হাজার হাজার অণু তেলের ফোঁটাকে ঘিরে ধরে, লেজ ভেতরে ও মাথা বাইরে রেখে ক্ষুদ্র গোলক তৈরি করে, যাকে মাইসেল বলে, যার বাইরের দিক পানিবান্ধব। তেল তখন কার্যত পানিতে দ্রবণীয় মোড়কে বাঁধা পড়ে ও ধুয়ে চলে যায়। এই দ্বিমুখী গঠনের কারণেই সাবান ও চলন্ত পানি বহু ভাইরাসের চর্বিযুক্ত আবরণ ছিঁড়ে ফেলে।"},
pts:[{en:"Lather is not what cleans; the molecules do the work",bn:"ফেনা পরিষ্কার করে না; কাজটা করে অণুগুলো"},{en:"Hard water wastes soap by forming an insoluble scum",bn:"খর পানিতে অদ্রবণীয় ময়লা জমে সাবান নষ্ট হয়"},{en:"Twenty seconds of scrubbing matters more than water temperature",bn:"পানির তাপমাত্রার চেয়ে বিশ সেকেন্ড ঘষাই বেশি জরুরি"}]},

{i:36,cat:"chem",k:"fire combustion oxygen fuel triangle আগুন",
t:{en:"What makes fire burn?",bn:"আগুন জ্বলে কেন?"},
s:{en:"Fuel, oxygen and enough heat together sustain a fast reaction that releases light and more heat.",bn:"জ্বালানি, অক্সিজেন ও যথেষ্ট তাপ একসঙ্গে হলে দ্রুত বিক্রিয়া চলে, যা আলো ও আরও তাপ ছাড়ে।"},
svg:S(`<path class="ln" d="M160 24 q34 34 22 62 q22-12 20-34 q26 40 12 74 q-18 40-54 40 q-36 0-54-40 q-14-34 12-74 q-2 22 20 34 q-12-28 22-62 Z"/><path class="fl2" d="M160 60 q22 30 14 52 q16-10 12-26 q18 34 6 58 q-12 24-32 24 q-20 0-32-24 q-12-24 6-58 q-4 16 12 26 q-8-22 14-52 Z"/><g class="ln"><path d="M40 60 H86 M78 52 L86 60 L78 68"/><path d="M280 60 H234 M242 52 L234 60 L242 68"/><path d="M160 178 V158"/></g>${M(40,84,1)}${M(280,84,2)}${M(160,178,3)}`),
legend:[{en:"Fuel supplies the material that will react",bn:"জ্বালানি বিক্রিয়ার উপাদান জোগায়"},{en:"Oxygen from the air combines with it",bn:"বাতাসের অক্সিজেন তার সঙ্গে মেশে"},{en:"Heat keeps the reaction going once started",bn:"শুরু হলে তাপ বিক্রিয়া চালু রাখে"}],
body:{en:"Solids and liquids do not actually burn; heat first turns them into vapour, and it is that vapour mixing with oxygen that ignites. This is why a candle wick works — the wax melts, climbs the wick and vaporises. Once burning, the reaction produces more heat than it needs, vaporising further fuel and sustaining itself. Firefighting is therefore always about removing one leg of the triangle: water takes away heat, a blanket or foam cuts off oxygen, and a firebreak removes fuel. Never use water on burning oil, which floats and spreads the fire.",bn:"কঠিন ও তরল আসলে জ্বলে না; তাপ আগে তাদের বাষ্পে পরিণত করে, আর সেই বাষ্পই অক্সিজেনের সঙ্গে মিশে জ্বলে ওঠে। এ কারণেই মোমবাতির সলতে কাজ করে — মোম গলে সলতে বেয়ে উঠে বাষ্প হয়। একবার জ্বলতে শুরু করলে বিক্রিয়া প্রয়োজনের চেয়ে বেশি তাপ দেয়, আরও জ্বালানি বাষ্প করে ও নিজেই টিকে থাকে। তাই আগুন নেভানো মানে সব সময় ত্রিভুজের একটি বাহু সরানো: পানি তাপ কমায়, কম্বল বা ফোম অক্সিজেন আটকায়, আর ফায়ারব্রেক জ্বালানি সরায়। জ্বলন্ত তেলে কখনো পানি দেবেন না, তা ভেসে গিয়ে আগুন ছড়ায়।"},
pts:[{en:"Flame colour indicates temperature and what is burning",bn:"শিখার রং তাপমাত্রা ও কী পুড়ছে তা বোঝায়"},{en:"Smoke is unburnt fuel particles escaping the flame",bn:"ধোঁয়া হলো শিখা থেকে বেরিয়ে যাওয়া অপোড়া জ্বালানিকণা"},{en:"Most fire deaths come from smoke, not flames — stay low",bn:"আগুনে বেশিরভাগ মৃত্যু ধোঁয়ায়, শিখায় নয় — নিচু হয়ে থাকুন"}]},

{i:37,cat:"chem",k:"plastic polymer monomer petrochemical recycling প্লাস্টিক",
t:{en:"What is plastic?",bn:"প্লাস্টিক কী?"},
s:{en:"Very long chain molecules built by linking thousands of small identical units together.",bn:"হাজার হাজার একই রকম ছোট একক জুড়ে তৈরি অতি দীর্ঘ শৃঙ্খল অণু।"},
svg:S(`<g class="ln"><circle cx="40" cy="56" r="10"/><circle cx="70" cy="48" r="10"/><circle cx="98" cy="60" r="10"/></g><g class="ln"><path d="M124 70 H172 M164 62 L172 70 L164 78"/></g><g class="ln"><path d="M40 116 h200"/><g>${[0,1,2,3,4,5,6].map(n=>`<circle cx="${44+n*30}" cy="${116+(n%2?10:-10)}" r="10"/><path d="M${44+n*30} ${116+(n%2?10:-10)} L${74+n*30} ${116+(n%2?-10:10)}"/>`).join("")}</g></g><g class="ln"><path d="M262 150 l10-16 l10 16 Z"/><path d="M256 158 h34"/></g>${M(70,26,1)}${M(150,142,2)}${M(272,178,3)}`),
legend:[{en:"Small monomer units come from oil or gas",bn:"ছোট মনোমার একক আসে তেল বা গ্যাস থেকে"},{en:"They link into chains thousands of units long",bn:"এগুলো জুড়ে হাজার এককের শৃঙ্খল হয়"},{en:"Chain type decides whether it melts, bends or stays rigid",bn:"শৃঙ্খলের ধরনই ঠিক করে তা গলবে, বাঁকবে না শক্ত থাকবে"}],
body:{en:"The word polymer means many parts, and that is literally the structure: a repeating small molecule, usually derived from petroleum, joined end to end into a chain. Whether the result is a flexible bag, a rigid pipe or a stretchy fibre depends on which monomer is used, how long the chains are, and whether they are cross-linked. Plastics became universal because they are cheap, light, waterproof and mouldable. The same chemical stability that makes them durable also means natural decomposers cannot break most of them down, so they persist for centuries and fragment into microplastics.",bn:"পলিমার শব্দের অর্থ বহু অংশ, আর গঠনটিও ঠিক তাই: সাধারণত পেট্রোলিয়াম থেকে পাওয়া একটি ছোট অণু বারবার প্রান্তে প্রান্তে জুড়ে শৃঙ্খল তৈরি করে। ফলাফল নমনীয় ব্যাগ হবে, শক্ত পাইপ হবে না স্থিতিস্থাপক তন্তু হবে তা নির্ভর করে কোন মনোমার, শৃঙ্খল কত লম্বা এবং সেগুলো আড়াআড়ি বাঁধা কি না তার উপর। সস্তা, হালকা, পানিরোধী ও ছাঁচে ঢালা যায় বলে প্লাস্টিক সর্বত্র ছড়িয়েছে। যে রাসায়নিক স্থিতিশীলতা একে টেকসই করে, সেটিই কারণ যে প্রাকৃতিক পচনকারীরা বেশিরভাগ প্লাস্টিক ভাঙতে পারে না, তাই তা শতাব্দী ধরে টিকে থাকে ও মাইক্রোপ্লাস্টিকে ভেঙে যায়।"},
pts:[{en:"Thermoplastics soften on heating and can be remelted; thermosets cannot",bn:"থার্মোপ্লাস্টিক গরমে নরম হয় ও পুনরায় গলানো যায়; থার্মোসেট যায় না"},{en:"The recycling number identifies the polymer, not how recyclable it is",bn:"রিসাইক্লিং নম্বর পলিমার চেনায়, পুনর্ব্যবহারযোগ্যতা নয়"},{en:"Natural polymers exist too — cellulose, rubber and silk",bn:"প্রাকৃতিক পলিমারও আছে — সেলুলোজ, রাবার ও রেশম"}]},

legend:[{en:"In ice, molecules hold a rigid open hexagonal frame",bn:"বরফে অণু শক্ত ফাঁকা ষড়ভুজ কাঠামোয় থাকে"},{en:"In liquid water they pack closer and tumble freely",bn:"তরল পানিতে অণু কাছাকাছি এসে অবাধে ঘোরে"},{en:"Less dense ice therefore floats on denser water",bn:"কম ঘন বরফ তাই বেশি ঘন পানিতে ভাসে"}],
body:{en:"Almost every substance contracts as it solidifies, so the solid form sinks. Water is a famous exception. Its molecules attract each other through hydrogen bonds, and as the temperature falls toward freezing these bonds force the molecules into a spacious hexagonal arrangement with gaps in it. Ice is therefore about nine percent less dense than liquid water and floats with roughly a tenth of its bulk above the surface. This oddity has enormous consequences: lakes and seas freeze from the top down, leaving liquid water below where fish and other life can survive the winter.",bn:"প্রায় প্রতিটি পদার্থ কঠিন হওয়ার সময় সংকুচিত হয়, তাই কঠিন রূপ ডুবে যায়। পানি এক বিখ্যাত ব্যতিক্রম। এর অণু হাইড্রোজেন বন্ধনে একে অপরকে টানে, আর তাপমাত্রা হিমাঙ্কের দিকে নামলে এই বন্ধন অণুগুলোকে ফাঁকযুক্ত প্রশস্ত ষড়ভুজ বিন্যাসে বসিয়ে দেয়। ফলে বরফ তরল পানির চেয়ে প্রায় নয় শতাংশ কম ঘন এবং প্রায় এক-দশমাংশ পৃষ্ঠের উপরে রেখে ভাসে। এই খামখেয়ালির ফল বিশাল: হ্রদ ও সমুদ্র উপর থেকে নিচের দিকে জমে, নিচে তরল পানি থেকে যায় যেখানে মাছ ও অন্য প্রাণ শীত পার করতে পারে।"},
pts:[{en:"About 90 percent of an iceberg stays hidden below the surface",bn:"হিমশৈলের প্রায় ৯০ শতাংশ পানির নিচে লুকিয়ে থাকে"},{en:"Water is densest at 4°C, not at freezing point",bn:"পানি সবচেয়ে ঘন হয় ৪° সেলসিয়াসে, হিমাঙ্কে নয়"},{en:"Freezing water expanding is what bursts pipes and splits rock",bn:"জমে প্রসারিত হওয়া পানিই পাইপ ফাটায় ও পাথর চিরে দেয়"}]},

{i:39,cat:"chem",k:"periodic table element group period mendeleev পর্যায় সারণি",
t:{en:"What is the periodic table?",bn:"পর্যায় সারণি কী?"},
s:{en:"A map of all known elements arranged so that those with similar chemical behaviour fall into the same column.",bn:"সব জ্ঞাত মৌলের মানচিত্র, এমনভাবে সাজানো যে একই রাসায়নিক আচরণের মৌল একই স্তম্ভে পড়ে।"},
svg:S(`<g class="ln">${[0,1,2,3,4,5,6,7].map(c=>[0,1,2,3].map(r=>`<rect x="${30+c*32}" y="${52+r*26}" width="26" height="22"/>`).join("")).join("")}</g><g class="fl2">${[0,1,2,3].map(r=>`<rect x="30" y="${52+r*26}" width="26" height="22"/>`).join("")}${[0,1,2,3].map(r=>`<rect x="${30+7*32}" y="${52+r*26}" width="26" height="22"/>`).join("")}</g><path class="ln" d="M30 44 H286" stroke-dasharray="4 4"/><g class="ln"><path d="M30 168 H286 M278 162 L286 168 L278 174"/></g>${M(43,36,1)}${M(160,180,2)}${M(268,36,3)}`),
legend:[{en:"A column is a group — same outer electrons, similar behaviour",bn:"স্তম্ভ হলো গ্রুপ — একই বাইরের ইলেকট্রন, একই ধরনের আচরণ"},{en:"A row is a period — atomic number rises left to right",bn:"সারি হলো পর্যায় — বাঁ থেকে ডানে পারমাণবিক সংখ্যা বাড়ে"},{en:"Reactive metals sit left, unreactive noble gases far right",bn:"সক্রিয় ধাতু বাঁয়ে, নিষ্ক্রিয় নিষ্ক্রিয় গ্যাস একেবারে ডানে"}],
body:{en:"Mendeleev arranged the known elements by increasing atomic weight in 1869 and noticed that chemical properties repeated at regular intervals — hence periodic. He was confident enough in the pattern to leave gaps and predict the properties of elements not yet discovered, and when they were found the predictions held. Today the table is ordered by proton number, and the underlying reason for the repetition is electron shells: elements in a column have the same number of outer electrons, which is what governs how they bond. Reading the table well means you can predict how an unfamiliar element will behave.",bn:"মেন্ডেলিভ ১৮৬৯ সালে জ্ঞাত মৌলগুলোকে পারমাণবিক ভরের ক্রমে সাজিয়ে লক্ষ করেন, রাসায়নিক ধর্ম নিয়মিত বিরতিতে ফিরে আসে — তাই নাম পর্যায় সারণি। নকশাটিতে তাঁর এতই আস্থা ছিল যে তিনি ফাঁক রেখে অনাবিষ্কৃত মৌলের ধর্ম আগাম বলেছিলেন, আর আবিষ্কারের পর সেই অনুমান মিলে যায়। আজ সারণি সাজানো হয় প্রোটন সংখ্যার ক্রমে, আর পুনরাবৃত্তির আসল কারণ ইলেকট্রন স্তর: একই স্তম্ভের মৌলের বাইরের ইলেকট্রন সংখ্যা এক, যা তাদের বন্ধন গঠনের ধরন ঠিক করে। সারণি ভালোভাবে পড়তে জানলে অচেনা মৌলের আচরণও আগাম বলা যায়।"},
pts:[{en:"Around 94 elements occur naturally; the rest are made in laboratories",bn:"প্রায় ৯৪টি মৌল প্রকৃতিতে পাওয়া যায়; বাকিগুলো গবেষণাগারে তৈরি"},{en:"Noble gases are inert because their outer shell is already full",bn:"নিষ্ক্রিয় গ্যাস নিষ্ক্রিয় কারণ তাদের বাইরের স্তর আগেই পূর্ণ"},{en:"Carbon's four bonding sites make the whole of organic chemistry possible",bn:"কার্বনের চারটি বন্ধনস্থানই গোটা জৈব রসায়ন সম্ভব করে"}]},

{i:40,cat:"chem",k:"fermentation yeast bacteria curd alcohol গাঁজন",
t:{en:"What is fermentation?",bn:"গাঁজন কী?"},
s:{en:"Microbes breaking down sugars without oxygen, producing acids, gases or alcohol as by-products.",bn:"অক্সিজেন ছাড়াই অণুজীবের শর্করা ভাঙা, যার উপজাত হিসেবে অম্ল, গ্যাস বা অ্যালকোহল তৈরি হয়।"},
svg:S(`<path class="ln" d="M96 50 h68 v18 l16 84 a12 12 0 0 1-12 14 H92 a12 12 0 0 1-12-14 l16-84 Z"/><path class="fl2" d="M84 108 l-4 44 a12 12 0 0 0 12 14 h76 a12 12 0 0 0 12-14 l-4-44 Z"/><g class="ln"><circle cx="112" cy="128" r="5"/><circle cx="140" cy="140" r="5"/><circle cx="164" cy="124" r="5"/><circle cx="128" cy="156" r="5"/></g><g class="ln"><circle cx="120" cy="96" r="4"/><circle cx="146" cy="84" r="5"/><circle cx="132" cy="70" r="4"/></g><g class="ln"><path d="M212 100 H262 M254 92 L262 100 L254 108"/><rect x="270" y="80" width="36" height="40" rx="4"/></g>${M(140,166,1)}${M(132,50,2)}${M(288,146,3)}`),
legend:[{en:"Microbes feed on sugar in a sealed, low-oxygen container",bn:"বদ্ধ, স্বল্প-অক্সিজেন পাত্রে অণুজীব শর্করা খায়"},{en:"They release gas, acid or alcohol as waste",bn:"বর্জ্য হিসেবে তারা গ্যাস, অম্ল বা অ্যালকোহল ছাড়ে"},{en:"Acidity preserves the food and changes its texture and flavour",bn:"অম্লতা খাবার সংরক্ষণ করে ও গঠন-স্বাদ বদলে দেয়"}],
body:{en:"When oxygen is scarce, yeasts and certain bacteria still need to extract energy from sugar, and they do so by an incomplete breakdown that leaves energy-rich waste behind. Which waste depends on the organism: lactic acid bacteria sour milk into curd and vegetables into pickles, while yeast produces carbon dioxide that raises bread. The resulting acidity is what preserves the food, since most spoilage organisms cannot survive a low pH. Fermentation also makes nutrients easier to absorb and can add vitamins that were not in the original ingredients.",bn:"অক্সিজেন কম থাকলেও ঈস্ট ও কিছু ব্যাকটেরিয়ার শর্করা থেকে শক্তি নিতে হয়, আর তারা তা করে অসম্পূর্ণ ভাঙনের মাধ্যমে, যাতে শক্তিসমৃদ্ধ বর্জ্য থেকে যায়। কোন বর্জ্য তা নির্ভর করে জীবের উপর: ল্যাকটিক অ্যাসিড ব্যাকটেরিয়া দুধকে টক করে দই বানায় ও সবজিকে আচার করে, আর ঈস্ট কার্বন ডাই-অক্সাইড তৈরি করে রুটি ফোলায়। তৈরি হওয়া অম্লতাই খাবার সংরক্ষণ করে, কারণ বেশিরভাগ পচনকারী জীব কম পিএইচে টেকে না। গাঁজন পুষ্টি শোষণ সহজ করে এবং মূল উপাদানে না থাকা ভিটামিনও যোগ করতে পারে।"},
pts:[{en:"Curd, pickles, bread and vinegar all depend on fermentation",bn:"দই, আচার, রুটি ও ভিনেগার সবই গাঁজনের উপর নির্ভরশীল"},{en:"Muscles ferment briefly during hard exercise, producing lactic acid",bn:"কঠিন ব্যায়ামে পেশিও অল্প সময় গাঁজন করে ল্যাকটিক অ্যাসিড তৈরি করে"},{en:"Temperature control is what separates fermenting from spoiling",bn:"তাপমাত্রা নিয়ন্ত্রণই গাঁজন আর পচনের মধ্যে পার্থক্য গড়ে"}]},

{i:41,cat:"bio",k:"photosynthesis chlorophyll plant sunlight glucose সালোকসংশ্লেষণ",
t:{en:"How do plants make their own food?",bn:"গাছ নিজের খাবার কীভাবে বানায়?"},
s:{en:"Leaves use sunlight to combine carbon dioxide and water into sugar, releasing oxygen as a by-product.",bn:"পাতা সূর্যালোক দিয়ে কার্বন ডাই-অক্সাইড ও পানি মিলিয়ে শর্করা বানায়, উপজাত হিসেবে অক্সিজেন ছাড়ে।"},
svg:S(`<path class="ln" d="M160 172 V96"/><path class="ln" d="M160 108 q-46-6-56-40 q44-8 56 40 Z"/><path class="fl2" d="M160 108 q-46-6-56-40 q44-8 56 40 Z"/><path class="ln" d="M160 96 q46-6 56-40 q-44-8-56 40 Z"/><path class="fl2" d="M160 96 q46-6 56-40 q-44-8-56 40 Z"/><g class="ln"><circle cx="46" cy="34" r="12"/><path d="M56 42 L108 66"/></g><g class="ln"><path d="M40 100 H96 M88 92 L96 100 L88 108"/><path d="M256 60 H300 M292 52 L300 60 L292 68"/></g><path class="ln" d="M160 172 q-24 8-36 18 M160 172 q24 8 36 18 M160 172 V190"/><g class="ln"><path d="M120 150 V132 M112 140 L120 130 L128 140"/></g>${M(78,58,1)}${M(60,120,2)}${M(276,40,3)}`),
legend:[{en:"Chlorophyll in the leaf absorbs sunlight as energy",bn:"পাতার ক্লোরোফিল সূর্যালোক শক্তি হিসেবে শোষণ করে"},{en:"Carbon dioxide enters through pores; roots supply water",bn:"ছিদ্র দিয়ে কার্বন ডাই-অক্সাইড ঢোকে; শিকড় পানি জোগায়"},{en:"Sugar is built and oxygen is released to the air",bn:"শর্করা তৈরি হয় আর অক্সিজেন বাতাসে ছাড়া হয়"}],
body:{en:"Photosynthesis is the process that ultimately feeds almost every living thing. Chlorophyll, the pigment that makes leaves green, absorbs red and blue light and uses that energy to split water molecules. The hydrogen released is then joined to carbon dioxide drawn from the air through tiny leaf pores called stomata, building glucose. Oxygen is simply what is left over from the split water, and every breath we take depends on that waste product. Plants also respire like animals, consuming oxygen day and night, but during daylight photosynthesis far outpaces it.",bn:"সালোকসংশ্লেষণই শেষ বিচারে প্রায় প্রতিটি জীবের খাদ্যের উৎস। পাতা সবুজ করে যে রঞ্জক, সেই ক্লোরোফিল লাল ও নীল আলো শোষণ করে এবং সেই শক্তি দিয়ে পানির অণু ভাঙে। মুক্ত হওয়া হাইড্রোজেন পাতার ক্ষুদ্র ছিদ্র বা পত্ররন্ধ্র দিয়ে টেনে নেওয়া কার্বন ডাই-অক্সাইডের সঙ্গে যুক্ত হয়ে গ্লুকোজ গড়ে। ভাঙা পানির উদ্বৃত্ত অংশই অক্সিজেন, আর আমাদের প্রতিটি শ্বাস সেই বর্জ্যের উপর নির্ভরশীল। গাছও প্রাণীর মতো শ্বসন করে, দিনরাত অক্সিজেন নেয়, তবে দিনের আলোয় সালোকসংশ্লেষণ তাকে বহু গুণে ছাড়িয়ে যায়।"},
pts:[{en:"Leaves look green because chlorophyll reflects green light",bn:"পাতা সবুজ দেখায় কারণ ক্লোরোফিল সবুজ আলো ফিরিয়ে দেয়"},{en:"Stomata close in dry heat to save water, pausing the process",bn:"শুষ্ক গরমে পানি বাঁচাতে পত্ররন্ধ্র বন্ধ হয়, প্রক্রিয়া থেমে যায়"},{en:"Coal and oil are ancient photosynthesis stored underground",bn:"কয়লা ও তেল হলো ভূগর্ভে জমা প্রাচীন সালোকসংশ্লেষণ"}]},
