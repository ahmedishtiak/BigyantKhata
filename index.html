s:{en:"By routing every load into either squeezing or stretching forces that the supports can carry down to the ground.",bn:"প্রতিটি ভার এমনভাবে পাঠিয়ে, যাতে তা চাপ বা টান হয়ে খুঁটির মাধ্যমে মাটিতে নেমে যায়।"},
svg:S(`<path class="ln" d="M20 106 H300"/><g class="ln"><path d="M40 106 q80-56 160 0" fill="none"/><path d="M40 106 v40 M200 106 v40"/></g><g class="ln"><path d="M212 106 l24-34 l24 34 l24-34 l16 34"/><path d="M212 106 h88"/></g><g class="ln"><path d="M40 146 h20 M190 146 h20"/></g><g class="ln"><path d="M100 70 v-18 M92 60 L100 48 L108 60"/><path d="M250 130 v18 M242 140 L250 152 L258 140"/></g>${M(120,86,1)}${M(250,60,2)}${M(40,166,3)}`),
legend:[{en:"An arch turns downward load into squeezing along its curve",bn:"খিলান নিচের ভারকে তার বাঁক বরাবর চাপে বদলায়"},{en:"A truss splits load into members that push or pull",bn:"ট্রাস ভারকে ভাগ করে এমন অংশে যারা ঠেলে বা টানে"},{en:"Everything finally transfers into the foundations",bn:"শেষে সবকিছু ভিত্তিতে গিয়েই ভর দেয়"}],
body:{en:"Every bridge is a device for moving weight sideways to a place where the ground can take it. Materials behave very differently under different forces: stone and concrete are excellent at resisting compression but crack under tension, while steel cable is superb in tension and useless in compression. Good design therefore matches the force to the material. An arch converts downward load into compression running along its curve; a suspension bridge hangs the deck from cables in pure tension; a truss triangulates the load so each straight member is only pushed or pulled, never bent. Engineers also design for wind, temperature expansion and resonance.",bn:"প্রতিটি সেতুই আসলে ওজনকে পাশে সরিয়ে এমন জায়গায় নেওয়ার কৌশল যেখানে মাটি তা নিতে পারে। ভিন্ন বলের নিচে উপকরণের আচরণ খুব আলাদা: পাথর ও কংক্রিট চাপ সামলাতে চমৎকার কিন্তু টানে ফেটে যায়, আর ইস্পাতের তার টানে অসাধারণ, চাপে অকেজো। তাই ভালো নকশা বলের সঙ্গে উপকরণ মিলিয়ে নেয়। খিলান নিচের ভারকে তার বাঁক বরাবর চাপে বদলায়; ঝুলন্ত সেতু ডেককে পুরোপুরি টানে থাকা তারে ঝুলিয়ে রাখে; ট্রাস ভারকে ত্রিভুজে ভাগ করে দেয় যাতে প্রতিটি সোজা অংশ কেবল ঠেলা বা টানা খায়, কখনো বেঁকে না। প্রকৌশলীরা বাতাস, তাপে প্রসারণ ও অনুরণনের কথাও নকশায় রাখেন।"},
pts:[{en:"Expansion joints let a bridge grow and shrink with temperature",bn:"সম্প্রসারণ জোড়া সেতুকে তাপে বাড়তে ও কমতে দেয়"},{en:"Marching soldiers break step because rhythm can build resonance",bn:"সৈন্যরা তাল ভেঙে হাঁটে, কারণ ছন্দ অনুরণন গড়তে পারে"},{en:"Reinforced concrete adds steel bars to handle tension",bn:"প্রলিপ্ত কংক্রিটে টান সামলাতে ইস্পাতের রড যোগ করা হয়"}]},

{i:87,cat:"eng",k:"dam hydroelectric turbine generator reservoir বাঁধ জলবিদ্যুৎ",
t:{en:"How does a dam produce electricity?",bn:"বাঁধ থেকে বিদ্যুৎ হয় কীভাবে?"},
s:{en:"Stored water falls through a turbine, spinning it, and the turbine turns a generator that produces current.",bn:"জমা পানি টারবাইনের ভেতর দিয়ে পড়ে তাকে ঘোরায়, আর টারবাইন জেনারেটর ঘুরিয়ে বিদ্যুৎ তৈরি করে।"},
svg:S(`<path class="ln" d="M40 40 L40 156 L96 156 L80 40 Z"/><path class="fl" d="M40 40 L40 156 L96 156 L80 40 Z"/><path class="fl2" d="M0 56 H40 V156 H0 Z"/><path class="ln" d="M0 56 H40"/><path class="ln" d="M84 96 H150 v40"/><g class="ln"><circle cx="150" cy="150" r="22"/><path d="M150 128 v44 M128 150 h44 M134 134 l32 32 M166 134 l-32 32"/></g><g class="ln"><path d="M150 122 h48 M190 116 L200 122 L190 128"/><rect x="204" y="102" width="48" height="40" rx="4"/><path d="M252 122 h20"/><path d="M272 122 v-40 h-14 M272 82 h14"/></g>${M(20,90,1)}${M(150,150,2)}${M(228,84,3)}`),
legend:[{en:"The reservoir stores water at height, holding potential energy",bn:"জলাধার উঁচুতে পানি জমিয়ে স্থিতিশক্তি ধরে রাখে"},{en:"Falling water spins the turbine blades",bn:"পড়ন্ত পানি টারবাইনের পাখা ঘোরায়"},{en:"The generator converts rotation into electric current",bn:"জেনারেটর ঘূর্ণনকে তড়িৎপ্রবাহে বদলায়"}],
body:{en:"Water held behind a dam has gravitational potential energy purely because of its height above the outlet. Open a controlled channel and that water accelerates downward through a turbine, transferring its energy to the spinning blades. The turbine shaft carries magnets past coils of wire inside the generator, and moving a magnetic field across a conductor induces a current — the same principle as any generator. Output can be adjusted within minutes by changing the flow, which makes hydropower valuable for matching demand. The costs are ecological and social: flooded land, displaced communities, blocked fish migration and trapped silt.",bn:"বাঁধের পেছনে আটকে রাখা পানির মহাকর্ষীয় স্থিতিশক্তি থাকে কেবল নির্গমনমুখের তুলনায় উঁচুতে থাকার কারণেই। নিয়ন্ত্রিত পথ খুলে দিলে সেই পানি টারবাইনের ভেতর দিয়ে নিচে ছুটে যায় এবং ঘূর্ণায়মান পাখায় তার শক্তি দিয়ে দেয়। টারবাইনের দণ্ড জেনারেটরের ভেতরে চুম্বককে তারের কুণ্ডলীর পাশ দিয়ে ঘোরায়, আর পরিবাহীর উপর দিয়ে চৌম্বক ক্ষেত্র সরালেই প্রবাহ আবিষ্ট হয় — যেকোনো জেনারেটরের মতোই নীতি। প্রবাহ বদলে কয়েক মিনিটেই উৎপাদন কমানো-বাড়ানো যায়, তাই চাহিদার সঙ্গে মেলাতে জলবিদ্যুৎ মূল্যবান। খরচটা পরিবেশগত ও সামাজিক: ডুবে যাওয়া জমি, বাস্তুচ্যুত জনগোষ্ঠী, বাধাগ্রস্ত মাছের পরিযান ও আটকে যাওয়া পলি।"},
pts:[{en:"Power depends on both the height of fall and the flow rate",bn:"বিদ্যুৎ নির্ভর করে পতনের উচ্চতা ও প্রবাহ—দুটোর উপরই"},{en:"Pumped storage refills the upper reservoir when power is cheap",bn:"বিদ্যুৎ সস্তা হলে পাম্পড স্টোরেজ উপরের জলাধার ভরে রাখে"},{en:"Silt gradually fills reservoirs and reduces their capacity",bn:"পলি ধীরে ধীরে জলাধার ভরাট করে ধারণক্ষমতা কমায়"}]},

{i:88,cat:"eng",k:"train rail wheel flange traction friction ট্রেন",
t:{en:"How does a train stay on the track?",bn:"ট্রেন লাইনের উপর থাকে কীভাবে?"},
s:{en:"Its wheels are cone-shaped and fixed to a shared axle, which makes the train self-centre without any steering.",bn:"এর চাকা শঙ্কু আকৃতির ও একই অ্যাক্সেলে বাঁধা, তাই কোনো স্টিয়ারিং ছাড়াই ট্রেন নিজেই কেন্দ্রে ফিরে আসে।"},
svg:S(`<g class="ln"><path d="M60 110 h60 l-6 24 h-48 Z"/><path d="M200 110 h60 l-6 24 h-48 Z"/><path d="M40 134 h240"/><path d="M40 146 h240"/></g><path class="fl" d="M60 110 h60 l-6 24 h-48 Z"/><path class="fl" d="M200 110 h60 l-6 24 h-48 Z"/><g class="ln"><path d="M120 110 h80 v-12 h-80 Z"/><path d="M54 98 h212 v-40 h-212 Z"/><path d="M76 66 h40 v24 h-40 Z"/><path d="M140 66 h40 v24 h-40 Z"/><path d="M204 66 h40 v24 h-40 Z"/></g><g class="ln"><path d="M60 134 v14 M120 134 v14"/></g><path class="ln2" d="M40 160 h240"/>${M(90,166,1)}${M(230,166,2)}${M(290,78,3)}`),
legend:[{en:"Wheel treads are slightly conical, wider at the inside",bn:"চাকার পাত সামান্য শঙ্কু আকৃতির, ভেতরের দিকে চওড়া"},{en:"Drifting sideways makes one wheel roll on a larger diameter",bn:"পাশে সরলে এক চাকা বড় ব্যাসে গড়ায়"},{en:"That difference steers the axle back to the centre",bn:"সেই পার্থক্যই অ্যাক্সেলকে কেন্দ্রে ফিরিয়ে আনে"}],
body:{en:"Most people assume the flange — the inner lip on each wheel — is what keeps a train on the rails, but in normal running it rarely touches. The real mechanism is geometry. Each pair of wheels is rigidly joined to one axle so both must turn at the same rate, and the wheel treads are slightly coned. If the axle drifts to one side, that wheel now contacts the rail at a larger diameter while the other contacts at a smaller one, so the larger one travels further per turn and the axle swings back toward centre automatically. The flange is only a safety backstop for sharp curves and emergencies.",bn:"বেশিরভাগ মানুষ ভাবেন চাকার ভেতরের কিনারা বা ফ্ল্যাঞ্জই ট্রেনকে লাইনে ধরে রাখে, কিন্তু স্বাভাবিক চলাচলে তা প্রায় ছোঁয়েই না। আসল কৌশল জ্যামিতি। প্রতি জোড়া চাকা শক্তভাবে একটি অ্যাক্সেলে জোড়া, তাই দুটিকেই সমান হারে ঘুরতে হয়, আর চাকার পাত সামান্য শঙ্কু আকৃতির। অ্যাক্সেল এক পাশে সরে গেলে সেই চাকা রেলকে বড় ব্যাসে স্পর্শ করে আর অন্যটি ছোট ব্যাসে, ফলে বড়টি প্রতি ঘূর্ণনে বেশি দূরত্ব যায় এবং অ্যাক্সেল আপনাআপনি কেন্দ্রের দিকে ফিরে আসে। ফ্ল্যাঞ্জ কেবল তীক্ষ্ণ বাঁক ও জরুরি অবস্থার নিরাপত্তা রক্ষাকবচ।"},
pts:[{en:"Steel on steel has very low friction, so trains are efficient but stop slowly",bn:"ইস্পাতে ইস্পাতে ঘর্ষণ কম, তাই ট্রেন সাশ্রয়ী কিন্তু ধীরে থামে"},{en:"A loaded freight train can need over a kilometre to stop",bn:"বোঝাই মালগাড়ি থামতে এক কিলোমিটারের বেশি লাগতে পারে"},{en:"Gaps between rail sections allow for thermal expansion",bn:"রেলের অংশের মাঝের ফাঁক তাপীয় প্রসারণের জায়গা দেয়"}]},

{i:89,cat:"eng",k:"skyscraper foundation core load wind tall building বহুতল ভবন",
t:{en:"How do tall buildings stay standing?",bn:"উঁচু ভবন দাঁড়িয়ে থাকে কীভাবে?"},
s:{en:"A stiff internal core and a frame carry all weight down to deep foundations, while resisting wind that tries to bend them.",bn:"শক্ত অভ্যন্তরীণ কোর ও কাঠামো সব ওজন গভীর ভিত্তিতে নামায়, আবার বাঁকিয়ে দিতে চাওয়া বাতাসকেও সামলায়।"},
svg:S(`<path class="ln" d="M110 156 V30 h100 v126"/><path class="fl" d="M110 30 h100 v126 h-100 Z"/><path class="ln" d="M144 156 V30 M176 156 V30"/><g class="ln2">${[0,1,2,3,4,5].map(n=>`<line x1="110" y1="${44+n*20}" x2="210" y2="${44+n*20}"/>`).join("")}</g><path class="ln" d="M60 156 H260"/><g class="ln"><path d="M124 156 v26 M160 156 v34 M196 156 v26"/><path d="M110 182 h100" stroke-dasharray="4 4"/></g><g class="ln"><path d="M60 60 h40 M92 54 L102 60 L92 66"/><path d="M60 84 h40 M92 78 L102 84 L92 90"/></g>${M(70,110,1)}${M(160,44,2)}${M(160,180,3)}`),
legend:[{en:"Wind pushes sideways and tries to topple the tower",bn:"বাতাস পাশ থেকে ঠেলে ভবনটিকে কাত করতে চায়"},{en:"A rigid central core resists that bending",bn:"শক্ত কেন্দ্রীয় কোর সেই বাঁকানো ঠেকায়"},{en:"Deep foundations spread the load into firm ground",bn:"গভীর ভিত্তি ভারকে শক্ত মাটিতে ছড়িয়ে দেয়"}],
body:{en:"For a tall building the vertical weight is the easier problem; the harder one is horizontal force. Wind pressure grows with height and tries to bend the structure like a cantilever, so most towers are built around a stiff concrete or braced steel core, often containing the lifts and stairs, with floors hung off it. Foundations must reach material strong enough to take the concentrated load, which on soft delta soil means driving piles deep until they grip firm strata or bear on rock. Very tall towers also manage sway for comfort, sometimes with a large damping mass near the top.",bn:"উঁচু ভবনের ক্ষেত্রে খাড়া ওজন তুলনামূলক সহজ সমস্যা; কঠিনটি হলো আনুভূমিক বল। উচ্চতার সঙ্গে বাতাসের চাপ বাড়ে এবং কাঠামোকে ক্যান্টিলিভারের মতো বাঁকাতে চায়, তাই বেশিরভাগ টাওয়ার গড়া হয় শক্ত কংক্রিট বা ব্রেসযুক্ত ইস্পাতের কোরকে ঘিরে, যাতে প্রায়ই লিফট ও সিঁড়ি থাকে, আর তার সঙ্গে ঝোলানো হয় মেঝেগুলো। ভিত্তিকে এমন স্তরে পৌঁছাতে হয় যা কেন্দ্রীভূত ভার নিতে পারে, নরম বদ্বীপের মাটিতে যার মানে পাইল গভীরে বসিয়ে শক্ত স্তরে আটকানো বা পাথরে ভর দেওয়া। খুব উঁচু ভবনে স্বাচ্ছন্দ্যের জন্য দুলুনিও সামলানো হয়, কখনো উপরের দিকে বড় ভরের ড্যাম্পার বসিয়ে।"},
pts:[{en:"Tall towers are designed to sway slightly rather than resist rigidly",bn:"উঁচু ভবন কঠোরভাবে রুখে না দাঁড়িয়ে সামান্য দুলতেই নকশা করা হয়"},{en:"Earthquake design focuses on flexibility and ductile connections",bn:"ভূমিকম্প নকশায় জোর দেওয়া হয় নমনীয়তা ও নমনীয় জোড়ায়"},{en:"Soft, waterlogged soil makes foundation work the costliest stage",bn:"নরম, জলাবদ্ধ মাটিতে ভিত্তির কাজই সবচেয়ে ব্যয়বহুল ধাপ"}]},

{i:90,cat:"eng",k:"pump water tubewell suction pressure impeller পাম্প",
t:{en:"How does a pump lift water?",bn:"পাম্প পানি তোলে কীভাবে?"},
s:{en:"It lowers the pressure above the water so atmospheric pressure pushes it up, or it flings water outward to build pressure.",bn:"এটি পানির উপরের চাপ কমায় যাতে বায়ুচাপ পানিকে উপরে ঠেলে, কিংবা পানি ছুড়ে দিয়ে চাপ তৈরি করে।"},
svg:S(`<path class="ln" d="M120 60 v90"/><path class="ln" d="M132 60 v90"/><path class="fl2" d="M120 96 h12 v54 h-12 Z"/><path class="ln" d="M100 150 h72"/><path class="fl" d="M40 150 H280 V190 H40 Z"/><g class="ln"><path d="M120 60 h-40 v-14 h-30"/><path d="M60 46 q-14 10 0 20 h20"/></g><g class="ln"><circle cx="216" cy="90" r="28"/><path d="M216 62 q18 16 0 28 M216 118 q-18-16 0-28 M188 90 q16-18 28 0 M244 90 q-16 18-28 0"/><path d="M244 90 h30 v-30"/><path d="M216 118 v20"/></g>${M(126,44,1)}${M(70,80,2)}${M(216,90,3)}`),
legend:[{en:"A piston or plunger creates low pressure in the pipe",bn:"পিস্টন বা প্লাঞ্জার পাইপে কম চাপ তৈরি করে"},{en:"Air pressure outside pushes water up to fill the space",bn:"বাইরের বায়ুচাপ পানিকে ঠেলে সেই ফাঁক পূরণ করে"},{en:"A spinning impeller throws water outward to raise pressure",bn:"ঘূর্ণায়মান ইম্পেলার পানি বাইরে ছুড়ে চাপ বাড়ায়"}],
body:{en:"A hand tubewell does not really suck water up; suction is not a force. By removing air from the pipe it lowers the pressure inside, and the ordinary atmospheric pressure pressing down on the water table then pushes water up the pipe. That sets a hard physical limit — atmospheric pressure can only support a column of about ten metres, and in practice rather less, which is why deeper water requires a pump placed down in the well rather than at the top. Powered centrifugal pumps work differently, spinning an impeller that flings water outward and converts that motion into pressure at the outlet.",bn:"হাত নলকূপ আসলে পানি টেনে তোলে না; টান বলে কোনো বল নেই। পাইপ থেকে বাতাস সরিয়ে সে ভেতরের চাপ কমায়, আর ভূগর্ভস্থ পানির স্তরে চেপে থাকা সাধারণ বায়ুচাপই তখন পানিকে পাইপে উপরে ঠেলে দেয়। এতে একটি কঠিন ভৌত সীমা তৈরি হয় — বায়ুচাপ প্রায় দশ মিটার পানির স্তম্ভ ধরে রাখতে পারে, বাস্তবে তার চেয়ে কম, তাই গভীরের পানির জন্য পাম্প উপরে না রেখে কূপের ভেতরে নামাতে হয়। বিদ্যুৎচালিত কেন্দ্রাতিগ পাম্প ভিন্নভাবে কাজ করে, ইম্পেলার ঘুরিয়ে পানি বাইরে ছুড়ে দেয় ও সেই গতিকে নির্গমনমুখে চাপে রূপ দেয়।"},
pts:[{en:"A pump can push water far higher than it can pull it up",bn:"পাম্প পানিকে যত উপরে ঠেলতে পারে, তত উপরে টানতে পারে না"},{en:"Air leaking into the pipe breaks the pressure difference",bn:"পাইপে বাতাস ঢুকলে চাপের পার্থক্য ভেঙে যায়"},{en:"Over-extraction lowers the water table and can worsen water quality",bn:"অতিরিক্ত উত্তোলনে পানির স্তর নেমে যায় ও গুণমান খারাপ হতে পারে"}]},

{i:91,cat:"eng",k:"glass silica melting amorphous furnace কাচ",
t:{en:"How is glass made?",bn:"কাচ কীভাবে তৈরি হয়?"},
s:{en:"Sand is melted at very high temperature and cooled so quickly that its atoms freeze in a disordered, liquid-like arrangement.",bn:"বালু অতি উচ্চ তাপে গলিয়ে এত দ্রুত ঠান্ডা করা হয় যে পরমাণু বিশৃঙ্খল, তরলের মতো বিন্যাসেই জমে যায়।"},
svg:S(`<g class="ln"><path d="M40 46 q26 8 0 16 q-26-8 0-16"/><path d="M30 70 h60 l-10 26 h-40 Z"/></g><g class="ln"><path d="M110 96 h30 M132 90 L142 96 L132 102"/></g><path class="ln" d="M150 46 h90 v70 h-90 Z"/><path class="fl2" d="M150 76 h90 v40 h-90 Z"/><g class="ln"><path d="M166 130 q10-16 0-26 M196 134 q10-16 0-26"/></g><g class="ln"><path d="M250 96 h26 M268 90 L278 96 L268 102"/><path d="M286 70 h20 v56 h-20 Z"/></g><g class="ln"><circle cx="60" cy="130" r="4"/><circle cx="74" cy="140" r="4"/><circle cx="52" cy="148" r="4"/><circle cx="80" cy="158" r="4"/><circle cx="60" cy="164" r="4"/></g>${M(60,180,1)}${M(196,158,2)}${M(296,150,3)}`),
legend:[{en:"Silica sand is the main ingredient",bn:"সিলিকা বালুই প্রধান উপাদান"},{en:"A furnace melts the mixture at over 1,500°C",bn:"চুল্লিতে মিশ্রণ ১৫০০° সেলসিয়াসের বেশি তাপে গলে"},{en:"Rapid cooling locks atoms in a random, non-crystal pattern",bn:"দ্রুত ঠান্ডা হওয়ায় পরমাণু এলোমেলো, অকেলাসিত নকশায় আটকে যায়"}],
body:{en:"Ordinary glass is mostly silica, the same mineral as beach sand, mixed with soda ash to lower the melting point and limestone to keep it from dissolving in water. In a furnace the mixture becomes a thick liquid, and the crucial step is what happens next: cooled slowly, the atoms would settle into an orderly crystal, but cooled quickly they are frozen mid-shuffle in a random arrangement. That disordered structure is what makes glass transparent and why it has no sharp melting point but softens gradually. Flat window glass is made by floating the molten ribbon on a bath of liquid tin, giving perfectly smooth faces.",bn:"সাধারণ কাচ মূলত সিলিকা, সৈকতের বালুর মতোই খনিজ, তার সঙ্গে গলনাঙ্ক কমাতে সোডা অ্যাশ ও পানিতে গলে যাওয়া ঠেকাতে চুনাপাথর মেশানো হয়। চুল্লিতে মিশ্রণটি ঘন তরল হয়, আর সবচেয়ে গুরুত্বপূর্ণ ধাপ তার পরেরটি: ধীরে ঠান্ডা করলে পরমাণু সুবিন্যস্ত কেলাসে বসে যেত, কিন্তু দ্রুত ঠান্ডা করলে তারা এলোমেলো বিন্যাসেই মাঝপথে জমে যায়। সেই বিশৃঙ্খল গঠনই কাচকে স্বচ্ছ করে এবং এ কারণেই কাচের নির্দিষ্ট গলনাঙ্ক নেই, তা ধীরে ধীরে নরম হয়। সমতল জানালার কাচ বানানো হয় গলিত ফিতাটিকে তরল টিনের গামলায় ভাসিয়ে, ফলে দুই পাশই নিখুঁত মসৃণ হয়।"},
pts:[{en:"Adding metal oxides gives glass its colours",bn:"ধাতব অক্সাইড মেশালে কাচ রং পায়"},{en:"Toughened glass is cooled unevenly so it shatters into blunt pieces",bn:"টেম্পার্ড কাচ অসমভাবে ঠান্ডা করা হয়, তাই ভাঙলে ভোঁতা টুকরো হয়"},{en:"Glass can be recycled repeatedly without losing quality",bn:"কাচ বারবার পুনর্ব্যবহার করলেও গুণমান কমে না"}]},

{i:92,cat:"eng",k:"cement concrete clinker kiln limestone সিমেন্ট",
t:{en:"How is cement made, and how does concrete harden?",bn:"সিমেন্ট কীভাবে তৈরি হয়, আর কংক্রিট শক্ত হয় কীভাবে?"},
s:{en:"Limestone and clay are burned into clinker and ground to powder; adding water starts a chemical reaction that grows interlocking crystals.",bn:"চুনাপাথর ও কাদামাটি পুড়িয়ে ক্লিংকার বানিয়ে গুঁড়ো করা হয়; পানি দিলে রাসায়নিক বিক্রিয়ায় পরস্পর আটকে যাওয়া কেলাস গজায়।"},
svg:S(`<g class="ln"><path d="M24 60 h40 l-8 24 h-24 Z"/><path d="M24 100 h40 l-8 24 h-24 Z"/></g><g class="ln"><path d="M80 92 h24 M96 86 L106 92 L96 98"/><path d="M112 70 l150-16 v40 l-150 16 Z"/><path d="M120 96 q10-16 0-26 M160 90 q10-16 0-26"/></g><g class="ln"><path d="M180 130 h30 M202 124 L212 130 L202 136"/><path d="M226 112 h60 v40 h-60 Z"/></g><g class="ln"><circle cx="240" cy="126" r="4"/><circle cx="256" cy="134" r="5"/><circle cx="272" cy="124" r="4"/><path d="M240 126 L256 134 L272 124"/></g>${M(44,144,1)}${M(190,50,2)}${M(256,168,3)}`),
legend:[{en:"Limestone and clay are quarried and crushed",bn:"চুনাপাথর ও কাদামাটি কেটে গুঁড়ো করা হয়"},{en:"A rotating kiln bakes them at about 1,450°C into clinker",bn:"ঘূর্ণায়মান ভাটায় প্রায় ১৪৫০° সেলসিয়াসে পুড়ে ক্লিংকার হয়"},{en:"Water triggers crystals that lock the mix into stone",bn:"পানি এমন কেলাস তৈরি করে যা মিশ্রণকে পাথরে বাঁধে"}],
body:{en:"Cement is the glue, not the whole material. Limestone and clay are heated in a long rotating kiln until they partly fuse into nodules called clinker, which is then ground with a little gypsum into fine grey powder. Concrete is cement mixed with sand, stone aggregate and water. Setting is not drying — it is hydration, a chemical reaction in which the cement compounds react with water to grow interlocking crystals that bind the aggregate together. This is why concrete gains strength for weeks, why it must be kept damp while curing, and why it can even set under water.",bn:"সিমেন্ট হলো আঠা, পুরো উপকরণ নয়। চুনাপাথর ও কাদামাটি লম্বা ঘূর্ণায়মান ভাটায় ততক্ষণ পোড়ানো হয় যতক্ষণ না তা আংশিক গলে ক্লিংকার নামের দানা হয়, পরে সামান্য জিপসামসহ তা গুঁড়ো করে সূক্ষ্ম ধূসর চূর্ণ বানানো হয়। কংক্রিট হলো সিমেন্টের সঙ্গে বালু, পাথরকুচি ও পানির মিশ্রণ। জমাট বাঁধা মানে শুকানো নয় — এটি জলযোজন, একটি রাসায়নিক বিক্রিয়া যেখানে সিমেন্টের যৌগ পানির সঙ্গে বিক্রিয়া করে পরস্পর আটকে যাওয়া কেলাস গজায় এবং পাথরকুচিকে বেঁধে ফেলে। এ কারণেই কংক্রিট সপ্তাহের পর সপ্তাহ শক্তি বাড়ায়, কিউরিংয়ের সময় ভেজা রাখতে হয়, আর পানির নিচেও জমতে পারে।"},
pts:[{en:"Too much water in the mix permanently weakens concrete",bn:"মিশ্রণে বেশি পানি দিলে কংক্রিট স্থায়ীভাবে দুর্বল হয়"},{en:"Concrete is strong in compression but needs steel for tension",bn:"কংক্রিট চাপে শক্ত, কিন্তু টানের জন্য ইস্পাত লাগে"},{en:"Cement production is a major source of carbon dioxide worldwide",bn:"সিমেন্ট উৎপাদন বিশ্বজুড়ে কার্বন ডাই-অক্সাইডের বড় উৎস"}]},

{i:93,cat:"method",k:"scientific method hypothesis experiment evidence বৈজ্ঞানিক পদ্ধতি",
t:{en:"What is the scientific method?",bn:"বৈজ্ঞানিক পদ্ধতি কী?"},
s:{en:"A disciplined loop: propose an explanation, work out what it predicts, test whether reality agrees, and revise.",bn:"একটি সুশৃঙ্খল চক্র: ব্যাখ্যা প্রস্তাব করা, তা কী পূর্বাভাস দেয় তা বের করা, বাস্তবতা মেলে কি না পরীক্ষা করা, ও সংশোধন করা।"},
svg:S(`<g class="ln"><circle cx="160" cy="96" r="66" fill="none" stroke-dasharray="6 5"/><rect x="120" y="16" width="80" height="26" rx="4"/><rect x="234" y="82" width="80" height="26" rx="4"/><rect x="120" y="150" width="80" height="26" rx="4"/><rect x="6" y="82" width="80" height="26" rx="4"/></g><g class="ln"><path d="M212 40 l10 10 M226 44 L232 58 L218 52"/><path d="M228 140 l-10 10 M214 138 L208 152 L222 148"/><path d="M92 148 l-10-10 M88 132 L74 138 L80 152"/><path d="M78 48 l10-10 M92 34 L106 40 L100 54"/></g>${M(160,96,1)}`),
legend:[{en:"Observe something and ask a specific question",bn:"কিছু পর্যবেক্ষণ করে নির্দিষ্ট প্রশ্ন করা"},{en:"Propose a testable explanation and predict what follows",bn:"পরীক্ষাযোগ্য ব্যাখ্যা দিয়ে তার পরিণতি অনুমান করা"},{en:"Test, compare with the prediction, then revise or repeat",bn:"পরীক্ষা করা, অনুমানের সঙ্গে মেলানো, তারপর সংশোধন বা পুনরাবৃত্তি"}],
body:{en:"There is no single rigid recipe, but the essential feature is that claims must be exposed to the possibility of being wrong. A useful hypothesis has to predict something specific that could fail to happen; if no observation could ever contradict it, testing it is impossible. Experiments are designed to isolate one variable at a time, results must be reproducible by others, and conclusions stay provisional. What makes science self-correcting is not that individual scientists are unbiased — they are not — but that the procedures of testing, publication and criticism are built to expose error over time.",bn:"একটিমাত্র কঠোর রেসিপি নেই, তবে মূল বৈশিষ্ট্য হলো দাবিগুলোকে ভুল প্রমাণিত হওয়ার সম্ভাবনার সামনে দাঁড় করাতে হবে। কার্যকর অনুকল্পকে এমন কিছু নির্দিষ্ট পূর্বাভাস দিতে হয় যা না-ও ঘটতে পারে; কোনো পর্যবেক্ষণেই যদি তা কখনো ভুল প্রমাণ করা না যায়, তবে তা পরীক্ষা করাই অসম্ভব। পরীক্ষা সাজানো হয় একবারে একটি চলক আলাদা করতে, ফলাফল অন্যদের দ্বারা পুনরুৎপাদনযোগ্য হতে হয়, আর সিদ্ধান্ত থাকে অস্থায়ী। বিজ্ঞানকে স্ব-সংশোধনক্ষম করে তোলে এটা নয় যে বিজ্ঞানীরা নিরপেক্ষ — তাঁরা নন — বরং পরীক্ষা, প্রকাশনা ও সমালোচনার প্রক্রিয়াগুলো এমনভাবে গড়া যে সময়ের সঙ্গে ভুল ধরা পড়ে।"},
pts:[{en:"Failing to confirm a hypothesis is a genuine result, not a wasted study",bn:"অনুকল্প নিশ্চিত না হওয়াও সত্যিকারের ফল, বৃথা গবেষণা নয়"},{en:"Correlation between two things does not establish that one causes the other",bn:"দুটি বিষয়ের সহসম্পর্ক প্রমাণ করে না যে একটি অন্যটির কারণ"},{en:"Extraordinary claims require correspondingly strong evidence",bn:"অসাধারণ দাবির জন্য তেমনই জোরালো প্রমাণ দরকার"}]},

{i:94,cat:"method",k:"theory hypothesis law model evidence তত্ত্ব অনুকল্প",
t:{en:"What is the difference between a theory and a hypothesis?",bn:"তত্ত্ব ও অনুকল্পের পার্থক্য কী?"},
s:{en:"A hypothesis is a single testable guess; a scientific theory is a well-tested framework that explains a whole body of evidence.",bn:"অনুকল্প হলো একটিমাত্র পরীক্ষাযোগ্য অনুমান; বৈজ্ঞানিক তত্ত্ব হলো বহু পরীক্ষিত কাঠামো যা প্রমাণের পুরো ভাণ্ডার ব্যাখ্যা করে।"},
svg:S(`<g class="ln"><rect x="24" y="120" width="80" height="30" rx="4"/><path d="M64 120 V96 M56 104 L64 92 L72 104"/></g><g class="ln"><rect x="120" y="70" width="80" height="30" rx="4"/><path d="M160 70 V46 M152 54 L160 42 L168 54"/></g><g class="ln"><rect x="216" y="30" width="90" height="34" rx="4"/></g><g class="ln2"><path d="M104 135 h16 v-50 M200 85 h16 v-38"/></g><g class="ln"><path d="M40 168 h250" stroke-dasharray="4 4"/><path d="M282 162 L292 168 L282 174"/></g>${M(64,164,1)}${M(160,114,2)}${M(261,84,3)}`),
legend:[{en:"Hypothesis: one specific prediction that could be shown false",bn:"অনুকল্প: একটি নির্দিষ্ট পূর্বাভাস, যা ভুল প্রমাণিত হতে পারে"},{en:"Repeated successful testing builds confidence",bn:"বারবার সফল পরীক্ষা আস্থা গড়ে তোলে"},{en:"Theory: a tested framework explaining many separate findings",bn:"তত্ত্ব: পরীক্ষিত কাঠামো, যা বহু আলাদা আবিষ্কার ব্যাখ্যা করে"}],
body:{en:"In everyday speech theory means a hunch, and this causes constant confusion. In science it is nearly the opposite: a theory is an explanatory framework that has survived extensive testing and successfully accounts for many independent observations. Germ theory, plate tectonics and evolution are theories in this sense. A hypothesis sits much lower down — a single proposed explanation awaiting test. A law is different again: it describes a regular pattern, often mathematically, without explaining why it holds. Theories do not graduate into laws; they are separate kinds of statement doing separate jobs.",bn:"দৈনন্দিন কথায় 'তত্ত্ব' মানে আন্দাজ, আর এ থেকেই নিয়ত বিভ্রান্তি হয়। বিজ্ঞানে বিষয়টি প্রায় উল্টো: তত্ত্ব হলো এমন ব্যাখ্যামূলক কাঠামো যা ব্যাপক পরীক্ষা সয়ে টিকে গেছে এবং বহু স্বাধীন পর্যবেক্ষণ সফলভাবে ব্যাখ্যা করে। জীবাণু তত্ত্ব, প্লেট টেকটনিক্স ও বিবর্তন এই অর্থেই তত্ত্ব। অনুকল্প থাকে অনেক নিচে — একটিমাত্র প্রস্তাবিত ব্যাখ্যা, যা পরীক্ষার অপেক্ষায়। সূত্র আবার আলাদা: তা একটি নিয়মিত নকশা বর্ণনা করে, প্রায়ই গাণিতিকভাবে, কেন তা ঘটে সেই ব্যাখ্যা না দিয়েই। তত্ত্ব পদোন্নতি পেয়ে সূত্র হয় না; দুটি আলাদা ধরনের বক্তব্য, আলাদা কাজ করে।"},
pts:[{en:"Calling something 'just a theory' misuses the scientific meaning",bn:"'নিছক একটা তত্ত্ব' বলা বৈজ্ঞানিক অর্থের অপব্যবহার"},{en:"A model is a simplified representation used to make predictions",bn:"মডেল হলো সরলীকৃত উপস্থাপন, যা দিয়ে পূর্বাভাস দেওয়া হয়"},{en:"Even strong theories are refined as better measurements arrive",bn:"ভালো পরিমাপ এলে শক্তিশালী তত্ত্বও পরিমার্জিত হয়"}]},

{i:95,cat:"method",k:"probability chance risk odds random সম্ভাবনা",
t:{en:"What is probability?",bn:"সম্ভাবনা কী?"},
s:{en:"A number from 0 to 1 measuring how likely something is — and it says nothing about what will happen in one particular case.",bn:"০ থেকে ১ পর্যন্ত একটি সংখ্যা, যা মাপে কোনো কিছু কতটা সম্ভাব্য — একটি নির্দিষ্ট ক্ষেত্রে কী ঘটবে তা এটি বলে না।"},
svg:S(`<g class="ln"><rect x="30" y="60" width="52" height="52" rx="6"/><circle cx="44" cy="74" r="4" fill="currentColor"/><circle cx="68" cy="98" r="4" fill="currentColor"/><circle cx="56" cy="86" r="4" fill="currentColor"/></g><g class="ln"><path d="M100 86 h26 M118 80 L128 86 L118 92"/></g><g class="ln"><path d="M140 130 H300"/><path d="M140 130 V40"/>${[0,1,2,3,4,5].map(n=>`<rect x="${148+n*26}" y="${130-[16,34,52,52,34,16][n]}" width="18" height="${[16,34,52,52,34,16][n]}"/>`).join("")}</g><g class="fl2">${[0,1,2,3,4,5].map(n=>`<rect x="${148+n*26}" y="${130-[16,34,52,52,34,16][n]}" width="18" height="${[16,34,52,52,34,16][n]}"/>`).join("")}</g>${M(56,132,1)}${M(220,152,2)}${M(300,60,3)}`),
legend:[{en:"A single roll is unpredictable",bn:"একবারের দান আগেভাগে বলা যায় না"},{en:"Over many trials a stable pattern appears",bn:"বহুবার চেষ্টায় একটি স্থিতিশীল নকশা ফুটে ওঠে"},{en:"Probability describes the pattern, not the next event",bn:"সম্ভাবনা সেই নকশা বর্ণনা করে, পরের ঘটনা নয়"}],
body:{en:"Probability zero means impossible, one means certain, and everything real sits between. The most common error is expecting the long-run pattern to correct itself in the short run: a coin that has landed heads five times is no more likely to land tails next, because the coin has no memory. A second frequent mistake is confusing the probability of the evidence with the probability of the conclusion — a test that is ninety-nine percent accurate can still produce mostly false alarms when the condition it looks for is rare. Thinking clearly about risk means always asking about the base rate.",bn:"সম্ভাবনা শূন্য মানে অসম্ভব, এক মানে নিশ্চিত, আর বাস্তবের সবকিছুই মাঝখানে। সবচেয়ে প্রচলিত ভুল হলো দীর্ঘমেয়াদি নকশাকে স্বল্পমেয়াদে নিজেকে শুধরে নিতে বলা: পাঁচবার হেড পড়া মুদ্রার পরেরবার টেইল পড়ার সম্ভাবনা মোটেও বাড়ে না, কারণ মুদ্রার স্মৃতি নেই। দ্বিতীয় ঘন ভুল হলো প্রমাণের সম্ভাবনার সঙ্গে সিদ্ধান্তের সম্ভাবনা গুলিয়ে ফেলা — নিরানব্বই শতাংশ নির্ভুল পরীক্ষাও বেশিরভাগ ক্ষেত্রে মিথ্যা সতর্কতা দিতে পারে, যদি যা খোঁজা হচ্ছে তা বিরল হয়। ঝুঁকি নিয়ে স্বচ্ছভাবে ভাবা মানে সব সময় ভিত্তিহারের কথা জিজ্ঞেস করা।"},
pts:[{en:"Independent events do not influence each other",bn:"স্বাধীন ঘটনা একে অপরকে প্রভাবিত করে না"},{en:"Rare events become likely when there are enough opportunities",bn:"সুযোগ যথেষ্ট হলে বিরল ঘটনাও সম্ভাব্য হয়ে ওঠে"},{en:"Human intuition consistently misjudges very small probabilities",bn:"খুব ছোট সম্ভাবনা বিচারে মানুষের স্বজ্ঞা বারবার ভুল করে"}]},

{i:96,cat:"method",k:"zero number place value mathematics india শূন্য",
t:{en:"Why was zero such an important invention?",bn:"শূন্য এত গুরুত্বপূর্ণ আবিষ্কার কেন?"},
s:{en:"It gave numbers a placeholder, making position meaningful and turning arithmetic into something anyone could do.",bn:"এটি সংখ্যাকে স্থানধারক দিয়েছে, স্থানকে অর্থবহ করেছে এবং পাটিগণিতকে সবার আয়ত্তে এনেছে।"},
svg:S(`<g class="ln"><rect x="40" y="60" width="40" height="44"/><rect x="84" y="60" width="40" height="44"/><rect x="128" y="60" width="40" height="44"/><text x="52" y="92" class="lbl">3</text><text x="96" y="92" class="lbl">0</text><text x="140" y="92" class="lbl">7</text></g><g class="ln2"><path d="M60 112 v20 M104 112 v20 M148 112 v20"/><path d="M40 140 h128"/></g><g class="ln"><path d="M190 82 h30 M212 76 L222 82 L212 88"/><path d="M236 56 h60 v56 h-60 Z"/><path d="M246 70 h40 M246 84 h30 M246 98 h36"/></g>${M(104,44,1)}${M(104,152,2)}${M(266,132,3)}`),
legend:[{en:"Zero holds an empty column so 307 differs from 37",bn:"শূন্য খালি ঘর ধরে রাখে, তাই ৩০৭ আর ৩৭ আলাদা"},{en:"Each position means ten times the one to its right",bn:"প্রতিটি স্থান তার ডানপাশেরটির দশ গুণ বোঝায়"},{en:"Written calculation becomes systematic and teachable",bn:"লিখে হিসাব করা নিয়মবদ্ধ ও শেখানোর যোগ্য হয়"}],
body:{en:"Zero had to be invented twice over: first as a placeholder marking an empty column, and later as a number in its own right that can be added, subtracted and reasoned about. Indian mathematicians made the second step, with Brahmagupta setting out rules for calculating with zero and negative numbers in the seventh century. The place-value system that zero makes possible reached the Islamic world, where it was developed further and transmitted onward to Europe. The practical effect was enormous: arithmetic that had required a specialist with an abacus became a written procedure any literate person could learn.",bn:"শূন্যকে আবিষ্কার করতে হয়েছিল দুবার: প্রথমে খালি ঘর চিহ্নিত করার স্থানধারক হিসেবে, পরে নিজস্ব অধিকারে এমন সংখ্যা হিসেবে যাকে যোগ-বিয়োগ করা যায় ও যা নিয়ে যুক্তি চলে। দ্বিতীয় ধাপটি নেন ভারতীয় গণিতবিদরা, সপ্তম শতকে ব্রহ্মগুপ্ত শূন্য ও ঋণাত্মক সংখ্যা দিয়ে হিসাবের নিয়ম লিখে দেন। শূন্যের কারণে সম্ভব হওয়া স্থানমান পদ্ধতি ইসলামি বিশ্বে পৌঁছায়, সেখানে আরও বিকশিত হয় এবং ইউরোপে ছড়িয়ে পড়ে। ব্যবহারিক প্রভাব ছিল বিশাল: যে পাটিগণিতের জন্য অ্যাবাকাসসহ বিশেষজ্ঞ লাগত, তা হয়ে গেল লিখিত প্রক্রিয়া, যা যেকোনো শিক্ষিত মানুষ শিখতে পারে।"},
pts:[{en:"Roman numerals had no zero, making written arithmetic awkward",bn:"রোমান সংখ্যায় শূন্য ছিল না, তাই লিখে হিসাব করা কষ্টকর ছিল"},{en:"Division by zero is undefined, not equal to zero or infinity",bn:"শূন্য দিয়ে ভাগ অসংজ্ঞায়িত, তা শূন্য বা অসীম নয়"},{en:"Binary computing depends entirely on having a symbol for nothing",bn:"বাইনারি কম্পিউটিং পুরোপুরি নির্ভর করে শূন্যের প্রতীক থাকার উপর"}]},

{i:97,cat:"method",k:"control group trial placebo blind experiment নিয়ন্ত্রণ দল",
t:{en:"Why do experiments need a control group?",bn:"পরীক্ষায় নিয়ন্ত্রণ দল লাগে কেন?"},
s:{en:"Without a comparison group you cannot tell whether the treatment caused the change or it would have happened anyway.",bn:"তুলনার দল না থাকলে বোঝা যায় না পরিবর্তনটি চিকিৎসার ফল, নাকি এমনিতেই ঘটত।"},
svg:S(`<g class="ln"><rect x="30" y="40" width="110" height="50" rx="4"/><rect x="180" y="40" width="110" height="50" rx="4"/>${[0,1,2].map(n=>`<circle cx="${56+n*30}" cy="65" r="9"/><circle cx="${206+n*30}" cy="65" r="9"/>`).join("")}</g><path class="fl2" d="M180 40 h110 v50 h-110 Z"/><g class="ln"><path d="M85 96 v20 M235 96 v20"/><path d="M79 110 L85 120 L91 110 M229 110 L235 120 L241 110"/></g><g class="ln"><rect x="30" y="126" width="110" height="40" rx="4"/><rect x="180" y="126" width="110" height="40" rx="4"/><path d="M46 156 v-14 M62 156 v-20 M78 156 v-8 M94 156 v-16 M110 156 v-10"/><path d="M196 156 v-24 M212 156 v-20 M228 156 v-26 M244 156 v-18 M260 156 v-22"/></g>${M(85,26,1)}${M(235,26,2)}${M(160,146,3)}`),
legend:[{en:"One group receives no treatment or a dummy one",bn:"এক দল কোনো চিকিৎসা পায় না, বা নকল চিকিৎসা পায়"},{en:"The other group receives the real treatment",bn:"অন্য দল পায় আসল চিকিৎসা"},{en:"Only the difference between them is meaningful evidence",bn:"কেবল দুই দলের পার্থক্যই অর্থবহ প্রমাণ"}],
body:{en:"Most conditions change on their own — illnesses improve, crops vary with weather, people perform better simply because they are being watched. If you only observe the treated group you have no way of separating the treatment's effect from all of that. A control group experiences everything except the one variable being tested, so any difference between the groups can reasonably be attributed to it. Assignment must be random to avoid stacking the groups, and ideally neither participants nor assessors know who received what, since expectation alone measurably changes reported outcomes.",bn:"বেশিরভাগ অবস্থাই নিজে নিজে বদলায় — অসুখ ভালো হয়, আবহাওয়ায় ফসল ওঠানামা করে, নজরে আছে বলেই মানুষ ভালো করে। কেবল চিকিৎসাপ্রাপ্ত দলটিকে দেখলে চিকিৎসার প্রভাবকে এসব থেকে আলাদা করার উপায় থাকে না। নিয়ন্ত্রণ দল একটিমাত্র পরীক্ষাধীন চলক ছাড়া বাকি সবকিছুরই অভিজ্ঞতা পায়, তাই দুই দলের যেকোনো পার্থক্যকে যুক্তিসঙ্গতভাবে সেই চলকের কারণ বলা যায়। দলে ভাগ করতে হয় এলোমেলোভাবে, যাতে কোনো দল আগেভাগে সুবিধাজনক না হয়, আর আদর্শভাবে অংশগ্রহণকারী ও মূল্যায়নকারী কেউই জানবেন না কে কী পেয়েছেন, কারণ কেবল প্রত্যাশাই ফলাফলকে মাপা যায় এমনভাবে বদলে দেয়।"},
pts:[{en:"The placebo effect is real and measurable, which is why dummies are used",bn:"প্লাসিবো প্রভাব বাস্তব ও মাপা যায়, তাই নকল চিকিৎসা ব্যবহার হয়"},{en:"Small samples produce unreliable differences by chance alone",bn:"ছোট নমুনায় কেবল দৈবক্রমেই অনির্ভরযোগ্য পার্থক্য আসে"},{en:"Testimonials are not evidence because they have no comparison",bn:"সাক্ষ্য-অভিজ্ঞতা প্রমাণ নয়, কারণ সেখানে তুলনা নেই"}]},

body:{en:"Peer review is quality filtering, not verification. Reviewers usually work from the manuscript alone; they rarely repeat the experiments or inspect raw data, so they can catch flawed reasoning, inadequate controls and overstated conclusions, but not deliberate fraud or subtle errors. Passing review means a study is worth taking seriously, not that it is correct. Real confidence comes from replication — independent groups obtaining the same result. This is why a single study, however striking its headline, should shift your view only modestly, and why systematic reviews weighing many studies are more reliable than any one of them.",bn:"পিয়ার রিভিউ মান যাচাইয়ের ছাঁকনি, সত্যতা প্রমাণ নয়। পর্যালোচকরা সাধারণত কেবল পাণ্ডুলিপি দেখেই কাজ করেন; তাঁরা খুব কমই পরীক্ষা পুনরাবৃত্তি করেন বা কাঁচা উপাত্ত দেখেন, তাই ত্রুটিপূর্ণ যুক্তি, অপর্যাপ্ত নিয়ন্ত্রণ ও অতিরঞ্জিত সিদ্ধান্ত ধরতে পারেন, কিন্তু ইচ্ছাকৃত জালিয়াতি বা সূক্ষ্ম ভুল নয়। রিভিউ পার হওয়া মানে গবেষণাটি গুরুত্বসহকারে বিবেচনার যোগ্য, তা সঠিক নয়। সত্যিকারের আস্থা আসে পুনরুৎপাদন থেকে — স্বাধীন দল একই ফল পেলে। তাই একটিমাত্র গবেষণা, শিরোনাম যতই চমকপ্রদ হোক, আপনার দৃষ্টিভঙ্গি সামান্যই বদলানো উচিত, আর বহু গবেষণা মিলিয়ে করা পদ্ধতিগত পর্যালোচনা যেকোনো একটির চেয়ে বেশি নির্ভরযোগ্য।"},

s:{en:"The mean is pulled by extreme values; the median shows the typical middle case and is often more honest.",bn:"গড়কে চরম মানগুলো টেনে নেয়; মধ্যক দেখায় সাধারণ মাঝামাঝি অবস্থা, প্রায়ই যা বেশি সৎ।"},

body:{en:"To find the mean you add everything and divide by the count; to find the median you line the values up and take the middle one. When the data are roughly symmetrical the two agree. When they are skewed — as income, house prices and waiting times almost always are — they can differ enormously, because a handful of very large values drags the mean upward while leaving the median untouched. If a report gives only the average, ask whether the distribution is lopsided and what the median is. Also ask about the spread, since two datasets with identical averages can describe completely different realities.",bn:"গড় বের করতে সব যোগ করে সংখ্যা দিয়ে ভাগ করতে হয়; মধ্যক বের করতে মানগুলো সাজিয়ে মাঝেরটি নিতে হয়। উপাত্ত মোটামুটি প্রতিসম হলে দুটি মিলে যায়। কিন্তু তা বাঁকা হলে — আয়, বাড়ির দাম ও অপেক্ষার সময় প্রায় সব সময়ই যেমন — দুটির মধ্যে বিশাল ফারাক হতে পারে, কারণ গুটিকয় বিশাল মান গড়কে উপরে টেনে নেয় অথচ মধ্যক অটুট থাকে। কোনো প্রতিবেদনে কেবল গড় দিলে জিজ্ঞেস করুন বণ্টনটি একদিকে ঝুঁকে আছে কি না এবং মধ্যক কত। বিস্তার নিয়েও জিজ্ঞেস করুন, কারণ একই গড়ের দুটি উপাত্তসেট সম্পূর্ণ ভিন্ন বাস্তবতা বোঝাতে পারে।"},

body:{en:"Recognising a few common patterns protects you from most bad arguments. Attacking the person instead of the claim proves nothing about the claim. Treating a statement as true merely because an authority said it ignores whether the authority has relevant expertise or evidence. Assuming that because one thing followed another it was caused by it confuses sequence with cause. Presenting only two options when more exist forces a false choice. Note carefully that a fallacy makes an argument unsound, not the conclusion false — a badly argued claim may still turn out to be correct, and needs better support rather than dismissal.",bn:"গুটিকয় প্রচলিত ধরন চিনতে পারলেই বেশিরভাগ দুর্বল যুক্তি থেকে রক্ষা পাওয়া যায়। দাবির বদলে ব্যক্তিকে আক্রমণ করলে দাবিটি সম্পর্কে কিছুই প্রমাণ হয় না। কোনো কর্তৃপক্ষ বলেছেন বলেই কথাটি সত্য ধরে নেওয়া উপেক্ষা করে যে সেই কর্তৃপক্ষের প্রাসঙ্গিক বিশেষজ্ঞতা বা প্রমাণ আছে কি না। একটি ঘটনার পরে আরেকটি ঘটেছে বলেই প্রথমটিকে কারণ ধরা ক্রমকে কারণ বলে গুলিয়ে ফেলে। আরও বিকল্প থাকা সত্ত্বেও কেবল দুটি বিকল্প দেখানো মিথ্যা বাছাই চাপিয়ে দেয়। মনে রাখা জরুরি, হেত্বাভাস যুক্তিকে অসিদ্ধ করে, সিদ্ধান্তকে মিথ্যা নয় — খারাপভাবে যুক্তি দেওয়া দাবিও সঠিক হতে পারে, তার দরকার আরও ভালো সমর্থন, উড়িয়ে দেওয়া নয়।"},

{w:"Resistance",bn:"রোধ",d:"How strongly a material opposes electric current.",dbn:"পদার্থ কতটা জোরে তড়িৎপ্রবাহে বাধা দেয়।",ex:"A long thin wire has more resistance than a short thick one.",f:"physics",lv:2},
{w:"Circuit",bn:"বর্তনী",d:"A complete path around which electric current can flow.",dbn:"সম্পূর্ণ পথ, যার চারদিকে তড়িৎপ্রবাহ চলতে পারে।",ex:"The bulb will not light until the circuit is closed.",f:"physics",lv:1},
{w:"Magnetism",bn:"চুম্বকত্ব",d:"The force by which magnets attract or repel each other.",dbn:"যে বলে চুম্বক একে অপরকে টানে বা ঠেলে।",ex:"Magnetism makes the compass needle swing toward north.",f:"physics",lv:1},
{w:"Frequency",bn:"কম্পাঙ্ক",d:"How many times a wave repeats each second.",dbn:"প্রতি সেকেন্ডে তরঙ্গ কতবার পুনরাবৃত্ত হয়।",ex:"A higher frequency sound is heard as a higher note.",f:"physics",lv:2},
{w:"Wavelength",bn:"তরঙ্গদৈর্ঘ্য",d:"The distance between two matching points on a wave.",dbn:"তরঙ্গের দুটি অনুরূপ বিন্দুর মধ্যে দূরত্ব।",ex:"Red light has a longer wavelength than blue light.",f:"physics",lv:2},
{w:"Amplitude",bn:"বিস্তার",d:"The size of a wave's swing from its rest position.",dbn:"স্থির অবস্থান থেকে তরঙ্গের দোলনের মাপ।",ex:"Increasing the amplitude of a sound wave makes it louder.",f:"physics",lv:3},
{w:"Reflection",bn:"প্রতিফলন",d:"A wave bouncing back after striking a surface.",dbn:"কোনো তলে আঘাত করে তরঙ্গের ফিরে আসা।",ex:"We see ourselves in a mirror because of reflection.",f:"physics",lv:1},
{w:"Refraction",bn:"প্রতিসরণ",d:"The bending of a wave as it enters a new material.",dbn:"নতুন মাধ্যমে ঢোকার সময় তরঙ্গের বেঁকে যাওয়া।",ex:"Refraction makes a straight stick look broken in water.",f:"physics",lv:2},
{w:"Spectrum",bn:"বর্ণালি",d:"The full range of wavelengths present in radiation.",dbn:"বিকিরণে উপস্থিত তরঙ্গদৈর্ঘ্যের পূর্ণ পরিসর।",ex:"A prism splits sunlight into a spectrum of colours.",f:"physics",lv:2},
{w:"Vacuum",bn:"শূন্যস্থান",d:"A space containing no matter at all.",dbn:"এমন স্থান যেখানে কোনো পদার্থ নেই।",ex:"Sound cannot travel through a vacuum.",f:"physics",lv:2},
{w:"Vibration",bn:"কম্পন",d:"A rapid back-and-forth movement about a fixed point.",dbn:"স্থির বিন্দুকে ঘিরে দ্রুত আগুপিছু নড়াচড়া।",ex:"The vibration of the string produces the sound.",f:"physics",lv:1},
{w:"Echo",bn:"প্রতিধ্বনি",d:"Sound heard again after reflecting off a distant surface.",dbn:"দূরের তলে প্রতিফলিত হয়ে আবার শোনা শব্দ।",ex:"We heard our own echo across the valley.",f:"physics",lv:1},
{w:"Lever",bn:"লিভার",d:"A rigid bar turning about a pivot to multiply force.",dbn:"আলম্বকে ঘিরে ঘোরা শক্ত দণ্ড, যা বল বাড়ায়।",ex:"He used an iron rod as a lever to shift the stone.",f:"physics",lv:1},
{w:"Fulcrum",bn:"আলম্ব",d:"The fixed point about which a lever turns.",dbn:"যে স্থির বিন্দুকে ঘিরে লিভার ঘোরে।",ex:"Moving the fulcrum closer to the load makes lifting easier.",f:"physics",lv:2},
{w:"Torque",bn:"টর্ক",d:"The turning effect produced by a force.",dbn:"বলের ফলে সৃষ্ট ঘূর্ণন প্রভাব।",ex:"A longer spanner applies more torque to the bolt.",f:"physics",lv:3},
{w:"Equilibrium",bn:"সাম্যাবস্থা",d:"A state in which all forces balance and nothing changes.",dbn:"এমন অবস্থা যেখানে সব বল ভারসাম্যে ও কিছুই বদলায় না।",ex:"The scales came to equilibrium when both pans matched.",f:"physics",lv:3},
{w:"Efficiency",bn:"দক্ষতা",d:"The fraction of supplied energy that does useful work.",dbn:"সরবরাহকৃত শক্তির যে ভগ্নাংশ কাজে লাগে।",ex:"Old bulbs waste power because their efficiency is low.",f:"physics",lv:2},
{w:"Power",bn:"ক্ষমতা",d:"The rate at which energy is used or transferred.",dbn:"যে হারে শক্তি ব্যবহৃত বা স্থানান্তরিত হয়।",ex:"This pump has a power rating of one kilowatt.",f:"physics",lv:2},
{w:"Work",bn:"কাজ",d:"Energy transferred when a force moves something.",dbn:"বল প্রয়োগে কিছু সরালে যে শক্তি স্থানান্তরিত হয়।",ex:"No work is done if the wall does not move.",f:"physics",lv:2},
{w:"Kinetic energy",bn:"গতিশক্তি",d:"The energy an object has because it is moving.",dbn:"চলমান থাকার কারণে বস্তুর যে শক্তি।",ex:"A falling coconut gains kinetic energy as it drops.",f:"physics",lv:2},
{w:"Potential energy",bn:"স্থিতিশক্তি",d:"Stored energy due to position or condition.",dbn:"অবস্থান বা অবস্থার কারণে জমা থাকা শক্তি।",ex:"Water in a high reservoir holds potential energy.",f:"physics",lv:2},
{w:"Photon",bn:"ফোটন",d:"A single packet of light energy.",dbn:"আলোক শক্তির একক প্যাকেট।",ex:"A solar cell releases an electron when it absorbs a photon.",f:"physics",lv:3},
{w:"Quantum",bn:"কোয়ান্টাম",d:"The smallest indivisible amount of a physical quantity.",dbn:"কোনো ভৌত রাশির ক্ষুদ্রতম অবিভাজ্য পরিমাণ।",ex:"Energy at atomic scale changes one quantum at a time.",f:"physics",lv:3},
{w:"Relativity",bn:"আপেক্ষিকতা",d:"Einstein's theory relating space, time, mass and gravity.",dbn:"স্থান, কাল, ভর ও মাধ্যাকর্ষণ সম্পর্কিত আইনস্টাইনের তত্ত্ব।",ex:"Satellite clocks are corrected using relativity.",f:"physics",lv:3},
{w:"Nuclear fusion",bn:"নিউক্লীয় সংযোজন",d:"Light nuclei joining to form a heavier one, releasing energy.",dbn:"হালকা নিউক্লিয়াস মিশে ভারী হওয়া, যাতে শক্তি নির্গত হয়।",ex:"Nuclear fusion in the core is what makes the sun shine.",f:"physics",lv:3},
{w:"Nuclear fission",bn:"নিউক্লীয় বিভাজন",d:"A heavy nucleus splitting into lighter parts.",dbn:"ভারী নিউক্লিয়াসের হালকা অংশে ভেঙে যাওয়া।",ex:"Power reactors generate heat through nuclear fission.",f:"physics",lv:3},
{w:"Atom",bn:"পরমাণু",d:"The smallest particle of an element that keeps its identity.",dbn:"মৌলের ক্ষুদ্রতম কণা, যা তার পরিচয় ধরে রাখে।",ex:"Every drop of water contains countless atoms.",f:"chem",lv:1},
{w:"Molecule",bn:"অণু",d:"Two or more atoms chemically bonded together.",dbn:"রাসায়নিকভাবে যুক্ত দুই বা ততোধিক পরমাণু।",ex:"A water molecule holds two hydrogen atoms and one oxygen atom.",f:"chem",lv:1},
{w:"Element",bn:"মৌল",d:"A substance made of only one kind of atom.",dbn:"কেবল এক ধরনের পরমাণু দিয়ে গঠিত পদার্থ।",ex:"Gold is an element and cannot be broken into simpler substances.",f:"chem",lv:1},
{w:"Compound",bn:"যৌগ",d:"A substance formed when different elements bond chemically.",dbn:"ভিন্ন মৌল রাসায়নিকভাবে যুক্ত হয়ে গঠিত পদার্থ।",ex:"Common salt is a compound of sodium and chlorine.",f:"chem",lv:1},
{w:"Mixture",bn:"মিশ্রণ",d:"Substances combined physically without chemical bonding.",dbn:"রাসায়নিক বন্ধন ছাড়া ভৌতভাবে মেশানো পদার্থ।",ex:"Sand and salt form a mixture that can be separated by water.",f:"chem",lv:1},
{w:"Proton",bn:"প্রোটন",d:"A positively charged particle in the nucleus.",dbn:"নিউক্লিয়াসে থাকা ধনাত্মক আধানের কণা।",ex:"The number of protons decides which element an atom is.",f:"chem",lv:2},
{w:"Neutron",bn:"নিউট্রন",d:"A nuclear particle with no electric charge.",dbn:"নিউক্লিয়াসের আধানহীন কণা।",ex:"Adding a neutron creates a heavier isotope.",f:"chem",lv:2},
{w:"Electron",bn:"ইলেকট্রন",d:"A light, negatively charged particle around the nucleus.",dbn:"নিউক্লিয়াসের চারপাশে থাকা হালকা ঋণাত্মক কণা।",ex:"Chemical bonding involves the outermost electron shell.",f:"chem",lv:2},
{w:"Ion",bn:"আয়ন",d:"An atom that has gained or lost electrons and carries charge.",dbn:"ইলেকট্রন পাওয়া বা হারানো আধানযুক্ত পরমাণু।",ex:"Salt dissolves into ions that let water conduct electricity.",f:"chem",lv:2},
{w:"Isotope",bn:"আইসোটোপ",d:"An atom of an element with a different neutron count.",dbn:"ভিন্ন নিউট্রন সংখ্যাযুক্ত একই মৌলের পরমাণু।",ex:"One isotope of carbon is used for dating old remains.",f:"chem",lv:3},
{w:"Chemical bond",bn:"রাসায়নিক বন্ধন",d:"The attraction that holds atoms together in a substance.",dbn:"যে আকর্ষণ পদার্থে পরমাণুদের ধরে রাখে।",ex:"Breaking a chemical bond usually requires energy.",f:"chem",lv:2},
{w:"Reaction",bn:"বিক্রিয়া",d:"A process rearranging atoms into different substances.",dbn:"যে প্রক্রিয়ায় পরমাণু নতুন করে সেজে ভিন্ন পদার্থ হয়।",ex:"The reaction between vinegar and baking soda releases gas.",f:"chem",lv:1},
{w:"Catalyst",bn:"প্রভাবক",d:"A substance that speeds a reaction without being used up.",dbn:"যে পদার্থ নিজে খরচ না হয়ে বিক্রিয়া দ্রুত করে।",ex:"A catalyst lets the process run at a lower temperature.",f:"chem",lv:3},
{w:"Solution",bn:"দ্রবণ",d:"A mixture in which one substance dissolves evenly in another.",dbn:"এমন মিশ্রণ যেখানে এক পদার্থ অন্যটিতে সমানভাবে দ্রবীভূত।",ex:"Stir until you get a clear sugar solution.",f:"chem",lv:1},
{w:"Solvent",bn:"দ্রাবক",d:"The liquid in which something is dissolved.",dbn:"যে তরলে কিছু দ্রবীভূত হয়।",ex:"Water is often called the universal solvent.",f:"chem",lv:2},
{w:"Solute",bn:"দ্রব",d:"The substance that dissolves in a solvent.",dbn:"দ্রাবকে যে পদার্থ দ্রবীভূত হয়।",ex:"In salt water, salt is the solute.",f:"chem",lv:2},
{w:"Concentration",bn:"ঘনমাত্রা",d:"How much solute is present in a given amount of solution.",dbn:"নির্দিষ্ট পরিমাণ দ্রবণে কতটা দ্রব আছে।",ex:"Dilute the acid to reduce its concentration.",f:"chem",lv:2},
{w:"Acid",bn:"অম্ল",d:"A substance that releases hydrogen ions in water.",dbn:"যে পদার্থ পানিতে হাইড্রোজেন আয়ন ছাড়ে।",ex:"Lemon juice is a mild acid.",f:"chem",lv:1},
{w:"Alkali",bn:"ক্ষার",d:"A soluble base that neutralises acids.",dbn:"দ্রবণীয় ক্ষারক, যা অম্লকে প্রশমিত করে।",ex:"Soap feels slippery because it is an alkali.",f:"chem",lv:2},
{w:"pH",bn:"পিএইচ",d:"A scale from 0 to 14 showing acidity or alkalinity.",dbn:"০ থেকে ১৪ পর্যন্ত স্কেল, যা অম্লতা বা ক্ষারতা দেখায়।",ex:"Farmers test soil pH before choosing a crop.",f:"chem",lv:2},
{w:"Oxidation",bn:"জারণ",d:"A reaction in which a substance loses electrons.",dbn:"যে বিক্রিয়ায় পদার্থ ইলেকট্রন হারায়।",ex:"Oxidation turns a cut apple brown.",f:"chem",lv:2},
{w:"Corrosion",bn:"ক্ষয়",d:"The gradual chemical destruction of a metal surface.",dbn:"ধাতব পৃষ্ঠের ধীর রাসায়নিক ক্ষয়।",ex:"Salt air speeds up corrosion of the boat's fittings.",f:"chem",lv:2},
{w:"Combustion",bn:"দহন",d:"Rapid reaction with oxygen releasing heat and light.",dbn:"অক্সিজেনের সঙ্গে দ্রুত বিক্রিয়া, যা তাপ ও আলো ছাড়ে।",ex:"Combustion in the engine turns fuel into motion.",f:"chem",lv:2},
{w:"Evaporation",bn:"বাষ্পীভবন",d:"A liquid turning into vapour at its surface.",dbn:"তরলের পৃষ্ঠ থেকে বাষ্পে পরিণত হওয়া।",ex:"Evaporation from wet clothes cools the air slightly.",f:"chem",lv:1},
{w:"Condensation",bn:"ঘনীভবন",d:"Vapour cooling and turning back into liquid.",dbn:"বাষ্প ঠান্ডা হয়ে আবার তরলে পরিণত হওয়া।",ex:"Condensation forms droplets on a cold glass.",f:"chem",lv:1},
{w:"Sublimation",bn:"ঊর্ধ্বপাতন",d:"A solid turning straight into gas without melting.",dbn:"কঠিন পদার্থের না গলে সরাসরি গ্যাসে পরিণত হওয়া।",ex:"Camphor disappears by sublimation.",f:"chem",lv:3},
{w:"Distillation",bn:"পাতন",d:"Separating liquids by boiling and cooling the vapour.",dbn:"ফুটিয়ে ও বাষ্প ঠান্ডা করে তরল আলাদা করা।",ex:"Distillation can turn salt water into drinking water.",f:"chem",lv:2},
{w:"Filtration",bn:"পরিস্রাবণ",d:"Separating solids from a liquid using a barrier.",dbn:"বাধা ব্যবহার করে তরল থেকে কঠিন আলাদা করা।",ex:"Simple filtration removes visible dirt from pond water.",f:"chem",lv:1},
{w:"Polymer",bn:"পলিমার",d:"A large molecule built from many repeating units.",dbn:"বহু পুনরাবৃত্ত একক দিয়ে গঠিত বড় অণু।",ex:"Plastic bags are made from a flexible polymer.",f:"chem",lv:3},
{w:"Alloy",bn:"সংকর ধাতু",d:"A metal blended with other elements to improve it.",dbn:"অন্য মৌলের সঙ্গে মিশিয়ে উন্নত করা ধাতু।",ex:"Steel is an alloy of iron and carbon.",f:"chem",lv:2},
{w:"Crystal",bn:"কেলাস",d:"A solid whose atoms sit in a regular repeating pattern.",dbn:"এমন কঠিন পদার্থ যার পরমাণু নিয়মিত নকশায় সাজানো।",ex:"Sugar forms a crystal as the solution slowly dries.",f:"chem",lv:2},
{w:"Cell",bn:"কোষ",d:"The smallest structural unit of a living thing.",dbn:"জীবের ক্ষুদ্রতম গাঠনিক একক।",ex:"A leaf is made of millions of cells.",f:"bio",lv:1},
{w:"Tissue",bn:"কলা",d:"A group of similar cells doing one job together.",dbn:"একই কাজ করা একই ধরনের কোষের সমষ্টি।",ex:"Muscle tissue contracts to move the bone.",f:"bio",lv:2},
{w:"Organ",bn:"অঙ্গ",d:"A body structure made of tissues with a specific function.",dbn:"কলা দিয়ে গঠিত নির্দিষ্ট কাজের দেহকাঠামো।",ex:"The liver is the body's largest internal organ.",f:"bio",lv:1},
{w:"Nucleus",bn:"নিউক্লিয়াস",d:"The control centre of a cell, holding its DNA.",dbn:"কোষের নিয়ন্ত্রণকেন্দ্র, যেখানে ডিএনএ থাকে।",ex:"The nucleus keeps the genetic instructions safe.",f:"bio",lv:2},
{w:"Membrane",bn:"ঝিল্লি",d:"A thin layer controlling what enters and leaves.",dbn:"পাতলা স্তর, যা কী ঢুকবে ও বেরোবে তা নিয়ন্ত্রণ করে।",ex:"The cell membrane lets nutrients in but blocks waste.",f:"bio",lv:2},
{w:"Chlorophyll",bn:"ক্লোরোফিল",d:"The green pigment plants use to capture sunlight.",dbn:"সবুজ রঞ্জক, যা দিয়ে গাছ সূর্যালোক ধরে।",ex:"Leaves lose chlorophyll and turn yellow in autumn.",f:"bio",lv:2},
{w:"Photosynthesis",bn:"সালোকসংশ্লেষণ",d:"Plants making sugar from light, water and carbon dioxide.",dbn:"আলো, পানি ও কার্বন ডাই-অক্সাইড থেকে গাছের শর্করা তৈরি।",ex:"Photosynthesis releases the oxygen we breathe.",f:"bio",lv:2},
{w:"Respiration",bn:"শ্বসন",d:"Cells releasing energy from food, usually using oxygen.",dbn:"সাধারণত অক্সিজেন ব্যবহার করে কোষের খাদ্য থেকে শক্তি মুক্তি।",ex:"Respiration continues in plants during the night.",f:"bio",lv:2},
{w:"Enzyme",bn:"উৎসেচক",d:"A protein that speeds up a reaction inside a body.",dbn:"প্রোটিন, যা শরীরের ভেতরের বিক্রিয়া দ্রুত করে।",ex:"An enzyme in saliva begins breaking down starch.",f:"bio",lv:3},

{w:"Correlation",bn:"সহসম্পর্ক",d:"A pattern where two things vary together.",dbn:"এমন নকশা যেখানে দুটি বিষয় একসঙ্গে বদলায়।",ex:"Correlation alone does not prove one causes the other.",f:"method",lv:2},

{w:"Sample",bn:"নমুনা",d:"A smaller group chosen to represent a whole population.",dbn:"পুরো জনগোষ্ঠীর প্রতিনিধিত্বে বাছাই করা ছোট দল।",ex:"They surveyed a sample of two thousand households.",f:"method",lv:2},

var TRIES={en:["rain","magnet","gravity","vaccine"],bn:["বৃষ্টি","চুম্বক","মাধ্যাকর্ষণ","টিকা"]};

function t(k){return UI[k][lang]}
function catName(k){for(var i=0;i<CATS.length;i++){if(CATS[i].k===k)return CATS[i][lang]}return k}
function fieldName(k){for(var i=0;i<FIELDS.length;i++){if(FIELDS[i].k===k)return FIELDS[i][lang]}return k}
function el(id){return document.getElementById(id)}
var BN="০১২৩৪৫৬৭৮৯";
function nm(v){v=String(v);return lang==="bn"?v.replace(/[0-9]/g,function(d){return BN[+d]}):v}
function pad(v,n){return nm(String(v).padStart(n,"0"))}
function hashOf(n){return "#t-"+String(n).padStart(3,"0")}
function entryNo(n){return (lang==="bn"?"বিষয় ":"No. ")+pad(n,3)}
function findTopic(n){for(var i=0;i<TOPICS.length;i++){if(TOPICS[i].i===n)return TOPICS[i]}return null}
function countText(n,tot){return lang==="bn"?nm(tot)+"টি বিষয়ের মধ্যে "+nm(n)+"টি দেখানো হচ্ছে":"showing "+n+" of "+tot+" topics"}
function catCount(k){var c=0;for(var i=0;i<TOPICS.length;i++){if(k==="all"||TOPICS[i].cat===k)c++}return c}
function store(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function recall(k){try{return localStorage.getItem(k)}catch(e){return null}}

function entryHTML(x,wide){
  return '<a class="entry'+(wide?' wide':'')+'" href="'+hashOf(x.i)+'">'+
    '<div class="plate">'+x.svg+'</div>'+
    '<div><p class="meta"><b>'+entryNo(x.i)+'</b><span>'+catName(x.cat)+'</span></p>'+
    '<h3>'+x.t[lang]+'</h3><p class="sum">'+x.s[lang]+'</p>'+
    (wide?'<span class="go">'+t("readEntry")+' &rarr;</span>':'')+'</div></a>';
}

/* ================= lede ================= */
var dailyTopic=null, factPick=null;
function todayIndex(){
  var d=new Date();
  var start=Date.UTC(d.getFullYear(),0,0), now=Date.UTC(d.getFullYear(),d.getMonth(),d.getDate());
  return (d.getFullYear()*366+Math.floor((now-start)/864e5))%TOPICS.length;
}
function dateText(){
  try{return new Date().toLocaleDateString(lang==="bn"?"bn-BD":"en-GB",{day:"numeric",month:"long",year:"numeric"})}
  catch(e){return ""}
}
function drawStats(){
  var s=[[TOPICS.length,"stTopics"],[VOCAB.length,"stWords"],[CATS.length-1,"stSubjects"],[2,"stLangs"]],h="";
  for(var i=0;i<s.length;i++){h+='<div><dt>'+t(s[i][1])+'</dt><dd>'+nm(s[i][0])+'</dd></div>'}
  el("stats").innerHTML=h;
}
function drawDaily(){
  if(!dailyTopic)dailyTopic=TOPICS[todayIndex()];
  var x=dailyTopic;
  el("daily").innerHTML=
    '<div class="daily-head"><b id="dailyLbl">'+t("daily")+'</b><span>'+dateText()+'</span></div>'+
    '<a class="daily-plate plate" href="'+hashOf(x.i)+'" tabindex="-1" aria-hidden="true">'+x.svg+'</a>'+
    '<h2><a href="'+hashOf(x.i)+'">'+x.t[lang]+'</a></h2>'+
    '<p class="meta"><b>'+entryNo(x.i)+'</b><span>'+catName(x.cat)+'</span></p>'+
    '<p>'+x.s[lang]+'</p>'+
    '<div class="daily-foot"><a class="link" href="'+hashOf(x.i)+'">'+t("readEntry")+' &rarr;</a>'+
    '<button type="button" class="link quiet" id="surprise">'+t("surprise")+'</button></div>';
  el("surprise").onclick=function(){
    var n=TOPICS[Math.floor(Math.random()*TOPICS.length)].i;
    location.hash=hashOf(n);
  };
}
function pickFact(){
  var x=TOPICS[Math.floor(Math.random()*TOPICS.length)];
  factPick={i:x.i,p:Math.floor(Math.random()*x.pts.length)};
}
function drawFact(){
  if(!factPick)pickFact();
  var x=findTopic(factPick.i), f=x.pts[factPick.p][lang];
  var src=lang==="bn"
    ? '— <a href="'+hashOf(x.i)+'">'+entryNo(x.i)+', '+x.t.bn+'</a> থেকে'
    : '— from <a href="'+hashOf(x.i)+'">'+entryNo(x.i)+', '+x.t.en+'</a>';
  el("fact").innerHTML='<span class="fact-lbl">'+t("factLbl")+'</span>'+
    '<div><q>'+f+'</q><span class="fact-src">'+src+'</span></div>'+
    '<button type="button" class="link quiet" id="anotherFact">'+t("another")+' &#8635;</button>';
  el("anotherFact").onclick=function(){pickFact();drawFact()};
}

/* ================= contents ================= */
function drawChips(){
  var h="";
  for(var i=0;i<CATS.length;i++){
    h+='<button type="button" data-c="'+CATS[i].k+'" aria-pressed="'+(cat===CATS[i].k)+'">'+CATS[i][lang]+'<sup>'+nm(catCount(CATS[i].k))+'</sup></button>';
  }
  el("chips").innerHTML=h;
  var b=el("chips").querySelectorAll("button");
  for(var j=0;j<b.length;j++){
    b[j].onclick=function(){cat=this.getAttribute("data-c");drawChips();drawGrid();};
  }
}
function match(x){
  if(cat!=="all"&&x.cat!==cat)return false;
  if(!query)return true;
  var q=query.toLowerCase();
  return (x.t.en+" "+x.t.bn+" "+x.s.en+" "+x.s.bn+" "+x.k).toLowerCase().indexOf(q)>-1;
}
function drawGrid(){
  var list=TOPICS.filter(match),h="";
  for(var i=0;i<list.length;i++){
    var r=i%10;
    h+=entryHTML(list[i],list.length>2&&(r===0||r===6));
  }
  if(!list.length){
    var tries="";
    for(var k=0;k<TRIES[lang].length;k++){tries+='<button type="button" class="link quiet" data-q="'+TRIES[lang][k]+'">'+TRIES[lang][k]+'</button>'}
    h='<div class="empty"><h3>'+t("noResultT")+'</h3><p>'+t("noResult")+'</p>'+
      '<div class="tries"><span class="meta">'+t("tryLbl")+'</span>'+tries+'</div></div>';
  }
  el("grid").innerHTML=h;
  el("count").textContent=countText(list.length,TOPICS.length);
  var tb=el("grid").querySelectorAll("[data-q]");
  for(var j=0;j<tb.length;j++){
    tb[j].onclick=function(){setQuery(this.getAttribute("data-q"));cat="all";drawChips();drawGrid();};
  }
}
function setQuery(v){
  el("q").value=v;query=v.trim();
  el("searchWrap").classList.toggle("has",!!query);
}

/* ================= article ================= */
var cur=null, lastFocus=null, openedFromApp=false, baseHash="#explore";
function isOpen(){return el("detail").classList.contains("open")}
function openTopic(n){
  var x=findTopic(n);
  if(!x)return;
  var wasOpen=isOpen();
  if(!wasOpen)lastFocus=document.activeElement;
  cur=n;
  var idx=TOPICS.indexOf(x);
  el("dCrumb").innerHTML='<b>'+entryNo(x.i)+'</b> · '+catName(x.cat);
  el("dNum").textContent=entryNo(x.i)+" · "+catName(x.cat);
  el("dTitle").textContent=x.t[lang];
  el("dSum").textContent=x.s[lang];
  el("dPlate").innerHTML=x.svg;
  var lg="";
  for(var a=0;a<x.legend.length;a++){
    lg+='<li><span class="n">'+(a+1)+'</span><span>'+x.legend[a][lang]+'</span></li>';
  }
  el("dLegend").innerHTML=lg;
  el("lblFigure").textContent=t("figure")+" "+pad(x.i,3);
  el("dBody").textContent=x.body[lang];
  var f="";
  for(var b=0;b<x.pts.length;b++){f+='<li><span>'+x.pts[b][lang]+'</span></li>'}
  el("dFacts").innerHTML=f;

  var prev=TOPICS[idx-1], next=TOPICS[idx+1];
  el("prevT").disabled=!prev;
  el("nextT").disabled=!next;
  el("pn").innerHTML=
    (prev?'<a class="prev" href="'+hashOf(prev.i)+'" data-n="'+prev.i+'"><small>&larr; '+t("prevEntry")+'</small><span>'+prev.t[lang]+'</span></a>':'<span></span>')+
    (next?'<a class="next" href="'+hashOf(next.i)+'" data-n="'+next.i+'"><small>'+t("nextEntry")+' &rarr;</small><span>'+next.t[lang]+'</span></a>':'');
  var pl=el("pn").querySelectorAll("a");
  for(var p=0;p<pl.length;p++){
    pl[p].onclick=function(e){e.preventDefault();step(parseInt(this.getAttribute("data-n"),10))};
  }

  var same=TOPICS.filter(function(y){return y.cat===x.cat&&y.i!==x.i});
  var start=0;for(var s=0;s<same.length;s++){if(same[s].i>x.i){start=s;break}}
  var rel="";
  for(var r=0;r<Math.min(3,same.length);r++){rel+=entryHTML(same[(start+r)%same.length],false)}
  el("dRelated").innerHTML=rel;
  el("relCat").textContent=catName(x.cat);

  el("detail").classList.add("open");
  setInert(true);
  document.documentElement.classList.add("locked");
  el("detail").scrollTop=0;
  document.title=x.t[lang]+" · বিজ্ঞান খাতা";
  if(!wasOpen)el("dTitle").focus({preventScroll:true});
}
function step(n){
  if(!findTopic(n))return;
  history.replaceState(null,"",hashOf(n));
  openTopic(n);
}
function setInert(on){["mast","main","colophon"].forEach(function(id){if(on)el(id).setAttribute("inert","");else el(id).removeAttribute("inert")})}
function closeTopic(){
  el("detail").classList.remove("open");
  setInert(false);
  document.documentElement.classList.remove("locked");
  document.title="বিজ্ঞান খাতা · The Science Notebook";
  cur=null;
  if(lastFocus&&document.contains(lastFocus)){try{lastFocus.focus({preventScroll:true})}catch(e){}}
  lastFocus=null;
}
function requestClose(){
  if(openedFromApp){history.back();return}
  history.replaceState(null,"",baseHash);
  closeTopic();
}
el("closeDetail").onclick=requestClose;
el("prevT").onclick=function(){var i=TOPICS.indexOf(findTopic(cur));if(i>0)step(TOPICS[i-1].i)};
el("nextT").onclick=function(){var i=TOPICS.indexOf(findTopic(cur));if(i>-1&&i<TOPICS.length-1)step(TOPICS[i+1].i)};

/* ================= flashcards ================= */
var deck=[],pos=0,known=0,pool=[];
function shuffle(a){var r=a.slice();for(var i=r.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t2=r[i];r[i]=r[j];r[j]=t2}return r}
function fillSelects(){
  var h="";for(var i=0;i<FIELDS.length;i++){h+='<option value="'+FIELDS[i].k+'">'+FIELDS[i][lang]+'</option>'}
  var fs=el("fieldSel"),keep=fs.value;fs.innerHTML=h;if(keep)fs.value=keep;
  h="";for(var j=0;j<LVLS.length;j++){h+='<option value="'+LVLS[j].k+'">'+LVLS[j][lang]+'</option>'}
  var ls=el("lvlSel"),keep2=ls.value;ls.innerHTML=h;if(keep2)ls.value=keep2;
}
function newDeck(){
  var f=el("fieldSel").value||"all", lv=el("lvlSel").value||"all";
  pool=VOCAB.filter(function(v){
    if(f!=="all"&&v.f!==f)return false;
    if(lv!=="all"&&String(v.lv)!==lv)return false;
    return true;
  });
  deck=shuffle(pool).slice(0,30);pos=0;known=0;
  el("doneArea").classList.add("hidden");
  el("deckEmpty").classList.toggle("hidden",!!deck.length);
  el("deckArea").classList.toggle("hidden",!deck.length);
  if(!deck.length){el("deckEmpty").textContent=t("nodeck");return}
  showCard();
}
function lvlHTML(lv){return '<i></i><i></i><i></i>'+LVLS[lv][lang]}
function showCard(){
  if(pos>=deck.length){finish();return}
  var v=deck[pos];
  el("flip").classList.remove("turned");setFace(false);
  el("fWord").textContent=v.w;
  el("fField").textContent=fieldName(v.f);
  el("bField").textContent=fieldName(v.f);
  el("fLvl").innerHTML=lvlHTML(v.lv);el("fLvl").setAttribute("data-lv",v.lv);
  el("bLvl").innerHTML=lvlHTML(v.lv);el("bLvl").setAttribute("data-lv",v.lv);
  el("bWord").textContent=v.w;
  el("bBn").textContent=v.bn;
  el("bDef").textContent=(lang==="bn"?v.dbn:v.d);
  el("bEx").textContent="“"+v.ex+"”";
  el("fHint").textContent=t("tapHint");
  el("pcount").textContent=pad(pos+1,2)+" / "+pad(deck.length,2);
  el("pknown").textContent=t("known")+" "+nm(known);
  el("pbar").style.width=(pos/deck.length*100)+"%";
}
function advance(ok){
  if(pos>=deck.length)return;
  if(ok)known++;else deck.push(deck[pos]);
  pos++;showCard();
}
function finish(){
  el("deckArea").classList.add("hidden");
  el("doneArea").classList.remove("hidden");
  el("doneScore").textContent=nm(known)+" / "+nm(deck.length);
}
function setFace(back){el("faceFront").setAttribute("aria-hidden",back);el("faceBack").setAttribute("aria-hidden",!back)}
function flipCard(){setFace(el("flip").classList.toggle("turned"))}
el("flip").onclick=flipCard;
el("know").onclick=function(){advance(true)};
el("again").onclick=function(){advance(false)};
el("newDeck").onclick=newDeck;
el("againDeck").onclick=newDeck;
el("fieldSel").onchange=newDeck;
el("lvlSel").onchange=newDeck;

  '<p>এটি একটি একক স্বয়ংসম্পূর্ণ পাতা। একশোটি বিষয়, প্রতিটি নকশা এবং পাঁচশো শব্দের কার্ডভাণ্ডার — সবই এই একটি ফাইলের ভেতরে, তাই একবার সংরক্ষণ করলে ইন্টারনেট ছাড়াই চলে।</p>'+
  '<p>ব্যাখ্যাগুলো এমন পাঠকের জন্য যাঁর প্রাতিষ্ঠানিক বিজ্ঞানশিক্ষা কম, কিন্তু যাঁকে ছোট করে বোঝানো চলবে না। প্রতিটি বিষয়ে থাকে নম্বরচিহ্নিত একটি নকশা, সেই নম্বরের সঙ্গে মেলানো ব্যাখ্যা, সহজ ভাষায় সংক্ষিপ্ত বিবরণ এবং মনে রাখার মতো তিনটি তথ্য।</p>'+
  '<h2>যেভাবে ব্যবহার করবেন</h2>'+
  '<ul><li>খোঁজা যায় দুই ভাষাতেই — <b>বৃষ্টি</b> বা <b>rain</b> লিখলে একই বিষয়ে পৌঁছাবেন।</li>'+
  '<li>EN / বাংলা সুইচ পাতার প্রতিটি শব্দ বদলে দেয়, নকশার ব্যাখ্যাসহ।</li>'+
  '<li>শব্দকার্ডে একবারে ত্রিশটি শব্দ আসে। "আবার দেখব" চিহ্নিত শব্দ একই রাউন্ডে ফিরে আসে।</li>'+
  '<li>সেট নেওয়ার আগে বিষয় ও কঠিনতা অনুযায়ী শব্দভাণ্ডার ছেঁকে নিতে পারেন।</li></ul>'+
  '<h2>নির্ভুলতা প্রসঙ্গে</h2>'+
  '<p>যেখানে প্রচলিত ব্যাখ্যা ভুল, এই খাতা তা স্পষ্ট করেই বলে — ভারী জিনিস দ্রুত পড়ে না, রকেট বাতাসে ধাক্কা দিয়ে চলে না, আর ট্রেন ফ্ল্যাঞ্জের কারণে লাইনে থাকে না। যেখানে বিজ্ঞানীদের মধ্যে সত্যিই মতভেদ আছে বা এখনো জানা যায়নি, তা ঢেকে না রেখে বলে দেওয়া হয়েছে।</p>';
  el("aboutBox").innerHTML=(lang==="en"?en:bn);

  var a='<h2>'+t("bySubject")+'</h2><dl>';
  for(var i=1;i<CATS.length;i++){a+='<div><dt>'+CATS[i][lang]+'</dt><dd>'+nm(catCount(CATS[i].k))+'</dd></div>'}
  a+='</dl><h2>'+t("byLevel")+'</h2><dl>';
  for(var j=1;j<LVLS.length;j++){
    var c=VOCAB.filter(function(v){return String(v.lv)===LVLS[j].k}).length;
    a+='<div><dt>'+LVLS[j][lang]+'</dt><dd>'+nm(c)+'</dd></div>';
  }
  el("aboutAside").innerHTML=a+'</dl>';
}

/* ================= language + views ================= */
function applyLang(){
  document.documentElement.lang=(lang==="bn"?"bn":"en");
  var lb=document.querySelectorAll(".langtog button");
  for(var i=0;i<lb.length;i++){lb[i].setAttribute("aria-pressed",lb[i].getAttribute("data-lang")===lang)}
  var lg=document.querySelectorAll(".langtog");
  for(var g=0;g<lg.length;g++){lg[g].setAttribute("aria-label",t("langAria"))}
  var ids=["qLbl","fieldLbl","lvlLbl","brandSub","tabExplore","tabCards","tabAbout","heroText","heroEyebrow","cardEyebrow","cardTitle","cardText",
    "newDeck","again","know","doneTitle","doneText","againDeck","footText","toTop"];
  for(var k=0;k<ids.length;k++){el(ids[k]).textContent=t(ids[k])}
  el("skipLink").textContent=t("skip");
  el("heroTitle").innerHTML=t("heroTitle");
  el("contentsTitle").textContent=t("contents");
  el("keys").innerHTML=t("keys");
  el("backLbl").textContent=t("back");
  el("prevT").setAttribute("aria-label",t("prevEntry"));
  el("nextT").setAttribute("aria-label",t("nextEntry"));
  el("lblExplain").textContent=t("explain");
  el("lblFacts").textContent=t("facts");
  el("lblRelated").textContent=t("related");
  el("q").placeholder=t("qPlace");
  el("clearQ").setAttribute("aria-label",t("clearQ"));
  el("chips").setAttribute("aria-label",t("subjects"));
  el("nav").setAttribute("aria-label",t("navAria"));
  fillSelects();drawStats();drawDaily();drawFact();drawChips();drawGrid();drawAbout();
  if(deck.length&&pos<deck.length)showCard();
  if(!el("doneArea").classList.contains("hidden"))el("doneScore").textContent=nm(known)+" / "+nm(deck.length);
  if(!el("deckEmpty").classList.contains("hidden"))el("deckEmpty").textContent=t("nodeck");
  if(cur!==null&&isOpen())openTopic(cur);
}
function setLang(l){
  if(l===lang)return;
  lang=l;store("bk-lang",l);applyLang();
}
var viewScroll={};
function setView(v,focus){
  var changed=(v!==view);
  if(changed)viewScroll[view]=window.scrollY;
  view=v;
  el("viewExplore").classList.toggle("hidden",v!=="explore");
  el("viewCards").classList.toggle("hidden",v!=="cards");
  el("viewAbout").classList.toggle("hidden",v!=="about");
  var tabs={explore:"tabExplore",cards:"tabCards",about:"tabAbout"};
  for(var k in tabs){
    if(k===v)el(tabs[k]).setAttribute("aria-current","page");else el(tabs[k]).removeAttribute("aria-current");
  }
  if(changed){
    var root=document.documentElement,sb=root.style.scrollBehavior;
    root.style.scrollBehavior="auto";window.scrollTo(0,viewScroll[v]||0);root.style.scrollBehavior=sb;
    if(focus){var h={explore:"heroTitle",cards:"cardTitle",about:"aboutTitle"}[v];if(el(h))el(h).focus({preventScroll:true})}
  }
}

/* ================= routing ================= */
function route(fromApp){
  var h=location.hash.replace(/^#/,"");
  var m=/^t-(\d{1,3})$/.exec(h);
  if(m&&findTopic(parseInt(m[1],10))){
    if(!isOpen())openedFromApp=!!fromApp;
    openTopic(parseInt(m[1],10));
    return;
  }
  if(isOpen())closeTopic();
  var v=(h==="cards"||h==="about")?h:"explore";
  baseHash="#"+v;
  setView(v,!!fromApp);
}
window.addEventListener("hashchange",function(){route(true)});

var lb2=document.querySelectorAll(".langtog button");
for(var q2=0;q2<lb2.length;q2++){lb2[q2].onclick=function(){setLang(this.getAttribute("data-lang"))}}
var qTimer=null;
el("q").addEventListener("input",function(){
  query=this.value.trim();
  el("searchWrap").classList.toggle("has",!!query);
  clearTimeout(qTimer);qTimer=setTimeout(drawGrid,120);
});
el("clearQ").onclick=function(){setQuery("");drawGrid();el("q").focus()};
el("toTop").onclick=function(){window.scrollTo(0,0);var b=document.querySelector(".brand");if(b)b.focus({preventScroll:true})};
el("skipLink").onclick=function(e){e.preventDefault();var m=el("main");m.setAttribute("tabindex","-1");m.focus();};

document.addEventListener("keydown",function(e){
  var tag=(e.target&&e.target.tagName)||"";
  var typing=/INPUT|SELECT|TEXTAREA/.test(tag);
  if(e.key==="Escape"&&isOpen()){requestClose();return}
  if(isOpen()){
    if(typing)return;
    if(e.key==="ArrowLeft"&&!el("prevT").disabled){el("prevT").click()}
    else if(e.key==="ArrowRight"&&!el("nextT").disabled){el("nextT").click()}
    return;
  }
  if(typing||e.metaKey||e.ctrlKey||e.altKey)return;
  if(view==="explore"&&e.key==="/"){e.preventDefault();el("q").focus();return}
  if(view==="cards"&&!el("deckArea").classList.contains("hidden")){
    if(e.key==="ArrowRight"){e.preventDefault();advance(true)}
    else if(e.key==="ArrowLeft"){e.preventDefault();advance(false)}
    else if(e.key===" "&&tag!=="BUTTON"){e.preventDefault();flipCard()}
  }
});

/* ================= go ================= */
(function(){
  var saved=recall("bk-lang");
  if(saved==="en"||saved==="bn")lang=saved;
  else if(/^bn/i.test(navigator.language||""))lang="bn";
  applyLang();
  newDeck();
  route(false);
})();
</script>
